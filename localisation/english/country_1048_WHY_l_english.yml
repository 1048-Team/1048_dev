  ###Unit Leader Traits###
  heartless:0 "Heartless"
  heartless_desc:0 "§LThe concept of mercy or forgiveness is foreign to Opaline. An archetypal inquisitor, her ambitions to serve Daybreaker and eradicate any and all heresy have provided her with ample opportunity within Whinnyapolis with which to further her influence within the Inquisitionis. She will push her troops to the breaking point and then push harder still.§!"
  the_last_soldier:0 "The Last Soldier"
  the_last_soldier_desc:0 "§LWhen Solar Strike first arrived in Whinnyapolis, there was much hope of a quick and simple conquest before returning the territory to the Empire. But after four long, arduous years, he has been bogged down by administering a region that is always on the brink of collapse. Even with all his duties, the last true soldier for Daybreaker will serve her to the end, as will his troops.§!"
  the_friendly_heretic:0 "Friendly Heretic"
  the_friendly_heretic_desc:0 "§LAs the head priestess that went with Solar Strike, Horizon Sunrise carries with her a charismatic weight that few can resist. Behind the thin veneer of geniality lies a cunning heretic who is rarely questioned, such is the respect that she has earned from others. Her troops, corrupted from the values of the Solar Empire, still fight for the Empress currently, with even more ferocity than others within the nation.§!"
  
  ###Leader Descriptions###
  ayza_desc:0 "§YBorn:§! §L10th of March, 1024 ALB in Hollow Shades§!\n\n§YBiography:§! §LWhile the Solaris Adoratio is the branch of the Solaris Cultus that is focused entirely on the veneration of Daybreaker and enforcing orthodoxy of theology, they are remarkably stingy on the arts. Most depictions of the God-Empress are in stained glass and statues, not on other avenues of expression, such as art and poetry. While such priestesses exist, they are uncommon, and usually ignored within the greater Cultus. However, that is not the case in all Ordos.\n\nAs she comes from Ordo Silva, one of the more tolerant Ordos within the Empire, Ayza was not discouraged from her interest in creation of any sort. One of her first displays was completed when she was barely a young mare, in 1036. While the Empress did not attend as was hoped, her exhibit of the Waltz of the Flame received glowing praise from the Archmage, Burning Plage, and was kept on display in a magically sealed section of the local church, where ponies could watch it for months before finally the magic that it used was exhausted. In this time, Ayza continued to improve, and the second display she created mixed both dancing flames, electric hoops, and clever refractions of light to paint a mosaic of the Empress upon any wall it was cast upon.\n\nAlthough infernal art is her specialty, she also has been formally trained as an artist, a poet, and a stained glass worker. When Solar Strike began to gather ponies eager to do something for the Empress, Ayza volunteered, as the experience of liberating some of the Empress's territory would no doubt drive further works of art for her to create. Her works are popular with the majority of our citizens on all fronts for their beauty, and she has endeared herself for her soft-spoken, if chipper demeanor when approached. She has remained more than happy to stay with us, as long as the Empress requires, so that she may create a true magnum opus to display one day in Sanctum Solar itself.§!\n\n§YPortrait by:§! §LJulunis14§!"
  POLITICS_SOLAR_STRIKE_DESC:0 "§YBorn:§! 28th of February, 1007 ALB outside of Ponyville\n\n§YBiography:§! For years, Solar Strike was the model of an Imperial general, as he claims to remain to this day. Like one of his contemporaries and friends, Scorched Earth, he is part of the rump of the "Placated Generation," which includes all those born just before the Great War. Although he was not near the border with the changelings when the war broke out, he has never quite known what peace is, as he has bounced from one position to the next.\n\nSolar Strike's life in the region of Ponyville was uneventful, until he happened to be in that town on the fateful day that Daybreaker battled with some of the last open harmonist forces in the Solar Empire. Although he was not near to the conflict in the town, he still saw the forces under the first High Priestess, Padlock, fight in the streets, the buildings, and eventually at the doors of Twilight's castle and the School of Friendship itself. Rather than fear it, it intrigued him, and he focused his efforts on preparing for becoming an officer in the Solaris Militarum.\n\nThat day eventually came, and after an accelerated time in the military college in Sanctum Solar, where he formed a friendship with another military-minded pony in Scorched Earth, he was placed under the tutelage of General Thunderbolt Sentinel. Eventually promoted to the rank of lieutenant colonel, he assisted in putting down an uprising along the Balish border, which staved off hotter conflicts with the uppity technocracy. For the next dozen years, he went from division to division, ensuring they were up to the quality that Daybreaker had set before all leaders in the Solar Empire.\n\nAs the 1040s dawned, the communists in Marechester grew increasingly unstable, something that was not lost on some of the Solaris Militarum. While they were ostensibly barred from doing anything without Daybreaker's approval, that didn't deter Solar Strike. In 1043, he gathered troops, Adoratio and Inquisitionis support, and left, directly through Bales, which almost caused a new incident with the technocracy. Wresting control of Whinnyapolis was not difficult, but since then, the communists still in the city have made life difficult. Yet he remains outwardly faithful to Daybreaker, despite tolerating increasingly unorthodox beliefs under his emergency junta's tenure. While his cool and stern attitude may make him appear outwardly as an ideal Solarist general, he has also started taking things further. He now reigns as the Lord Commander Militant in Whinnyapolis, and it will only be a matter of time before he finally finishes what he started. What that will be remains to be seen.\n\n§YPortrait by:§! NHEball"
  solar_strike_general_desc:0 "§YRank:§! §LLord Commander Militant§!\n\n§YBorn:§! §L28th of February, 1007 ALB outside of Ponyville§!\n\n§YBiography:§! §LFor years, Solar Strike was the model of an Imperial general, as he claims to remain to this day. Like one of his contemporaries and friends, Scorched Earth, he is part of the rump of the "Placated Generation," which includes all those born just before the Great War. Although he was not near the border with the changelings when the war broke out, he has never quite known what peace is, as he has bounced from one position to the next.\n\nSolar Strike's life in the region of Ponyville was uneventful, until he happened to be in that town on the fateful day that Daybreaker battled with some of the last open harmonist forces in the Solar Empire. Although he was not near to the conflict in the town, he still saw the forces under the first High Priestess, Padlock, fight in the streets, the buildings, and eventually at the doors of Twilight's castle and the School of Friendship itself. Rather than fear it, it intrigued him, and he focused his efforts on preparing for becoming an officer in the Solaris Militarum.\n\nThat day eventually came, and after an accelerated time in the military college in Sanctum Solar, where he formed a friendship with another military-minded pony in Scorched Earth, he was placed under the tutelage of General Thunderbolt Sentinel. Eventually promoted to the rank of lieutenant colonel, he assisted in putting down an uprising along the Balish border, which staved off hotter conflicts with the uppity technocracy. For the next dozen years, he went from division to division, ensuring they were up to the quality that Daybreaker had set before all leaders in the Solar Empire.\n\nAs the 1040s dawned, the communists in Marechester grew increasingly unstable, something that was not lost on some of the Solaris Militarum. While they were ostensibly barred from doing anything without Daybreaker's approval, that didn't deter Solar Strike. In 1043, he gathered troops, Adoratio and Inquisitionis support, and left, directly through Bales, which almost caused a new incident with the technocracy. Wresting control of Whinnyapolis was not difficult, but since then, the communists still in the city have made life difficult. Yet he remains outwardly faithful to Daybreaker, despite tolerating increasingly unorthodox beliefs under his emergency junta's tenure. While his cool and stern attitude may make him appear outwardly as an ideal Solarist general, he has also started taking things further. He now reigns as the Lord Commander Militant in Whinnyapolis, and it will only be a matter of time before he finally finishes what he started. What that will be remains to be seen.§!\n\n§YPortrait by:§! §LNHEball§!"
  opaline_arcana_general_desc:0 "§YRank:§! §LArchmage§!\n\n§YBorn:§! §L17th of July, 1011 ALB in Sanctum Solar§!\n\n§YBiography:§! §LOpaline Arcana hails from a long, distinguished line of unicorn mages who lived in Sanctum Solar, or as it was once known, Canterlot. The Arcana family name was not incredibly well-known, but her parents and grandparents were most renowned for their ability to manipulate fire with their magic, and her parents fought directly in the battle of Canterlot in 1002. When Opaline was born, her father had just departed for the front lines of the Great War, and her mother remained in Canterlot to raise her as well as perform services to the community as a mage of some power.\n\nUnlike most pony families, the Arcanas kept pride in their name, and ensured it survived for generations. Opaline was the only pony of the next Arcana generation, and Fate would keep it that way. As the Great War worsened, her father was killed in a pincer ambush by the changelings and her mother perished a few months later when Stalliongrad invaded the capital and Daybreaker ascended. Little more than a young foal, she never received foster care, for Daybreaker's Solaris Cultus found her as she tried to survive at the young age of three. Despite being barely out of infancy, she already had a command of fire magic, much like her parents.\n\nIn time, she was raised to be an inquisitor in the Solaris Inquisitionis. Without a proper parental upbringing, she was routinely aggressive and domineering to her fellow fillies and colts growing up in the cult. This behavior was never punished and only grew into a proper ego after she passed her tests for becoming an acolyte within the order with little issue. By the time she was able to perform her own missions, the Empire had completely collapsed, but heresy was far from eradicated. Over her tenure in Ordo Silva, she both chafed under Archmage Burning Plage and arrested almost five hundred heretics, each of them guilty. Her achievements earned her the attention of Daybreaker, who promoted her to Archmage, to be given an Ordo at a later time. She willingly went with Solar Strike north, to cleanse the communists there, where she commanded all the inquisitors that also followed him.\n\nWhile she is clearly egomanical and sadistic, a common trope among many inquisitors, she has kept the Ordo in line as best she could and ensured that Solar Strike has at least a modicum of authority as he struggles to stabilize his communist-infested territory.§!\n\n§YPortrait by:§! §LAdagioString§!"
  POLITICS_OPALINE_ARCANA_DESC:0 "§YBorn:§! 17th of July, 1011 ALB in Sanctum Solar\n\n§YBiography:§! Opaline Arcana hails from a long, distinguished line of unicorn mages who lived in Sanctum Solar, or as it was once known, Canterlot. The Arcana family name was not incredibly well-known, but her parents and grandparents were most renowned for their ability to manipulate fire with their magic, and her parents fought directly in the battle of Canterlot in 1002. When Opaline was born, her father had just departed for the front lines of the Great War, and her mother remained in Canterlot to raise her as well as perform services to the community as a mage of some power.\n\nUnlike most pony families, the Arcanas kept pride in their name, and ensured it survived for generations. Opaline was the only pony of the next Arcana generation, and Fate would keep it that way. As the Great War worsened, her father was killed in a pincer ambush by the changelings and her mother perished a few months later when Stalliongrad invaded the capital and Daybreaker ascended. Little more than a young foal, she never received foster care, for Daybreaker's Solaris Cultus found her as she tried to survive at the young age of three. Despite being barely out of infancy, she already had a command of fire magic, much like her parents.\n\nIn time, she was raised to be an inquisitor in the Solaris Inquisitionis. Without a proper parental upbringing, she was routinely aggressive and domineering to her fellow fillies and colts growing up in the cult. This behavior was never punished and only grew into a proper ego after she passed her tests for becoming an acolyte within the order with little issue. By the time she was able to perform her own missions, the Empire had completely collapsed, but heresy was far from eradicated. Over her tenure in Ordo Silva, she both chafed under Archmage Burning Plage and arrested almost five hundred heretics, each of them guilty. Her achievements earned her the attention of Daybreaker, who promoted her to Archmage, to be given an Ordo at a later time. She willingly went with Solar Strike north, to cleanse the communists there, where she commanded all the inquisitors that also followed him.\n\nWith Solar Strike out of the way, her egomania is more apparent than ever. Not just content with an Ordo, she seeks to gain her birthright that she was denied with the death of her parents. Malicious, conniving, and egocentric, she has shrugged off Daybreaker's chains and desires to claim the crown of alicornhood herself. Only then will the legacy of the Arcanas be fulfilled.\n\n§YPortrait by:§! AdagioString"

  ###National Spirits###
  WHY_communist_agitators:0 "Commune Agitators"
  WHY_communist_agitators_desc:0 "As former territory of the [NER.GetName], most ponies in Whinnyapolis and the surrounding regions have resisted our rule. Tension in Whinnyapolis is continuing to boil, as clashes with our soldiers and those who wish to see the former commune returned escalate. A permanent solution must be found soon."
  WHY_ephemeral_rule:0 "Ephemeral Rule"
  WHY_ephemeral_rule_desc:0 "Most of the country still refuses to acknowledge the Junta's command, despite our attempts to pacify and integrate them after Marechester was pushed out of the region. With our limited ponypower, there is very little we can do at this time, as we have more important concerns in Whinnyapolis itself."
  WHY_forced_conscription:0 "Excessive Conscription"
  WHY_forced_conscription_desc:0 "As an attempt to offset our tenuous situtation, the Junta has attempted to press as many ponies as possible into service. For the first year or more of our rule, our soldiers mostly went about grabbing every young and able-bodied pony they could find. These militia are green and hate us, but so long as they shoot where told, does it really matter?"
  WHY_imperial_military_junta:0 "Imperial Military Junta"
  WHY_imperial_military_junta_desc:0 "After our conquest of 1044, Solar Strike established a junta to maintain emergency powers over Whinnyapolis and the countryside. The officers in charge don't always see eye to eye, which leads to gridlock on many military and non-military matters."
  WHY_heretic_cult:0 "Heretical Cult"
  WHY_heretic_cult_desc:0 "The archmage that traveled with Solar Strike has established another branch of the Adoratio here. It has quickly gone off the rails and straight into heretical teachings. However, this Solar Reverentia has become popular with its esoteric and mystic interpretations of the Empress, which has sewn further divisions into the populace, as some love it, and others hate it."

