  ###Decisions###
  FH_lore_decision_category:0 "Dusty Tome's Encyclopaedia of World History, 1048 Edition (Edited by Note Jotter)"
  FH_lore_decision_category_desc:0 "§L*In the liner of this heavy book that you acquired, there is a short preface from the editor of Dusty Tome's Encyclopaedia of World History, 1048 Edition*§!\n\nWelcome, dear reader, to the most replete collection of history on our wonderful world, beginning from the time before the §YThree Tribes of Equus§! up to the modern day. While you may be daunted by this volume's girth, do keep in mind that §2Knowledge§! is the beginning of achieving oneness with the §8Omniscient§!, and this should be a brisk purvey of history to start you on your journey. You may have been assigned this from your instructors, or perhaps you have requested it on loan from our library (in which case, hello! I probably helped you). In any event, please treat the words herein with §Gcare§! and §Preverence§!, for what §YDusty Tome§! has compiled is something awful, in that shamefully underutilized definition of the word.\n\nFor those who have picked this up for pleasure, please seek me at the library if you want a reading guide. As an overview, I suggest a light pace of ten chapters a day. It will see you through for at least a few weeks.\n\nNow, as I always say, "So much knowledge! So little time!"\n\n—  §9Note Jotter, Esteemed Keeper of Knowledge§!"
  FH_disable_category:0 "Close World Lore Category"
  FH_disable_category_desc:0 "§9Wait! Don't leave! We still have another seventy-nine chapters to go through!§!"
  FH_note_jotter_rambling:0 "About the Editor"
  FH_note_jotter_rambling_desc:0 "§9Oh, you want to learn a bit about me?§!\n\n\n\n\n\n\n\n£GFX_note_jotter_portrait_text\n\n\n\n\n\n\n\n"
  FH_note_jotter_preamble:0 "Read Foreword"
  FH_note_jotter_preamble_desc:0 "§9Yeah, this is the good bit. Read that foreword!§!"
  FH_equus_lore:0 "Modern History of Equus, 1007-1048"
  FH_equus_lore_desc:0 "§9You know, I could be biased, but that section on the Crystal Empire's economic conditions in 1030? Perfection.§!"
  FH_griffonia_lore:0 "Modern History of Griffonia, 1007-1048"
  FH_griffonia_lore_desc:0 "§9Maybe just skip... everything about Marelandia, okay?§!"
  FH_zebrica_lore:0 "Modern History of Zebrica, 1007-1048"
  FH_zebrica_lore_desc:0 "§9You know, I found this cool book once about Zebrica being nothing but a chaos wasteland and only a few holdouts along the coast survived and had to defend against hordes of mutated creatures. Felt so real. Fantasy, though, right?§!"

