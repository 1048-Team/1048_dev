  ###Events###
  fh_lore.0.t:0 "Librarian Note Jotter, Esteemed Keeper of Knowledge"
  fh_lore.0.desc:0 "Born: 1020\n\nHailing Solar Beauty University as her alma mater, Note Jotter is recognized for her final thesis "Words and Their Effects on Pony Psyche: How the Way We Communicate Alters Our Reality," in which she argues for a push against definitional drift and loss that so greatly pervades every modern society. This well-researched and thoughtful thesis is recognized by the Directorate and Director Bunsen Beaker as the pre-eminent piece on language and bibliography. Since her graduation, she has taken a role as one of the librarians in Bales' Two Sisters Library, where she guides others in the way of the Mechanicus Deus and beginning their path toward communion with the Omniscient.\n\nAside from her graduation thesis, she has been approached for multiple editing opportunities, and she has contributed to a further research paper currently underway. She is a prominent member of the Bales Mechanicus Deus chapter, where she records all meeting notes and provides timely dictation services to the Headmaster. In addition, she has recently self-published her first book, revivifying the thorough—especially for a griffon—book "Twinkle Sprinkle's Abridged Guide to the Places of the World, 1007 Edition." She has promised that in time she will read through the entirety of Twinkle Sprinkle's full guide and provide an updated edition. She believes that it will be ready sometime in the late 1050s.\n\nWhen she is not serving the Omniscient through her humble service in the library or assisting fellow academics with fact-checking their work, she is caring for her cat, Sprinkles, or enjoying a pleasant play.\n\nFor editing or penmareship advice, please contact her at 117 Flax St. PO Box 2 Bales, Bales, R2D 2C0. Any unicorn-delivered messages will be replied to on a collect basis."
  fh_lore.0.a:0 "Nice to meet you!"
  fh_lore.1.t:0 "Notes from the Editor"
  fh_lore.1.desc:0 "Welcome, dear reader, to the latest edition of Dusty Tome's Encyclopaedia of World History! You have taken your first foal steps toward understanding the universe and becoming one with the Omniscient! In this pages, you will be exposed to the closest thing we can confirm as the world's history, as much was lost in the years that followed 1007. What happened in 1007? Well, if you've been living under a rock or you've not been paying attention to history class—shame on you if you have, that's the most fun class!—then that's the year that everything went WRONG.\n\n"Note Jotter," you may say, "you're editorializing!" and you'd be absolutely correct, but that's what the job of an editor is supposed to be. In one sense, anyway. Don't worry, Dusty knew what he was getting into when he asked me to help proofread, fact-check, and correct his work. I've done my best to avoid editing things through my personal biases, although none of us are truly unbiased. I would recommend that after you conclude perusing this book that you seek out Dusty's previous edition, the 1027 edition. That's the one that I grew up on, and I think that its editor, Line Checker, did a wonderful job. I've done what I can to channel her keen eye and biting introspection.\n\nAnyway, dear reader, to answer your hypothetical question about 1007, it was the year that, from thousands of first-pony testimonies, is where the world DEVIATED. As part of his research, Dusty has gathered hundreds of hours of reports from ponies who lived before that time, and he has concluded that while there were issues that plagued the world, something in 1007 seemed to make everything go off the deep end. Of course, the idea of deviation implies that there is a multiverse and our timeline split off from it at that point, which is unfounded by all scientific measurements, but it is a popular hypothesis that you may have heard around the Technocracy.\n\nTheories abound on the importance of 1007, but that's just what they are: Theories. While wars, oppressive regimes, and religious fanatics burned and ravaged countrysides and flattened cities, many repositories of knowledge survived, and the following chapters will detail our best understanding of the early world, straight through to the modern day.\n\nI may be biased, but I believe this is an invigorating and eye-opening read that nopony will desire to put away once they begin.\n\nTo that end, enjoy, dear reader! If you ever wish to discuss with me any details within the chapters, please come to the Two Sisters Library. I can be found stationed at the desk Monday through Friday, from 10 AM to 7 PM.\n\nMay you learn much in your journey ahead!\n\n— Note Jotter, Esteemed Keeper of Knowledge"
  fh_lore.1.a:0 "Turn to the Equus chapter."
  fh_lore.1.b:0 "Turn to the Griffonia chapter."
  fh_lore.1.c:0 "Turn to the Zebrica chapter."
  fh_lore.1.d:0 "Close the book without starting."
  fh_lore.2.t:0 "Equus - Filling the Powder Keg"
  fh_lore.2.desc:0 "...and with the completion of Starlight Glimmer's training as Twilight Sparkle's friendship student, the year of 1007 was ushered in with jubilation. Equestria was at peace, a prosperous beacon to all as it maintained harmony. Princess Luna's Thestral Rights Act to at restore fellowship with the thestrals and remove their second-class status were supported and ultimately overshadowed by Celestia, which left Luna slightly sidelined in political life. For the average pony, life was simple but satisfying. Any of the signs of trouble the horizon are ignored or are hidden from them by Princess Celestia, who slowly grew obsessed with the safety of her ponies after New Mareland fell to MARESOC.\n\nLike Equestria, the Crystal Empire built a strong foundation on friendship and harmony, with the guidance of Princess Cadance and the royal family. Although the crystal ponies at first chafe at being a de facto puppet of the Equestrians, Cadance in time negotiated an easing of the Empire's place within the United Ponies Alliance, to be treated as an equal, rather than subordinate under Celestia's hoof. With the support they receive from Equestria, the Crystal Empire focused its efforts on industrializing to the level that Equestria was, and thereby becoming its largest economic partner and vice versa. Sombra's supporters were dealt with, but the communist presence within the Crystal Empire maintained an active body of workers to support it. While there were attempts to break them up, they remained united in their goal of improving the lives of workers across the Empire.\n\nIn the Changeling Lands, Chrysalis centralized her power and invaded Olenia, before preparing for the invasion of Equestria. Yakyakistan eventually reconciled with the Jaks and reunited the kingdom, while Nova Griffonia descended into civil war, out of which Erwin Highhill emerged as the leader of the colony. Sinister Serov was elected as chairpony of Stalliongrad.\n\nAt the invasion of Olenia, Equestria issued a written protest to Chrysalis and opened its borders to any and all refugees who managed to flee the changeling-aligned puppet government. Due to Celestia's growing paranoia of her ponies becoming threatened, thanks to SMILE intelligence on atrocities that stockpiled every day in Marelandia, she began mobilization efforts in 1010, and attempted, through drills, radio messages, and direct addresses in Canterlot, to prepare her ponies for the worst. In response to this mobilization by Equestria, Stalliongrad instituted extensive conscription, and the Crystal Empire passed multiple bills to begin construction of a fort line across the borders with both potential belligerents. Subsequently, the changelings further refined and expanded the Wehrmacht, and changelings were reminded of their duty to sacrifice comfort for victory over Equestria.\n\nEverycreature was ready for the other to make the first move. It only relied on somecreature lighting the match."
  fh_lore.2.a:0 "What happened next?"
  fh_lore.2.b:0 "I think that's enough reading for now."
  fh_lore.3.t:0 "Equus - Mingling Blood"
  fh_lore.3.desc:0 "When Chrysalis declared an open state of war between the Changeling Lands and Equestria and its allies in early 1011, Equestria started prepared and more mobilized. However, Chrysalis's move was still unanticipated to be so soon, and it left many of the new troops and reserves off guard and out of position. While the changelings crashed against the initial defense that Equestria's military presented under the command of Prince Blueblood and Princess Luna, they had both a technology and numerical advantage, although Equestria quickly mobilized its reserves to respond to the pressured front. Acornage fell shortly after the war began and remained in changeling control forever afterward. Yet the changelings were halted from advancing much further, due to reinforcements from south of the border.\n\nAlthough the changelings anticipated that there would be stiffer resistance than Equestria could have put up a year before, their attempt at breaking through with their panzer divisions were repelled by a combination of multiple trench lines and reactive thinking from enterprising mages, who developed the equivalent of an anti-tank shell formed from magic. It was exhausting to the pony who cast it, but provided expanded anti-tank fire. As this technique spread across Equestria's front line, it forced the changelings to reconsider their early plans. Instead, they realigned their focus north, to the Crystal Empire, which had to to finish its border fort plans as Cadance intended.\n\nWhile the Crystal Empire was roped into the war by proxy, their military was not prepared for any offensives, and Shining Armor wished for a strong defense before pushing and aiding their Equestrian allies. With the changelings aware of gaps in the fort line within the Crystal Empire, they performed a false flag maneuver, as they amassed a number of divisions in the south, to push toward Vanhoover. As a response, the Equestrian military pulled their troops to shore up what they believed would be attacked. Instead, the changelings punched directly through the Crystal Empire's lines with roughly half of their panzer corps. In the ensuing battles, the changelings encircled a quarter of the Crystal Empire's forces and took them as prisoners to be harvested for love and used as leverage.\n\nWith her nation crumbling, Cadance surrendered in mid-1012, which Celestia condemned in a roundabout way, as she felt betrayed by Cadance's quick capitulation and her refusal to provide economic aid during the war. In the wake of the Empire's defeat, she drew upon more ponies to fight in the army, and fresh divisions were dispatched to protect the large border now left with the changelings. However, the changelings stretched themselves thin with administering the Crystal Empire, and progress against Equestria was minimal. For roughly half a year, the lines stagnated, and resistance efforts organized by SMILE and grassroots rebels picked at the changelings' numbers. During this time, Chrysalis agreed to let the Crystal Empire go, in exchange for extensive economic reparations for the "damages" inflicted by Cadance in 1002.\n\nAs the Werhmacht regrouped, they managed a breach in early 1013, and by March of that year, occupied roughly a third of Equestria, where they were slowed again by crippled infrastructure and resistance. In an unanticipated move, Celestia, who grew reclusive and paranoid, required that her generals initiate a strategic retreat to every river and fort line across the central axis of Equestria. Although this was protested, she intended to use it as a way to further overextend the changelings, then puncture and encircle a majority of their forces in the south-west. Despite some generals resigning or being relieved of duty due to their dissent, the retreat was performed, and both war-weary sides planned their final assaults.\n\nThe changelings feasted upon more of Equestria, and as they reached the south-eastern jungles, the first stages of Equestria's Operation Bug Net were put into place for crushing them in the lower half of the nation. Public sentiment was at an all-time low, and ponies rarely saw Celestia, as she focused on the battles, statistics, and war plans for her nation. Discussions with Luna froze over, and it was not uncommon for her to snap at subordinates when more ill news arrived from the front.\n\nHowever, what Equestria hoped to accomplish was short-lived, when vultures swooped in from behind to pick at their remains. Those actions doomed the land."
  fh_lore.3.a:0 "Who attacked now?"
  fh_lore.4.t:0 "Equus - Fracturing Harmony"
  fh_lore.4.desc:0 "As Equestria was at its weakest, Sinister Serov stabbed Celestia in the back, launching a surprise invasion along the coast and working its way up to Canterlot. In a few days, everything east of Fillydelphia was under Stalliongradian occupation. Celestia was forced to split her attention, and after a failed push against the changelings, agreed to an armistice, so they could ostensibly lick their wounds. Half of Equestria, from Acornage to Hoofington, had fallen to the changelings, and in the coming weeks, Chrysalis pushed to formalize the occupation, which Celestia reluctantly signed to ensure a lasting peace. However, that permitted her to focus entirely on Stalliongrad, and Equestria's military fully mobilized to defend what was left.\n\nIt was not, though, before Stalliongrad reached Canterlot. As tanks roamed the streets, buildings crumbled under artillery fire, and soot and ash clogged the skies from blazing infernos raging across the capital, Celestia drew further inward. Every fear she had was coming true. Every failure she tried avoid had reared its head. All her ponies were dying. Harmony was collapsing. And it was her fault.\n\nBut there was an answer.\n\nReports from survivors of the Second Battle of Canterlot recount that the castle was consumed in an abrupt pillar of fire that sliced through the clouds and reached straight to the sun. In that short moment, Celestia had fallen. In her place, the Empress of Ponykind, Daybreaker Sun, had risen like the great ball of fire she commanded. Fueled by fear, anger, and rage, she led her remaining troops personally, with some claiming she downed thousands of soldiers in that first day. With Daybreaker at the helm of the army, Stalliongrad was repelled to just north of the river beyond Manehattan. Both sides by that point were depleted and exhausted, and Daybreaker agreed to a peace treaty with Sinister. In the end, her new Solar Empire was left with a strip of land running from south of the Crystal City to the South-Eastern Peninsula, and the megalopolis of Manehattan through to Dodge Junction's heart.\n\nHowever, this peace was not to last, as Daybreaker had already placed heavy tax burdens on the country to rebuild and fund the war effort; her repressive policies instigated uprisings, beginning with the South-East. Its coalition of unionists, anarchists, and Marksists were pushed by MARESOC propaganda near the end of the war with Stalliongrad into open revolt. Although initially a failure, they whittled down the Imperial garrison and after the Baltimare fleet refused bombarding the city since it had "rebelled," the entire South-East soon broke into open uprising. For years, they and the Empire struggled, with a war of attrition eventually wearing down the Empire enough they began to retreat. The South-East was free, but soon purges by some of its closest coalition members left it in the hooves of Cobalt Hoof, who styled his own communism after the oppression of MARESOC.\n\nWith the South-East gone, Daybreaker turned her attention inward and her heavy-hoofed laws and quasi-secret police in the Solaris Inquisitionis—the Solar Inquisition—grew too much to many regions. As the Empire was still recovering, with its military unable to effectively respond to many incidents, the periphery drifted apart, leaving Daybreaker with only a core territory stretching from Ponyville to Manehattan. Since the last secession occurred in 1028, the Empire has laid dormant, yet Daybreaker's harsh rule remains unchallenged. While it is but a shell of its former self, the indoctrinated masses of the Empire believe they will one day retake their homeland and Order will prevail across the continent.\n\nDaybreaker is worshiped as a goddess, something she would not have any other way."
  fh_lore.4.a:0 "What of the rest?"
  fh_lore.5.t:0 "Equus - Tying Up Loose Ends"
  fh_lore.5.desc:0 "While the Solar Empire remains the dominant power of its region, and had the most influence on the history of the continent, it was not the only nation going through tribulations. After the status quo peace with Equestria, the changelings began the monumental task of administering a country whose borders had doubled and whose population was at best in parity with its newest denizens. For a while, the changelings fed, sucking dry every ounce of love that ponies had within their conquered territories. But they were greedy, and in time the love began to run dry, which forced them to begin development of synthetic emotions for the masses, rather than the real thing. Most real love has become rationed, only for the elites, which has led to unrest among the changeling populace.\n\nAdditionally, with love almost nonexistent in the occupied Equestrian lands, the ponies grew restless. Through organized uprisings, almost all of the Equestrian land revolted in 1044, which caused a crisis within the Changeling Hegemony. Harsh crackdowns in Vanhoover and its surrounding regions gave rise to a new military occupation zone, but more distant lands in Las Pegasus were given some autonomy in exchange for economic support. The Rockfeller family offered loyalty for extensive control of the Appleloosan area and work as collaborators rather than a true puppet government.\n\nAlthough outwardly the changelings appear strong common consensus is that they are a paper tiger. Rot has set in to the military and civilian governments and Chrysalis has done little to change it, leaving it mighty in appearance, but if pressed, its weak and crumbling nature will reveal itself.\n\nAs the last beacon of freedom on Equus, the Crystal Empire has been a focal point of refugee activity, to the point of political and economic crisis. Princess Luna and Twilight fled in the wake of Daybreaker's ascension, and all three Princesses now lead the country, albeit their plans and opinions vary wildly to the point of hindering their governance. While the economy continues to languish due to harsh reparations and floods of refugees, the warmth and love in the crystal pony's heart is shriveling, directly affecting the health of the Crystal Heart. In turn, this has left the Empire only a husk, waiting to be burned up.\n\nIn the north, Highhill formed the Western Griffonian Empire, and expanded across the furthest reaches. However, when he fell in battle against the changelings, his realm splintered. His nephew, Bismarck, was named his successor as Kaiser, but he has little control over his realm beyond Weter itself. From the Empire's corpse, various warlord states have arisen, feigning loyalty while seeking to establish their own might, or restore their ancestors' legacy.\n\nStalliongrad attempted the Crystal Empire's workers' liberation in the late 1020s, but was soon halted by harsh weather and resistance by the Crystal Empire itself, as a last-ditch attempt at remaining a harmonic light. Aside from a buffer state they created in the eastern portion of the Empire, they have gained little territory and focused on their space program instead. As of late, Sinister has been growing more erratic and age has taken its toll. Nopony has confirmed it, but indications point to him suffering from mental decline for years, which only is becoming evident to the wider world.\n\nThe rump states of the Solar Empire themselves have only a short history, with the Principality of Central Equestria claiming the throne and legacy of Equestria, but forever being stuck in a regency council. With no Princess to lead, it seeks to prove its legitimacy through its ideals to harmony and keeping the throne open in the hope that Luna will one day accept its responsibility, or an heir to Celestia be found. Cloudsdale is led by the benevolent dictator of Marshal Soarin', who seeks to keep his nation safe and ponies free no matter the cost. While the Bales Technocracy is outwardly a technological haven, it hides dark experiments and ambition by its leader, Bunsen Beaker, and one day may blanket the land in an oppressive reign of science or one of its discoveries.\n\nThe Marechester Communes merely wish to keep their way of life preserved, and seek peace with all their neighbors, in accordance to guidance from their de facto leader, Tree Hugger. Much of this was challenged when a headstrong general, Solar Strike, marched into their land in 1044, through Bales, and established his military government in Whinnyapolis. Lastly, the South-Eastern Governorate is on the brink of collapse, as Cobalt Hoof's health has begun to dwindle and the iron grip of his version of MARESOC will inevitably die with him. The many cultures and ponies that live within yearn for liberty from his rule and could very well shape the destiny of the South-East, or Equestria, if he perishes.\n\nSo stands the Equus continent. A land broken by war and oppressed by those who believe they know best. But there always remains a chance at redemption. The phoenix of Harmony can always rise from the ashes of a fallen Equestria, or be taken up by its successor."
  fh_lore.5.a:0 "What about Griffonia?"
  fh_lore.5.b:0 "What about Zebrica?"
  fh_lore.5.c:0 "Maybe for another time."
  fh_lore.6.t:0 "Griffonia - Lost Jewel"
  fh_lore.6.desc:0 "...thus with the individual fiefdoms of Griffonia wiping their slates clean, the year of 1007 dawned with much trepidation and worry. New Mareland becomes one of the largest players on the continent, as Jet Set was unable to maintain the populace's trust in the Equestrian colonial government, and the communists gained enough of a hold within parliament to completely cut ties with the mainland. With the growing anti-colonialist sentiment spread via vile propaganda and lies about the Equestrian system, an underlying cabal of thinkers started to gain traction across the colony. They only had one goal in mind: The complete destruction of the self and total loyalty to a single party.\n\nIn the confusion of decolonization, the core ideologues of this inner troop, which called themselves MARESOC, gained enough of a hoofhold in New Marelander unions that they ignited a revolution against the transitional communist government, leading to a bloody civil war between those swayed by them and those that still wished to maintain a legacy with Equestria. During this war, Equestria attempted to support the nominally loyalist side, along with Jet Set's garrison, but the war was over before troops could arrive from Equestria. Jet Set and his family were captured, and were never seen from again. By the end of 1007, the Party, MARESOC, established enough control over the government to declare a totalitarian, one-party state, with the visage of Big Sister MARESOC's public figure.\n\nAs MARESOC was still rebuilding and licking its wounds, Wingbardy, under the new leadership of Beakolini, sought what it believed was an easy victory, and invaded in mid-1008. Because the remaining Karthinian Pact members were struggling with their own issues, and Wingbardy still relied on older technology, MARESOC was able to hold and eventually repel Wingbardy's invasion in 1009, leading to a cold war between the nations for a number of years. MARESOC capitalized on this war to present itself as the savior of the proles, cementing even further love for Big Sister and the Party. By 1015, Marelandia completely solidified its control over the former colony, and created one of the fastest growing war economies on Griffonia. While Wingbardy was distracted with invading was northern neighbors, Marelandia resumed its conflict, and soon marched into Karthinia, collapsing the Wingbardian government. Beakolini fled to the Jojo and Scarlett Islands, swearing vengeance, before later retreating to Wingbardy's Zebrican colonial territories after a failed defense against MARESOC.\n\nWith the Karthinian Pact mopped up, Marelandia expanded into the Crown of Aquileia, and annexes it in 1017. The griffons there have remained a thorn in the Party's side due to their constant, rebellious sentiments. Although there was internal Party disagreement, as one of its founding members believed it had lost its way and reatreated to found his own free haven, Marelandia has maintained an outwardly unified nation, albeit overextended. The Griffonian Empire launched a surprise invasion in late 1019, which was ended after Marelandia launched every nuke it had been developing, detonating half a dozen of them over Griffenheim, and bringing an instant end to the war.\n\nIn the aftermath, Marelandia began to naturalize its conquered territories, erasing all culture from them, and creating a perfect, communal society, where all is for Big Sister and the Party. Experts concur that it could expand further, but the Party currently uses the threats on the horizon to instill loyalty within the populace. Likewise, there is corruption rampant in the system, however, if it were to mobilize, it would likely be the de facto superpower of the continent."
  fh_lore.6.a:0 "What of the Empire?"
  fh_lore.7.t:0 "Griffonia - Clipped Wings"
  fh_lore.7.desc:0 "When Archon Eros was appointed as the regent for Grover VI, it was yearned that he would reverse the Empire's decline. Initially, that was indeed the case, as he hardened the grip that the Empire had over the Herzland. In the only blessing that it received from Marelandia's meddling, the impending two-front war between the Griffonian Republic and the Crown of Aquileia never materialized. Since the Discrets remained in control and stamped out the Second Republican Revolution, the dynasty focused elsewhere and remained staunchly against Kemerskai's democratic clade. Vivienne sought to rebuild her country from her father's rule, rather than expand it, although tensions between the two crowns remained high during her short rule.\n\nWith most of the military focus in the north against the Republicans, the Empire had little resources to spare in expansion south, but managed to negotiate a treaty with Griffonstone to protect it in exchange for loyalty, and the city of Griffonstone was thereby brought back into Imperial claws. Although the war with the Republicans was fierce, Archon Eros still called for a celebration as the holy city was returned to the Grover Dynasty. This boost in morale provided enough of a push for the Reichsarmee to push past the defenses in Cloudbury and ultimately across the river with the Vedinan border in 1015. By this time, the Vedinans have aligned with the Republicans, and attempt to hold out with them. In the retreat to Vedina, Kemerskai was killed in battle, and the effectiveness of the Republican Army cratered as they resorted to fighting guerilla warfare in occupied territories to slow the Empire.\n\nThe Empire was unable to breech the river and fell back to a defensive line with the Republic, which remained static for the remainder of Eros's life. Since they were no longer a target, the Empire instead moved to exploit the perceived over-extension in the growing threat to the south, Marelandia. In late 1019, the Empire invaded, and for a time pushed into the recently-gained territory of MARESOC. MARESOC was able to gain territory in Griffonstone, coming dangerously close to the city itself, although the defenders held. Their defense collapsed when Marelandia launched their current nuclear arsenal at Griffenheim, which killed Eros and Grover VI before they were able to get to the Kaiserschloss's bunker. The Marelandians managed to capture the city of Griffonstone and the duchy's southern territories before the Empire sued for peace.\n\nWith its governmental head cut off and the Grover line extinguished, the Empire fell into chaos for a time, but Archon Erion managed to wrest control, leaving Proteus in control of the military. After a nation-wide funeral is held for Grover and Eros, Erion proclaimed a revelation from Boreas that Grover has ascended to his heavenly home and reigned with him. In time, this merged with an idea of both becoming one deity, and Erion used it to keep the populace under control. However, Empire remained crippled, as its entire economy and political structure were destroyed in Marelandia's strike.\n\nThe Empire remains in a holding pattern, defending against prodding strikes, and only gaining slight territorial expansions in the north. As a rabidly religious and militaristic state that promises ascension if one dies in the service of Grover-Boreas, it is falling further into backward thinking and technology, but still leads one of the most well-trained militaries in the world. Erion still leads the Empire, long outliving Proteus and becoming the sole Archon left of the old religion. While the Empire is limping, if it were to heal itself, it could quickly exact revenge for the murder of Grover and become the leading world superpower."
  fh_lore.7.a:0 "And the rest of Griffonia?"
  fh_lore.8.t:0 "Griffonia - A Continent of Three Powers"
  fh_lore.8.desc:0 "While Equus has fractured into many smaller powers, with only the dominant Changeling Hegemony as a superpower there, Griffonia has grown much more consolidated. Multiple blocs make up the national landscape of the continent, with the [EQC.GetFaction] controlling the entire southern stretch of the continent. Sicameon was absorbed after a short war by the Marelandians in 1022, remaining a semi-autonomous sister government, while Asterion elected a communist government, which out of pragmatism, aligned itself with Marelandia for survival. In return, they were permitted to gain some of their old territory from the continent.\n\nThe Skyfall region initially supported the Republican struggle, but although it was able to hold against the Empire, it attempted to switch sides when Kemerskai fell. In an attempt at goodwill, they offered a large sum as reparations and the transfer of most of the Imperial Fleet to the Empire, but it was rejected. In a panic, it further mobilized and prepared for an invasion against its sovereignty and freedom. That attack never came with the nuking of Griffenheim, and they used it to gain further resources in Griffonia through taking Adeldart. The Griffonian Republic, after it was pushed back into Vedina, slowly morphed Kemerskai into a mythical character of freedom and republicanism, and in time became a military with a state where every citizen from birth is trained in warfare, and all seek to be copies of Kemerskai's pure ideals, which they will one day spread to the world.\n\nArcturia repelled the Dread League's assaults, supported by its neighbors, and Rosa Maledicta repented of her ways and married William Steelbeak, establishing the Arcturian Kingdom, where it has remained a beacon of harmony in the north. In the Evi region, the Kingdom of Brodfeld defeated Prywhen with the assistance of Lushi, and King Kloseau went on an anti-communist crusade. With the rise of the despicable ideology everywhere, he banded together with the surrounding Evi nations to form a defense league, while he supposedly plans the downfall of all communism. Through will or divine intervention, he still lives in 1048, as vigorous as ever, and has committed to destroying communism from the face of the planet.\n\nLastly, the River Coalition federalized under the guidance of River Swirl in 1012, and she was chosen as the Federation's first Chancellor. In her first term, she improved the living conditions of all the Federation's citizens. Likewise, her second term was equally smooth, but the storm clouds of Marelandia and the Griffonian Empire chipped at her popularity, given her lack of response. In 1018, River was voted out by the newly-elected Third Parliament, and her successor, Limelight—former deputy director of the OHS—slowly consolidated power under the guise of safety and security, ultimately being vested emergency, dictatorial powers after Griffenheim is nuked in 1020. River Swirl attempted to lead political resistance, but was almost arrested after false evidence of conspiring with MARESOC was found in her office. She and some harmonist loyalists escaped to Greneclyf, who was granted membership only a couple of years prior, to form a government in exile.\n\nAlthough they remain popular, they have little population, and after one invasion attempt in Farbrook, which formed into a united kingdom of river ponies, they have been stymied in retaking the River Federation's territory. Limelight expanded for further resources and protection into Kasa and Austerland, as well as the Gryphian Host. With her unquestioned powers, she centralized the government around her, while keeping citizens under the belief invasion could occur at any moment. There still is a veneer of free elections, but she is the only option for Chancellor that Parliament can choose.\n\nThus, the continent of Griffonia remains in an uneasy peace. Were any nation to finally break the unspoken armistice, it will lead to perhaps an eternal war over what little resources that aren't yet taken. The ravages of that war can only be theorized. And only be feared."
  fh_lore.8.a:0 "Let's move on to Zebrica."
  fh_lore.8.b:0 "Let's move on to Equus."
  fh_lore.8.c:0 "I'm good for now."
  fh_lore.9.t:0 "Zebrica - Choppy Seas"
  fh_lore.9.desc:0 "...with the Storm Kingdom a figment of the past and the Saddle Arabian Peninsula in turmoil, the year of 1007 appeared to open to a bleak and ever-worsening tempest. Hippogriffia, isolated and purposefully ignorant of problems on its borders after Ain Trotgourait, was caught unprepared for the North Zebrican War which embroiled them in conflict between Chiropterra and Colthage. Although the fighting was fierce, since the hippogriffs had to battle on three fronts for a time, their grip on the continent and Zumidia eventually slipped after a series of sound defeats on the mainland. By 1015, they had lost their mandate, but fought on, with Novo using the sudden implosion of Wingbardy as it was attacked by Marelandia as a unifying symbol for the victory that was awaiting the hippogriffs.\n\nIn one last attempt at retaking the mainland and putting an end to both aggressors' plans, the hippogriffs launched a widespread naval invasion, supported by Seaquestria, and achieved multiple beachheads. However, Chiropterra and Colthage were prepared, and after a few short months, the beachheads were pushed back, and Hippogriffia was forced to sue for peace. The resulting peace deal heavily favored Chiropterra, which later formed into a commonwealth with the peace it had achieved.\n\nIn the aftermath of the war, unrest skyrocketed within Hippogriffia, and their government grew unstable as Novo dealt with fracturing relations with Seaquestria and justifying the hundreds of thousands dead in a war they lost. Into this chaos, MARESOC inserted itself as it believed that the workers of Hippogriffia were primed for accepting a new regime, if they could be swayed. Under the guise of a peace mission and later to establish a "sister government," Marelandia dispatched over three hundred thousand troops to invade the islands, to establish a mirror of it on Zebrica, HIPSOC. This invasion successfully took the surrounding chains around Hippogriffia and established a fortified position in the north of the main island, but was bogged down by the still heavily-militarized hippogriffs. During this war for survival, the Seaquestrians officially cut off ties, lest they incur further losses and potentially run afoul of MARESOC.\n\nDespite Seaquestria's loss, Novo continued the defense, and in 1019, the war had slowed to a crawl. Shortly after Griffenheim was immolated by nuclear fire, two warheads were dropped on Mount Aris, killing Novo as she helped to evacuate the city in anticipation of such an attack. While Hippogriffia was left reeling for a few months, it eventually stabilized as Princess Skystar, with the support of her friend, Posada, established a unified resistance against MARESOC. This coalition with a communist and her forces incurred an uproar in the high command and armed forces, who eventually split off to form an enclave dedicated to hippogriffon supremacy in the south-eastern portion of the island.\n\nAlthough their bond initially started strong, eventually, differences that were decried by the same officers who deserted split the strong cooperation between Skystar and Posada, primarily over reconstruction plans and prisoner treatment. As many communists resided in central Hippogriffia, Posada formed her own directorate there, with control of the radioactive wasteland that is Mt. Aris. While they no longer see eye-to-eye, the pair do maintain an uneasy alliance against HIPSOC, MARESOC's de facto colony and the Hippogriffon Reclamation League.\n\nTo this day, Hippogriffia remains embroiled in its civil war. Whoever emerges victorious will have a broken island to piece back together, and broken relationships to hope and pray that will mend with time."
  fh_lore.9.a:0 "What of the mainland?"
  fh_lore.10.t:0 "Zebrica - Enemy of Enemies"
  fh_lore.10.desc:0 "Across Northern Zebrica, reform and collation occurred with only minor dissent. Chital formed Hindia, Chiropterra and Colthage joined forces against Hippogriffia, and their combined forces evicted the hippogriffs from the mainland. When Hippogriffia at last signed a peace deal with the victorious powers, Northern Zebrica fell into a tense lull, as the Chiropterrans briefly focused on improving the land they acquired and establishing the Chiropterran Commonwealth. Likewise, Colthage integrated much of the territory it gained and dedicated itself to improving trade in the region and between Griffonia and Zebrica. In 1020, as Hippogriffia departed on its slow death spiral, Colthage turned its attention to the south, fighting a drawn-out war with Quaggatai, initially for land, but later for resources and a buffer state between the roving bands of tribals in Central Zebrica.\n\nSensing an opportunity, the Chiropterrans, who willfully dissolved with Colthage their formal alliance, initiated a blitz across Colthage's territory, almost coming within sight of the city itself, but ultimately being stopped at the river by Colthaginian troops. For months, they fight a protracted war to try and finish a sweep across the northern face of Zebrica, but eventually are forced to sign a peace treaty after the two sides exhausted themselves. In the territory taken west of the city of Colthage, Chiropterra established a new buffer state, which was soon mimicked by Colthage when they proclaimed a protectorate in Quaggatai after the steppe zebras finally surrender.\n\nAs Colthage licked its wounds, Chiropterra returned to an isolationist policy, rapidly developing its technology and economy. However, sporadic raids and guerilla assaults in its captured territory hindered this progress, and rumors of a Solarist cell persisted as evidence pointed to involvement of the Solar Empire in the terror. While Chiropterra formed its veil on Nothern Zebrica, Macawia was attacked over its protectorate in Matadeera, as Hindia sought to unify all deer on Zebrica. Regardless of the Macawian's fierce assaults, the Hindians seized Matadeera in only a few months and then invaded the home island of Macawia in 1028. This disruption permitted Asterion to capture the smaller islands in the archipelago, and out of desperation, Macawia formalized an alliance against the deer with Colthage in 1032, one year after Colthage invaded Hindia for territory in recompense for what was lost to Chiropterra. With this new support, Hindia is forced to an armistice, but to this day maintains a presence on Macawia proper.\n\nIn the region of Kiria, the Kirins finally ended the Silence and its lasting effects, and reformed into a continental power. Through input by Autumn Blaze, Rain Shine is able to maintain cohesion within Kiria, but as some kirin embraced their nirik forms entirely, was faced with a new crisis. While the nirik remained in control enough to fight for Kiria, they were too dangerous for the remaining populace, and could encourage more to embrace the same anger at the greater world events. After long debate, a law requiring all kirin to undergo emotional and mental trials to determine if they can control their nirik form was implemented. All who fail and become a nirik are banished to the outer regions of Kiria, and as some of the weaker nations willingly submitted to Kiria, to the new protectorates that were formalized in them. With the nirks no longer a worry, Kiria itself entered a golden age of arts, culture, and industry, as it remained aloof to world politics.\n\nIf Kiria were to ever be opened or one of the northern powers gain an upper hoof, the scales of world balance would be forever altered."
  fh_lore.10.a:0 "What else of Zebrica?"
  fh_lore.11.t:0 "Zebrica - Battle Royale"
  fh_lore.11.desc:0 "While the major players in Zebrica battled between or literally themselves, the remainder of the continent continued, unconcerned with the games of the larger nations. The Roaman Kaiserate went down a series of conquests to forge a strong Empire across the south-eastern end of Zebrica. As it expanded, the kaiser perished with no heir to replace him. After a short civil war in Roam itself, the monarchy was abolished before it could even form a legacy, and a republic was declared in its place, based on citizen service, where those who serve in the military are regarded higher than any other, and fighting for the Republic is a surefire path to citizenship. As the Republic expanded into the south-eastern peninsula, it eventually split into two administrative governments, one to govern the west and one to govern the east. The east was plagued from its inception with financial and societal troubles, spawned from disparate Zebride cultures and low infrastructure. Within less than two decades, the Eastern Roaman Republic was felled when trying to defend against a Kirin push to retake territory lost to Roam years prior, which left behind a number of rump states eager to carve their own nation out of its remains.\n\nAfter stabilizing, Abyssinia invaded Maregypt in 1015 to take the remainder of Manedalusia, which it achieved in short order. The resulting loss caused a disintegration of trust in the Maregyptian government, and the upper portions of the Neighle River seceded. At this spurning, revanchist politicians gained hoofholds within the Maregyptian government, and called for retaking the land that was stolen from them by traitors and the cats. Abyssinia itself expanded into the donkey territories and Yemane, which grew to bog down its occupiers, as an extremist group worshiping the desert sands itself waged a guerilla war against them.\n\nIn Central Zebrica, the empire collapsed and left in its husk an unstable government, which was soon splintered by a former Storm General who sought to put his own mark on Zebrica, and bring everycreature on it into a brighter tomorrow. The Storm Kingdom itself ended its civil war, and a regional council was appointed to oversee reconstruction and later expansion to take back what the Storm King lost in his death. However, as the yeti making up the council desired only their own gain, the progress was stymied and is unlikely to ever occur without extensive reform.\n\nKarkadannistan overpowered Maretonia and Aestlonia, uniting Heystraya, although faced extreme unrest in the pony population. In the north, the National Salvation Movement emerged victorious in the Saddle Arabian Civil War in 1016, but was left crippled from the carnage. While it was still recovering, the League of the Four Emirs banded together to crown a new king, a Caliph of the Saddle Arabians, and announced the Pranshadun Caliphate, which swept through the weakened NSM and forged a single dynasty on the peninsula by 1020. Thanks to its extensive oil deposits, the Caliphate became a major power on the world stage as garners trade deals with the changelings and griffons and turned its profits into better infrastructure and education for its populace. Although they have been peaceful, there exist militarist and religious elements within government, all of which clammer for the Caliph to use his wealth to spread Arabian culture and religion across the continent. While these elements are fringe, they have been gaining traction, which has left the Caliph and his cabinet in a precarious situation, open to interference by foreign powers that may wish to topple them from their dominant market position.\n\nLike the other continents, Zebrica has been left ravaged by wars and begging for a strong hoof to unite it. With its many major factions, it is only a matter of time before most of it is embroiled a war to end all wars, one that might spill over into the rest of the world and drag it down into the pits of Tartarus."
  fh_lore.11.a:0 "Okay, what of Equus?"
  fh_lore.11.b:0 "Okay, what of Griffonia?"
  fh_lore.11.c:0 "That's all I can take in for now."
