  ###Descriptions###
  POLITICS_TREE_HUGGER_DESC:0 "§YBorn:§! 20th of September, 983 ALB outside of Hope Hollow\n\n§YBiography:§! From her birth, Tree Hugger grew up a little differently than much of the rest of Equestria. While her hometown is technically Hope Hollow, she was actually born in a small community just outside of it, best described as an anarcho-syndicalist collective, where everypony and anypony was accepted as long as they worked for the betterment of the commune as a whole. Compared to most fillies her age, she never knew her parents as her parents, as the entire community raised any and all foals that lived there as one, large family.\n\nDue to this heritage, a respect for life and peace between creatures was ingrained in her, and when she grew old enough, she decided to try and spread some of those "good vibes" with the rest of Equestria. During her time away, she met and befriended the Element of Kindness, Fluttershy, although they quickly parted ways once the Great War started. Although fighting was all around her, she continued to try and lift ponies' spirits through some of the teachings of inner peace she was given by her mentors. This ultimately had minimal effect on society as a whole.\n\nAfter the collapse of Equestria and the formation of the Solar Empire, she worked for a time as a community ambassador in Luna Nova, but ultimately went north as Daybreaker's hoof grew heavier. While she did not partake in the union uprisings across the northern edges of central Equestria, she did remain active in the communes that formed afterward, as the different unions split into various socialist subgroups. Her current home of Marechester touted a similar ideology to her birthplace outside of Hope Hollow, and experience quickly placed her in a position of leadership. The communes eventually agreed to work together at her suggestion, to provide a united defense against Daybreaker.\n\nCalm, patient, and easygoing, Tree Hugger has been the face of the united communes for close to two decades. Although she barely has any power outside of Marechester itself, she does lead the bi-weekly meetings with the other settlements and remains a voice of reason when inter-communal tempers flare, and she remains a steady, if slightly quirky voice in the world around her.\n\n§YPortrait by:§! sirbreadstick"
