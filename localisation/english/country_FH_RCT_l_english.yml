  ###Descriptions###
  POLITICS_LIMELIGHT_DESC:0 "§YBorn:§! 4th of December, 978 ALB outside of Zagrep\n\n§YBiography:§! For the last thirty years, Limelight has led the River Union, the successor to the short-lived River Federation, as a voice of strength and security in a world fraught with danger and oppression. As the former vice-director of the OHS, she has kept much of her past secret and answerable in only vague details, but as part of her initial campaigning for chancellorship for the River Federation, she emphasized again and again how she was just a simple mare, like the various Federation Members of Parliament. As deputy director of the OHS under Arclight, she was practically a spitting image of his fears of a Harmony on the brink of collapse. However, she abruptly resigned and went into politics after supposedly cutting ties with the OHS shortly after River Swirl completed the Act of Federation with the other River Coalition members. To the laypony—and griffon and dog—she was a down-to-earth candidate who saw the inner-workings of the political machine and wanted to change it. To her fellow MPs after she was elected, she was a firebrand against River Swirl's protocol of peace.\n\nMuch of this grandstanding and disagreement came to a head with the first, full federal election in 1018. As had been determined procedure for choosing the new chancellor, in the first session of Parliament, a private ballot vote was carried for all those who sought the position. In effect, it was two rounds of campaigning for winning both their seats and potentially becoming the head of the Federation. While River Swirl was seen as the shoo-in, given how she had raised living standards across the Federation, it was Limelight's smooth words and structured critique of River's willful ignorance of the impending threats of both the Griffonian Empire and Marelandia. Over her first year, she withdrew social program funding to divert it to military advancement, a decision challenged by River Swirl and an unlikely ally in Nova Whirl. However, Limelight was proven right as shortly before a vote of no confidence could be placed in her, Marelandia incinerated Griffenheim in nuclear fire.\n\nRiver's motion was swiftly crushed, and the panicked MPs agreed to give Limelight emergency powers to prepare the Federation for war with the other two superpowers. With no true dissent left for her decrees, she began to pick away at protections for the average citizen in the name of safety against Marelandian infiltration. At times, a purported spy would be found, further vindicating her increasingly harsh measures. In the wake of becoming chancellor for life, she has proclaimed the Federation as a united nation of species, rather than individual states. Further freedoms have been curtailed while the risk of war with the griffons or Marelandians remains on the horizon. Although she is amicable and sociable, she remains aloof from most of the populace. Unsurprisingly, power has suited her well, and so long as she retains it, the River Union will remain a bastion of stability and security on the continent.\n\n§YPortrait by:§! Nnaly"
