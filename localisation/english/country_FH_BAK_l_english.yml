  POLITICS_FH_RIVER_SWIRL_DESC:0 "§YBorn:§! 14th of July, 970 ALB in Rijekograd\n\n§YBiography:§! Even in the world as it stands today, River Swirl is seen as a sweetheart of Harmony and a beloved politician of the ponies, changelings, griffons, and dogs that she maintains authority over. Growing up in the city of Rijekograd, she and her family experienced the freedom of living in one of the only democracies in all of Griffonia and the world, and how ponies could freely determine their future without being dictated to by autocrats or pseudo-divine beings. Although never the wealthiest, she was comfortable enough and was able to study history and rhetoric between helping her Baba with her cousin, Pumpkin Swirl, or volunteering at one of the soup kitchens in Rijekograd. The latter activity earned her some respect in the populace after she organized a charity drive to expand the kitchen and brought Coalition-wide attention to the plights of the hungry in the city.\n\nEarning a degree in teaching at the young age of twenty, she saved as much as she could from her wages to travel to and apply for Celestia's School for Gifted Unicorns in Canterlot. Although she was not particularly talented in magic, she was a skilled orator, and in her entrance exam for the political science courses carried at the school, she achieved an almost perfect score, which earned her an all-expenses scholarship thanks to attracting the eye of Princess Celestia, who was visiting the school at the time. From her time in Equestria, she saw firsthoof the home of friendship and harmony, and returned to Rijekograd with even further ideas of how to improve the city and Republic as a whole. On these beliefs of economic reform and sane business regulation, she earned enough votes to become one of the representatives from Rijekograd, but she further refined her points, and in 1001, she was elected to her first term as Chancellor of the River Republic. Although successful enough in passing her desired laws, she faced a troubled second term, as socialists under Nova Whirl challenged her at every opportunity.\n\nIn the end, though, she was able to politically isolate Nova, and her third term was the highlight of her career, when she convinced the other Coalition members to unify into a supranational federation for the betterment of all. Yet with the clouds of war floating over the continent, the River Federation soon collapsed under their own fear. Defeated by Arclight's former deputy director, Limelight, she saw the freedoms she helped build crumble around her as Limelight preyed upon the terror that the citizens felt to centralize power around herself.\n\nAfter a failed overthrow of Limelight's government through a vote of no confidence, River began to find contacts of those who saw through Limelight's ploys, and after a last-ditch attempt at arresting Limelight when a scandal involving executions of prisoners failed, she fled to the friendly changeling island of Greneclyf. Since then, she has promised that the true Federation government would one day restore what it stood for, but those days are dying with her ageing compatriots. She, herself, is tired and overworked, but until Harmony is once again dominant in the Riverlands, she will carry the torch of resistance and be a symbol of hope to all who still love the light.\n\n§YPortrait by:§! Nnaly"
  RCT_pumpkin_swirl_new_desc:0 "§YBorn:§! §L2nd of March, 972 ALB outside of Rijekograd§!\n\n§YBiography:§! §LFor a humble country filly who was expected to live a simple life, Pumpkin Swirl has experienced far more than she, her cousin, River Swirl, or her dearest Baba ever believed. Unlike her city-living cousin, Pumpkin never had much to her name, as her parents toiled upon the farmlands used to sustain the burgeoning River Republic. From dawn till dusk she frequently assisted, when she was of age, with repairing machinery, sowing seed, or harvesting crops, never with much time to study or travel, much like she yearned before earing her cutie mark. Her family, while not destitute, frequently faced financial hardships, based on the fickle nature of the weather, for compared to Equestria, the patterns were allowed to roam free by the pegasi of the Republic, with only the faintest of nudges to avoid catastrophe ever provided.\n\nOccasionally she visited her cousin in Rijekograd, where she could be told the tales of the bustling life that River Swirl led and experience, for a moment, the friendships she formed, while Pumpkin's own existence was much more constrained. At gatherings with the extended Swirl clan, she clung to the shadows, only brought out with the encouragement of River to interact with the semi-strangers that she so infrequently socialized with. It was in this state of consistent abashed withdrawal that garnered the interest of her beloved Baba, who convinced her parents to take Pumpkin for a season. There she was given room to breathe, and a mild propensity to numbers and organization took hold.\n\nWith support from her Baba, she attended a local school where she could learn the basics of accounting, and despite it being far from enough qualifications for politics, was soon planted in a seat in River Swirl's second cabinet in 1008. For the first few days, she hid in her office and frantically attempted to parse the charts she read, but after a weekend with her cousin and introductions to other ponies in her government, she began to thaw. Within only a few months, she was able to track down embezzled funds from a re-election campaign for a Sabor representative, and cut expenditures in government by five percent. In time, she was seen as the lovable, polite, shy shadow of River Swirl, who could be counted on to do what she promised. This dependability preserved her position as economic minister in River Swirl's successor's government. While Limelight cleaned house with many, she survived and chose to be River's unasked eyes and ears.\n\nThrough her connections, she provided River with financial details of corruption within Limelight's government, and River vainly used them as a smoking gun for Limelight's removal. However, Limelight's popularity only grew in the wake of Griffenheim's fall, and Pumpkin soon was investigated herself and found to be unwittingly harboring funds. Under house arrest, she was freed by River as her cousin fled to Greneclyf, and has been a steady voice of reassurance and a critical eye since. Like River, she has been worn down by the years, but retains trust in her cousin. When they often meet for a meal, she expresses a shared thought: If only their Baba could see them now.§!\n\n§YPortrait by:§! §LNnaly§!"

