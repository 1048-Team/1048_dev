l_english:
  ###News Events###
  fhequusnews.1.t:0 "Inquisitionis Coup in Whinnyapolis!"
  fhequusnews.1.d:0 "[THIS.GetNewspaperHeader]Early this morning, inquisitors under the lead of Archmage Opaline Arcana stormed the governor's residence in Whinnyapolis to arrest Lord Commander Militant Solar Strike on grounds of supporting heresy and continuous agitation of the citizens of the city. After a short struggle, Solar Strike presumably rests in custody and Opaline has declared herself de jure administrator of [WHY.GetNameDef]. She has remained openly hostile toward [EQS.GetNameDef] and criticized [EQS.GetLeader]'s weak stance within the last year. It shall remain to be seen how the two Solarist sides may reconcile."
  fhequusnews.1.a:0 "She will not find us weak for long."
  fhequusnews.1.b:0 "The babblings of an egotistical inquisitor!"
  fhequusnews.1.c:0 "She will not find what she is seeking if she fights us."
  fhequusnews.1.e:0 "There's always more drama."
  fhequusnews.2.t:0 "Failed Coup in Whinnyapolis!"
  fhequusnews.2.d:0 "[THIS.GetNewspaperHeader]At the crack of dawn today, a number of inquisitors within [WHY.GetNameDef] attempted to storm the governor's residence to arrest Lord Commander Militant Solar Strike. Their leader, Archmage Opaline Arcana, led the charge against the residential guards and initially secured the compound. Her announcement on the radio of Solar Strike's arrest was cut short when reinforcements from the Militarum arrived and liberated the Lord Commander and captured the rogue Archmage. Solar Strike has assured everypony that the inquisitors that fled will be dealt with as the Empress would will. With Holy Fire."
  fhequusnews.2.a:0 "A sad pony for a sad ideology."
  fhequusnews.2.b:0 "She will face her judgement with the flame!"
  fhequusnews.2.c:0 "At least that's one headache avoided."
  fhequusnews.2.e:0 "Weren't they supposed to be unified?"
  fhequusnews.3.t:0 "Birth of the [CER.GetFactionName]"
  fhequusnews.3.d:0 "[THIS.GetNewspaperHeader]In an unexpected move, the two nations of [CER.GetNameDef] and [CLD.GetNameDef] have put aside their differences and formed an accord to work together to protect what they claim to be the last vestiges of the old Equestria within their territory. After formally signing the treaty, [CER.GetLeader] and [CLD.GetLeader] promised that their countries would work together to fight against the atrocities of Daybreaker within [SLE.GetNameDef]. Together they mark the first time that the splinter states of [SLE.GetNameDef] have agreed on any course of action, and [CER.GetLeader] has promised that [CER.GetLeader.GetSheHe] will strive to unite the heartlands of Equus and restore the old regime.\n\n[SLE.GetLeader] has dismissed them as vain attempts of glory but it will be only a matter of time war breaks out in the heartlands of Equus."
  fhequusnews.3.a:0 "Do they no longer trust me?"
  fhequusnews.3.b:0 "Their numbers will not save them."
  fhequusnews.3.c:0 "Alliances can easily be broken."
  fhequusnews.4.t:0 "Formation of [CER.GetNameDef]"
  fhequusnews.4.d:0 "[THIS.GetNewspaperHeader]After successfully aligning or overcoming the rest of the nations that broke away from [SLE.GetNameDef], [CER.GetLeader] has announced that the constitutient territories of [CER.GetFactionName] will organize into a single, united country opposed to [SLE.GetLeader], with the sole goal of restoring the Harmony that Equestria stood for. In an address to the fledgeling federation, [CER.GetName] promised that in a few short years, the memory of Harmony would be restored to Equus, and that freedom would finally return to the heart of the continent.\n\n[SLE.GetLeader] refused to comment, but tensions between the two nations appear to only be escalating."
  fhequusnews.4.a:0 "Their pathetic forces will not stop [SLE.GetNameDef]!"
  fhequusnews.4.b:0 "Must we fight?!"
  fhequusnews.4.c:0 "We shall not fall easily!"
  fhequusnews.4.e:0 "Two giants ready to play."
  fhequusnews.5.t:0 "Rebirth of Equestria"
  fhequusnews.5.d:0 "[THIS.GetNewspaperHeader]After a final, bloodied battle, the last of the [SLE.GetAdjectiveCap] forces have laid down their arms against [CER.GetOldNameDef]'s. [SLE.GetAdjectiveCap] leadership called for a ceasefire and total surrender to [CER.GetLeader] and have agreed to a complete dismantling of their government and into reconstituting as the Equestria of old. As [CER.GetLeader.GetSheHe] was sworn in as Equestria's first regent, [CER.GetLeader] proclaimed that Harmony had been returned to the land that birthed it, and that the central region of Equus will remain a beacon of stability and peace for another thousand years. As celebrations shake the capital of [3.GetCapitalVictoryPointName], the world breathes a sigh of relief as Harmony has been restored and ponies may live free of oppression from the specter of Solarism."
  fhequusnews.5.a:0 "We've won! Equestria is reborn!"
  fhequusnews.5.b:0 "Will they repeat Celestia's past mistakes?"
  fhequusnews.6.t:0 "Return of the Yaks"
  fhequusnews.6.d:0 "[THIS.GetNewspaperHeader]For the first time in over twenty years, the Yakistan Valley rules a united kingdom of the yaks. After defeating the last of [NYK.GetLeader.GetHerHis] rivals, [NYK.GetLeader] has proclaimed that [NYK.GetNameDef] shall be restored and be made home to any and all yaks that have been scattered through Northern Equus.\n\n"Yaks will SMASH any country that hurt other yaks!" [NYK.GetLeader.GetHerHis] declared in a speech broadcast across the restored country's territory today. "That's only for us yaks to do!"\n\nAs some of the de jure land of [NYK.GetNameDef] remains contested, the situation in Northern Equus has only grown hotter."
  fhequusnews.6.a:0 "Yahks SMASH smushy Yaks!"
  fhequusnews.6.b:0 "Yaks SMUSH smelly Yahks!"
  fhequusnews.6.c:0 "Now maybe they can all calm down a bit?"
  fhequusnews.7.t:0 "Pax Griffonia"
  fhequusnews.7.d:0 "[THIS.GetNewspaperHeader]Brilliant fanfare played today in [1217.GetName] as [FROM.GetLeader] gathered crowds for [FROM.GetLeader.GetHerHis] speech celebrating the restoration of the old Imperial lands.Prominent soldiers marched along the streets to guide the attendees, with a raucous ceremony held in the square outside of the repurposed governor's quarters, used by Erwin Highhill as his governmental palace.\n\n"Today we mark the return to peace and prosperity within Northern Equus as we retrace our steps that were trodden only a few decades ago. May our foes tremble at every griff's eagerness to reclaim what was once theirs, and let [CHN.GetLeader] know that we shall take back every inch of land that [CHN.GetLeader.GetSheHe] stole from us!""
  fhequusnews.7.a:0 "I'll take what's rightfully mine!"
  fhequusnews.7.b:0 "The North reigns triumphant!"
  fhequusnews.7.c:0 "Like a phoenix from its ashes..."
  fhequusnews.8.t:0 "Death of the Prince Consort"
  fhequusnews.8.d:0 "[THIS.GetNewspaperHeader]Flanked by her fellow Princesses and robed in a black gown, Princess Cadance announced from the balcony of the Crystal Palace today that her husband of forty-six years, Shining Armor, had passed away the night before after a final talk with his family, both by blood and by bond. Although she maintained a strong stance as she read the determined date of the funeral for the beloved Prince, Princess Cadance quickly excused herself, and Princess Luna finished her speech.\n\n"Dearest Shining was a husband, father, and brother. None can verily fathom the depths of loss that my niece endures," Princess Luna was quoted before departing herself.\n\nMany nations around the Empire have already agreed to come to the funeral. Public mourning has already begun, as the Crystal Heart itself appears to shine a little less brightly."
  fhequusnews.8.a:0 "Love's loss..."
  fhequusnews.8.b:0 "Finally, another traitor dead!"
  fhequusnews.8.c:0 "Send our condolences."
  fhequusnews.9.t:0 "Passing of Sinister Serov"
  fhequusnews.9.d:0 "[THIS.GetNewspaperHeader]In a grand display of ostentatious and bombastic military might, the state funeral for General Secretary Sinister Serov was held in front of the Palace of the Soviets, where every member of the Communist Party was required to attend. Of the few old guard that had not been arrested or purged in one of Sinister's later attempts at maintaining stability in the country, not one provided a eulogy. His chosen successor, Feather Bangs, praised him up and down, and crowds wept as he continued on regarding Sinister's kindness, desire for freedom, and extensive work at eliminating poverty.\n\nAlthough only rumors, it is speculated that Feather Bangs will soon distance himself from Sinister's policies. What that entails remains to be seen."
  fhequusnews.9.a:0 "We have lost a legend!"
  fhequusnews.9.b:0 "About time..."
  fhequusnews.9.c:0 "He got a bit demented, didn't he?"
  ###Changeling News Events###
  changelingianews.1.t:0 "End of the Deadlock"
  changelingianews.1.d:0 "[THIS.GetNewspaperHeader]After finally forming a large coalition of supporters, various military and civilian changelings have established a new cabinet under [CHN.GetLeader] and have begun to sweep the hives within [251.GetCapitalVictoryPointName] to clear them of any "soft" opponents to Feldmarschall Lacin Cardo and his clique. After the first arrests began, Feldmarschall Cardo took to the airwaves across [CHN.GetNameDef] to assure the changelings that order would soon be restored.\n\n"We have begun to clear the grifters and the pony sympathizers from our glorious nation," he announced. "When they are removed, I promise that we shall finish the job that our queen gave to us. I swear that [SLE.GetNameDef] will fall and that our revenge will be complete!""
  changelingianews.1.a:0 "We shall reclaim our glory!"
  changelingianews.1.b:0 "This is not good."
  changelingianews.1.c:0 "Just a bunch of hot air."
  changelingianews.1.e:0 "The giant is waking."
  changelingianews.2.t:0 "Opposition Within the Ranks!"
  changelingianews.2.d:0 "[THIS.GetNewspaperHeader]Since Feldmarschall Lacin Cardo formed his government under [CHN.GetLeader], the [CHN.GetFactionName] has seen unrest across the colonies. Cardo's staunchest and most outspoken opponent, Generaloberstabsartz [CCA.GetLeader], fled to [CCA.GetNameDef], where he was welcomed with open arms to form a rival government, with the express purpose of "saving [CHN.GetNameDef] from the backward thoughts of the early 11th century." Although it was believed that the remaining colonies would puruse their own interest, all four leaders of their respective territories met in [66.GetCapitalVictoryPointName] this past week to formalize a defensive treaty, which Marsilio calls the Alliance of the Free. After the declaration of alliance, Marsilio swore that Feldmarschall Cardo would be arrested for his "crimes against the citizens of [CHN.GetNameDef]" and that the honor that they lost in the Great War would be restored."
  changelingianews.2.a:0 "Lacin will not ruin our way of life!"
  changelingianews.2.b:0 "His blustering will not stop us!"
  changelingianews.2.c:0 "Seems the changelings aren't so united after all."
  changelingianews.3.t:0 "War of the Hives"
  changelingianews.3.d:0 "[THIS.GetNewspaperHeader]Today marked the first shots of a new war within the Changeling Hegemony not seen since the Uprising of 1044, and not experienced on Equus since the Great War. Catching the intial [CHN.GetAdjectiveCap] forces on the border with [NCA.GetNameDef] by surprise, the united armies of the [CCA.GetFactionName] marched into outskirts of the former pony town of Whitebell and lay siege to the garrison within. Hours later, [OLE.GetNameDef] skirmished with [CHN.GetAdjectiveCap] forces across the river from Manty Creek. When news reached [251.GetCapitalVictoryPointName], Feldmarschall Cardo and [CHN.GetLeader] decried the aggression as unprovoked and that the [CHN.GetAdjectiveCap] Heer would repel them and restore order within the colonies of the Hegemony.\n\n[CCA.GetLeader] has proclaimed that he has struck first that the growing threat of the reactionary and hardline elements within [CHN.GetNameDef] may be cleared before they become a threat to all of Equus. It shall remain to be seen who has prepared more for this war."
  changelingianews.3.a:0 "We must topple Cardo's cronies!"
  changelingianews.3.b:0 "We will defend the Queen with our lives!"
  changelingianews.3.c:0 "Brood against brood, drone against queen..."
  changelingianews.4.t:0 "Collapse of the Hardline Front"
  changelingianews.4.d:0 "[THIS.GetNewspaperHeader]Flags of the [CCA.GetFactionName] flew from the hive towers today in [251.GetCapitalVictoryPointName] as Feldmarschall Cardo and his inner circle finally surrendered to the combined forces underneath [CCA.GetLeader]. When the fighting finally ceased, [CCA.GetLeader] dispatched companies to secure [CHN.GetLeader] in case she tried to flee the nation and continue the war, but she was found within her hive, waiting for the conflict to end. In a televised conference a few hours later, [CCA.GetLeader] shared how [CHN.GetLeader] had been placed under house arrest by Feldmarschall Cardo, and that in due time [CCA.GetLeader.GetSheHe] would restore [CHN.GetLeader.GetHerHim] to a rebuilt [CHN.GetNameDef]. With his pony, deer, and other non-changeling advisors nearby, [CCA.GetLeader] restated [CCA.GetLeader.GetHerHis] goal to elevate every member of the nation, no matter their status, and that the [CHN.GetAdjectiveCap] would be a force for healing on the broken continent of Equus."
  changelingianews.4.a:0 "They are only making themselves weaker!"
  changelingianews.4.b:0 "We shall reach new heights!"
  changelingianews.4.c:0 "They can never right their past."
  changelingianews.5.t:0 "Old Frenemies"
  changelingianews.5.d:0 "[THIS.GetNewspaperHeader]Tensions ran high today as [BUG.GetLeader] and [EQS.GetLeader] agreed to a historic meeting between the two nations that were once enemies to the core. Arriving at Canterlot Castle, [BUG.GetLeader] was quoted as saying that [BUG.GetLeader.GetSheHe] thought the ponies still had far too gaudy design choices for her taste. The two leaders met first for tea in [EQS.GetLeader]'s chambers alone. After lengthy negotiations, [EQS.GetLeader] and [BUG.GetLeader] declared that the low-key hostilities between their nations were ended, and that a new era of cooperation between [BUG.GetNameDef] and [EQS.GetNameDef] had arrived.\n\nIn accordance with public knowledge, pony-majority holdings of [BUG.GetNameDef] will be returned to [EQS.GetNameDef], and [EQS.GetNameDef] will demobilize and agree to peacekeeping across Equus instead."
  changelingianews.5.a:0 "To a new era of peace!"
  changelingianews.5.b:0 "Let bygones be bygones."
  changelingianews.5.c:0 "Wait, what just happened?!"
  changelingianews.6.t:0 "The Solar War"
  changelingianews.6.da:0 "[THIS.GetNewspaperHeader]Cracks of gunfire echoed across the border between [BUG.GetNameDef] and [SLE.GetNameDef] as the military government coalition led by Feldmarschall Lacin Cardo formally declared war upon [SLE.GetNameDef. Citing the exestential threat to all changelings across Equus at [SLE.GetLeader]'s expansion, Feldmarschall Cardo declared that the "special military operation" was intended to topple the rival government to maintain peace on the continent of Equus. The Feldmarschall's words were countered by the tens of thousands of troops that poured across the [SLE.GetAdjectiveCap] border and siezed numerous vantage points in the first hours of the conflict. [SLE.GetLeader] has responded in kind, and the [SLE.GetAdjectiveCap] has mobilized to descend Equus into continent-wide war again."
  changelingianews.6.db:0 "[THIS.GetNewspaperHeader]Early reports of skirmishes across the [BUG.GetAdjectiveCap] and [SLE.GetAdjectiveCap] border have been recently confirmed by [CCA.GetLeader]'s cabinet this morning, with Generaloberstabsartz Marsilio stating that the actions were a necessary, if unwanted intervention into [SLE.GetNameDef]'s aggressive expansion across the continent of Equus. After producing transcripts of the past several communications with [SLE.GetNameDef], he cited that in order to protect everycreature on the continent, that [SLE.GetLeader] would have to be stopped, and a sister administration placed in charge of [SLE.GetNameDef]. Current details indicate that [BUG.GetAdjectiveCap] have kept casualties to a minimum, but as the [SLE.GetAdjectiveCap] mobilizes to meet them, the threat of war breaking out across Equus has become very real once again."
  changelingianews.6.a:0 "We shall stand against these vermin!"
  changelingianews.6.b:0 "This is Harmony's trial."
  changelingianews.6.c:0 "The Swarm will consume them!"
  changelingianews.6.d:0 "We didn't want to do this!"
  changelingianews.6.e:0 "There wasn't supposed to be a Second Great War..."
  changelingianews.7.t:0 "The Second Pax Chrysalia"
  changelingianews.7.da:0 "[THIS.GetNewspaperHeader]The last elements of the [SLE.GetAdjectiveCap] military laid down their weapons today as the forces of Feldmarschall Cardo swept through the [SLE.GetAdjectiveCap] heartlands. With the fall of [3.GetCapitalVictoryPointName], the [SLE.GetAdjectiveCap] soldiers' morale slowly dwindled, and soon riddled the nation with desertions. From the ruins of the palace in [3.GetCapitalVictoryPointName], Feldmarschall Cardo addressed his soldiers and proclaimed that the "Great War of Vengeance" had concluded. Thousands of political prisoners have been transported from [3.GetCapitalVictoryPointName] to [251.GetCapitalVictoryPointName] to be tried for their crimes against the changeling race, and a temporary military administration has been appointed over the former territories of [SLE.GetNameDef]. As refugees flood neighboring countries, Feldmarschall Cardo has sworn that the memory of the enemies of changelingkind will be extinguished forever."
  changelingianews.7.db:0 "[THIS.GetNewspaperHeader]The last elements of the [SLE.GetAdjectiveCap] military laid down their weapons today as the united forces of [BUG.GetNameDef] occupied the majority of the [SLE.GetAdjectiveCap] heartlands. After accepting Generaloberstabsartz Marsilio's offer for amnesty, [SLE.GetLeader] ordered [SLE.GetLeader.GetHerHis] soldiers to stand down, officially ending the conflict that has raged across Equus. Speaking from palace in [3.GetCapitalVictoryPointName] today, Marsilio thanked the warriors of [BUG.GetNameDef] for their service and promised that the civilians of [SLE.GetNameDef] would notice little in the transition to a new government. Already trusted officials from [251.GetCapitalVictoryPointName] have been relocated to [3.GetCapitalVictoryPointName], where they can assist with stabilizing the region and fulfilling his promise of a free and fair Equus."
  changelingianews.7.a:0 "We have achieved peace in our time!"
  changelingianews.7.b:0 "Our revenge is complete!"
  changelingianews.7.c:0 "The last gasps of Equestria are smothered."
  ###Equus Activity###
  equestria_activity.11.t:0 "Question of the Future"
  equestria_activity.11.d:0 "Today we have received another demand from [EQS.GetNameDef], as we are still nominally a part of Daybreaker's territory. Since we arrived here in 1044 and cleared out the communist rabble that had degraded the sanctity of this city, she has made a number of requests, along with the usual tithes that should have gone back to Sanctum Solar at the end of the year, so this is not out of line. Neither is the demand itself unheard of. According to her, there will be war upon the Equus Heartlands within the next few years, and all able-bodied stallions must be brought back to [EQS.GetNameDef]'s core territory for further training and preparation for this liberation of Daybreaker's territory.\n\nAgain, this is not unreasonable.\n\nYet there is the detail that we are not directly connected to Sanctum Solar, and must go through [BLS.GetNameDef], which has sparked controversy in the past. It has also prevented, whether rightly or wrongly, us from providing to the Empress every other time she has demanded something of us.\n\nDespite the outward appearance, [EQS.GetNameDef] may be more unstable than ever. While we have been promised protection, that has never materialized. In our fight against the communists in the city, for example, no support has ever been supplied. What can she really ensure, without either invading the other rump states, or violating Bales' neutrality, like has been agreed for years?\n\nThis is another opportunity to forge our own path. It is only a matter if we will take it."
  equestria_activity.11.a:0 "We shall stay. The Empress always protects."
  #equestria_activity.12.t:0 "[WHY.GetLeader] Deserts!"
  #equestria_activity.12.d:0 "Since the Whinnyapolitan region was invaded by General Solar Strike in 1044, the area has remained nominally under our control, with Solar Strike paying lip service to the Empress and occasionally providing some tithes as demanded. Under the guise of instability caused by constant clashes with communist agitators from [NER.GetNameDef], he has kept us from maintaining full control of the region, and has even allowed purported heresy to run rampant with a rogue priestess. After today, there is no hiding anypony's guilt in [WHY.GetNameDef], as we received this morning a telegram from [WHY.GetLeader] declaring that [WHY.GetLeader.GetSheHe] can no longer trust that we will come to [WHY.GetNameDef]'s defense in case of war, and that they will be withdrawing from the [EQS.GetFactionName].\n\nWhile this heresy must be punished, there is little that we can actually do while the Empire remains in turmoil and our position is left weakened.\n\nWe must simply watch them leave."
  #equestria_activity.12.a:0 "[WHY.GetLeader] shall pay for [WHY.GetLeader.GetHerHis] irreverence!"
  equestria_activity.12.t:0 "[WHY.GetLeader]'s Last Word"
  equestria_activity.12.d:0 "We have received a terse communication from Solar Strike this morning, rather unexpectedly. As part of the routine check-ins on [WHY.GetNameDef], one of the clerks in the palace penned up another request for materiel support from the Militarum chapter that is set up in the Whinnyapolis region—although that was never sanctioned by the Empress—as there is the very real possibility that war will be on the horizon within the next few years. Although it was a reasonable ask of only a few thousand soldiers and just as many weapons, it has revealed something that must have been a natural progression in Solar Strike's independence: defiance.\n\nIn no uncertain terms, he has declared that since he established the emergency government in Whinnyapolis that the Empress has found it fit to sit idly by and offer no support of her own. He does not acknowledge his own fault in the matter, and the war with [BLS.GetNameDef] that he almost caused on his ill-advised campaign north. While he still promises that he follows the Empress and the teachings of the Adoratio, he has said that he will not be able nor will he be willing to send anything while Whinnyapolis is in turmoil. Additionally, he has declared that he will govern without any input on what the Empress believes is best for the region, which is an utter rejection of her authority.\n\nWe do not have direct access to the region, so there is little we can do assert control. It appears that he has further centralized his control and has formerly withdrawn from the Empire. Already he has been declared a heretic by the Lady Inquisitor, and retribution will no doubt fall upon his head in heaps before he is brought to the pyre."
  equestria_activity.12.a:0 "What insolence!"
  equestria_activity.13.t:0 "Arcane Restoration"
  equestria_activity.13.d:0 "In an unexpected turn, the Solaris Inquisitionis chapter that traveled with Solar Strike when he invaded in 1044 has rebelled against us! Archmage Opaline Arcana marched on Solar Strike's quarters at noon today at the head of a hundred soldiers and half a dozen other inquisitors and stormed the building before the Militarum had any time to react. Fighting has been fierce and sections of the quarters have been decimated as soldiers on both sides battle through corridors and utilize anything they can to gain an advantage. Currently there are a number of fires in the building, most likely from the infernal magic that is characteristic of the Inquisitionis.\n\nThere was not enough time between the attack and the reaction to evacuate the Lord Commander Militant. While the alarm has been raised and reinforcements are on the way, they have come across ambushes by other parts of Opaline's Inquisitionis chapter. Many parts of the city are burning again and coughing up great clouds of smoke, which can most likely be seen from the furthest communes of Marechester or Sanctum Solar itself. Reported casualties are constantly climbing.\n\nOpaline has supposedly been sighted charging into Solar Strike's office, where he is presently waiting for her. Archmage Arcana is prone to use magic. If she went there, then it will be a showdown between reflexes, as she is unlikely to succeed. Already, some pegasi reinforcements have breached a section of the palace and are making their way to his quarters to support him. It remains to be seen what they'll find."
  equestria_activity.13.a:0 "Opaline hit first."
  equestria_activity.13.b:0 "Solar Strike's reflexes overcame Opaline's fury."
  equestria_activity.14.t:0 "The Fate of the Autonomy"
  equestria_activity.14.d:0 "Since he was elected as our new governor in 1025, Soarin' has kept the Autonomy running as a tight ship, through thick and thin, which was interrupted for only a short time by the CCP's attempted coup in 1036. Even when he was down, though, he was not out, and the love of our Marshal, as he claimed himself to be, was enough to draw over a million ponies to protest the illegal government and the restoration of order and civility within the Autonomy. Although there have been scares from training exercises by Daybreaker, more than once "accidentally" organizing multi-week military drills near or inside our borders—mostly around Soarinstead—we have secured our independence, and shown that tyrannical alicorn that we will forever stand for freedom and harmony, not her self-styled order.\n\nWhile Soarin' is beloved, he has won election after election since his inauguration, and the Senate denoted him as Marshal for Life come his reinstatement after the CCP's coup was defeated. Since then, he has served without challenge, and although he has brought nothing but stability and prosperity to us, questions are beginning to arise if he will ever step down or allow elections to begin again. These voices have grown louder over time, stirred on by diehard democratic supporters like Praline Sweets, who has earned respect in both the populace and Senate for her speeches on restoring harmony entirely to the Autonomy, reversing laws that Soarin' has implemented such as death penalty for murder or penal labor gangs. Additionally, a growing number of senators have formed in a coalition, forming a quasi-party that wishes to see the Senate take direct control of the Autonomy, rather than simply act as a legislative and regulatory body to the office of Marshal. Despite having little support in the populace, they could prove overwhelming in stymieing any results, or taking over themselves.\n\nWith Marshal Soarin' recently approving elections, Praline and others have taken to campaigning heavily, and the Senate itself has become fractured. Whatever the populace decides, it will affect the path of the Autonomy going forwards, permanently."
  equestria_activity.14.a:0 "Lead on, Marshal Soarin'!"
  equestria_activity.14.b:0 "Praline Sweets shall bring back the old ways."
  equestria_activity.14.c:0 "We put our trust in the Senate."
  equestria_activity.18.t:0 "A Gem of an Offer"
  equestria_activity.18.d:0 "Hey [ROOT.GetLeader],\n\nYes, I addressed you casually. What of it? Do you know how hard it's been to listen to ponies complaining in and out, like I can fix all their problems? Sure, I got some training in this, but give a mare some space every now and then, right?\n\nI know that we might not have always seen eye to eye in the past, especially with the whole "last surviving remnant of old Equestria" thing, but that's exactly the reason why I'm writing this to you. We've fought over what was left for so long, and what has that got us? Have we gotten anywhere? Are either of us any closer to bringing back the old Equestria when we're ready to poke each other to death with our horns than focus them both on the pony who could ruin this for good?\n\nIn case you're not quite following along, then I'll lay it out plainly. When I was expected to take over my daddy's store chains, I was taught that there were all kinds of logical fallacies that ponies could sink into. One was a sunken cost fallacy. We've been so focused on winning because we've already spent so much—bits and ponies—on trying to beat the other that we got tunnel-visioned and forgot about Daybreaker. I mean, come on. How could we really forget about her?! We both want the same thing, if maybe slightly differently, and that's okay. We can work out our differences, like I learned a long time ago.\n\nAll those old S.M.I.L.E. agents that left Canterlot have said that they're learning that Daybreaker is getting ready for something big. I mean REALLY big. If we want to survive, we need to band together. We both have strengths. We both want to see Equestria restored. We have to make this work.\n\nWhat do you say?\n\nHer royal majesty's regent,\n\n[FROM.GetLeader]"
  equestria_activity.18.a:0 "We'll put aside our squabbles for now."
  equestria_activity.18.b:0 "Daybreaker's blustered for years. She's no danger."
  equestria_activity.19.t:0 "Automatic Reply"
  equestria_activity.19.d_a:0 "[ROOT.GetLeader],\n\nYou know, before the entire world went upside down, talking a bit of smack with a Wonderbolt or somepony else from the military would be something anypony could do. Don't worry about being so casual—although I doubt you really were. We've all been a bit... busy and stressed, to say the least, what with Daybreaker on all our doorsteps just waiting to come knocking.\n\nSo, after a lot of thinking and scratching my head, going back and forth, and trying to figure out if there could be any angles you're cooking with this, I've decided to give you my answer: Sure. We SHOULD form some defensive alliance against Daybreaker. We both want to be free from her and by ourselves we probably couldn't hold against her if she focused on either one of us. It may be an obvious strategy, but that doesn't mean that it isn't smart to do. And, frankly, I'll be happy to put those pointless border clashes behind us. Wasted a lot of good equipment and ponies, you know?\n\nWant to get together sometime to coordinate this thing better? I can always bring some apple pie!\n\n[FROM.GetLeader]"
  equestria_activity.19.d_b:0 "[ROOT.GetLeader],\n\nI'll ignore how you basically threw out every kind of protocol when talking to one of your peers, because clearly you really don't give two cares about what I'd have to say, anyway. Sure, you could say that you're just stressed, but we've been at this long enough to know that you're just like that all the time, right? So drop the pretenses. You don't care about Daybreaker, you just want an easy way to say that you're ruling more of Equestria's corpse.\n\nEver since your letter arrived, I've spent time pondering my next move with you, and while you do make a couple of good points, you're planning something else. I don't know what, but it's not something I'll want [FROM.GetNameDef] to be part of. Oh, sure, you SAY that you want to be free of Daybreaker, too, but why should we exchange our liberty for being under the horseshoe of another? Whatever ploy you're working, you won't pull the wool over on us.\n\nI would offer you a condolence apple pie, but it'd be better spent on somepony who'd appreciate it.\n\n[FROM.GetLeader]"
  equestria_activity.19.a:0 "We shall defeat her together as friends!"
  equestria_activity.19.b:0 "We shall stand together, even if we have to make you!"
  equestria_activity.20.t:0 "Extended Hooves"
  equestria_activity.20.d:0 "Hey [ROOT.GetLeader],\n\nSo, in case you've not been paying attention to the giant elephant in the room, all of us "rump states" are threatened by that crazy alicorn with a fire fetish. Maybe you weren't aware, but I'm guessing that you are. Also, if you're REALLY not watching things going on here on Equus, you might not have heard that [CLD.GetLeader] and I happened to have become best friends and formed a defensive alliance. Whatever Daybreaker's up to in Canterlot, it's not good. You must have seen all those new regiments she's been training, or at least heard about them. If we want to even have a chance of surviving, and for you to do... whatever it is you think you should be doing, then we need to band together.\n\nI'm going to be honest, if you don't agree to this, you're basically rolling over and begging for Daybreaker to come and stomp you into a bloody pulp, so, do make sure to say yes.\n\nDo it for me, okay? I just want to see everypony live a better life. Honest.\n\nHer royal majesty's regent,\n\n[FROM.GetLeader]"
  equestria_activity.20.a:0 "We must defend ourselves from Daybreaker!"
  equestria_activity.20.b:0 "Daybreaker is all bark and no bite. No concern of ours."
  equestria_activity.21.t:0 "RSVP Response"
  equestria_activity.21.d_a:0 "Everypony within [ROOT.GetLeader]'s regency council has breathed a little easier today as we have received word from [FROM.GetLeader] that [FROM.GetLeader.GetSheHe] has accepted the proposal that we dispatched a few days prior. Like [CLD.GetLeader], it was acknowledged that the only logical way forward to survive is to band together to stop Daybreaker. While we are still too weak on our own to make an offensive move, one more defensive partner will hopefully be that much more of a deterrent for Daybreaker. Any delay that we can buy so we can safeguard Harmony is one we should take. Equestria's legacy depends on it."
  equestria_activity.21.d_b:0 "For the last several hours, much of the regency council has been in a state of glumness over the recently received answer from [FROM.GetLeader] in regards to joining our defensive alliance. Although it was agreed that the logic was sound enough, [FROM.GetLeader] opposed the idea on the grounds that Daybreaker has remained dormant this long, and likely will never restore her territory while she so poorly manages it. With this, we have been left weakened by potentially a neighbor state being chosen first and overrun. Talk of war to protect Harmony has already been floated, and it is likely on the horizon. We do not take the loss of life lightly, but stopping Daybreaker is key.\n\nEquestria's rebirth must not be halted."
  equestria_activity.21.a:0 "We shall restore Equestria, together!"
  equestria_activity.21.b:0 "Freedom from Daybreaker is non-negotiable!"
  equestria_activity.22.t:0 "Future Hope"
  equestria_activity.22.d:0 "Hey [ROOT.GetLeader],\n\nSo, this is not something that I ever thought I'd say, but we need to go even further. Like, everything we've done so far in working together, forming interconnected military and governance structures and the like is awesome, but we can't risk any disagreements lead to us squabbling while Daybreaker steamrolls us. All it'd take is one general from one country to stop working with one from another, and our whole defense could crumble!\n\nIt's been on my mind a lot ever since I got the Heartlands to work together. We don't just need a defensive alliance, we need a single country going forward, ready to fight as one to stop Daybreaker. Yeah, I know that this goes against a lot of what I promised, but everything that's been going on in the world means we need to think outside the box. And what better way to work a bit of that old magic of friendship than by putting aside our differences entirely and forming a new government?\n\nDaddy trained me well, so I'll be leading everything until we retake Canterlot. Hopefully then one of the Princesses wants to come back, or, Celestia forbid, we find somepony else who can take the throne.\n\nAnyway, I'd recommend agreeing to this. Don't think of this as a buyout, but more as an... opportunity to work together more closely! I Pinkie Promise that there will be work for everypony in this new government. I swear it's true!\n\nHer royal majesty's regent,\n\n[FROM.GetLeader]"
  equestria_activity.22.a:0 "We must integrate to survive!"
  equestria_activity.22.b:0 "An autonomous region would work better."
  equestria_activity.22.c:0 "This was a ploy! Never!"
  equestria_activity.23.t:0 "Dawn of the Heartlands"
  equestria_activity.23.d_a:0 "In New Canterlot this morning a short parade was held when delegates from [FROM.GetNameDef] arrived with word of the decision reached that was passed along to them. Although it was tense and tight, in the end, [FROM.GetLeader] agreed that integration was best for [FROM.GetNameDef], as working with one, unified government and military structure would provide a much better defense against Daybreaker than a fractured command. Already, much of [FROM.GetNameDef]'s old government has stepped down and we are dispatching some trusted ponies to help with the transition. Soon enough, we shall have a new province under our wing, and we shall be that much stronger in bringing the fight to Daybreaker!"
  equestria_activity.23.d_b:0 "After hours of terse and frigid negotiations, a compromise has been reached with [FROM.GetLeader] and the delegates that arrived with [FROM.GetLeader.GetHerHim] to speak with [ROOT.GetLeader], one which is not ideal, but at least not a complete desertion from our defensive alliance. Rather than be a fully-integrated province under the central government in New Canterlot, [FROM.GetNameDef] will be designated as a special region, with its structures still in place, but wholly subservient to us. While this will ease the burden somewhat, it is not what we desired. Still, for the sake of unity and friendship, we have agreed to abide by the terms that [ROOT.GetLeader] ratified with [FROM.GetLeader]. With this new relationship going forward, we trust that [FROM.GetLeader] will honor. If we are to survive against Daybreaker, everypony must work together, no matter their differences.\n\nThat's the magic of friendship in action!"
  equestria_activity.23.d_c:0 "Ever since the response arrived from [FROM.GetLeader] regarding integration within [ROOT.GetNameDef], the staff inside the castle in New Canterlot have been buzzing like bees, frantically darting from one section to another as PR needs to be handled and spun and grand strategy set. Thus far [ROOT.GetLeader] has yet to acknowledge that a communication from [FROM.GetNameDef] even arrived, although news will soon spread of it leaving our defensive alliance. Inside the communication was only a simple response that [ROOT.GetLeader] had completely betrayed what [ROOT.GetLeader.GetSheHe] claimed and had overstepped [ROOT.GetLeader.GetHerHim] bounds. There was no possibility of compromise.\n\nWith the loss of [FROM.GetNameDef] from [ROOT.GetFactionName], we have been left without a valuable ally. If Daybreaker were to take advantage of this, it could threaten to topple all that we've worked to accomplish. Therefore, plans have already been put into motion to retaliate. If our former friends don't want to help us now, then they will have to be made to help us in short order. Harmony's restoration might have to be sprinkled with a bit more blood, first."
  equestria_activity.23.a:0 "To a harmonious future!"
  equestria_activity.23.b:0 "It's acceptable enough."
  equestria_activity.23.c:0 "Harmony is paramount, even if spread by the sword."
  ###Changeling Activity###
  changeling_activity.29.t:0 "The Last Retort"
  changeling_activity.29.d:0 "[ROOT.GetLeader],\n\nPerhaps you believed that all those little payments to shell companies wouldn't be noticed by me or my bureaucratic army? Did you think that you were somehow clever? I'm sure that if I gave you the chance to ever come into my presence again that you would plead that it was for "security" or "stability," but we all know that that's a lie. I should know. I almost toppled Canterlot fifty years ago with one, little infiltration. Do you know how many lies I had to tell and how good I am at spotting anomalies?\n\nOh, maybe you'll see that it was for your pension fund. Please. We all know that you want to be out from under my hoof. So, I'll give you exactly that. Freedom.\n\nOh, and that I decided this when Cobalt Hoof's little experiment is imploding and all those upstart nations want your land is ENTIRELY coincidental. But, since you want to be free so much, enjoy fighting back. Don't come running to me for help, unless you want a swift death.\n\nHer Royal Majesty, Terror of Equus, Arch Lady of the Hives,\n\n[FROM.GetLeader]"
  changeling_activity.29.a:0 "Maybe we should have invested sooner."
  ###Griffonia Activity###
  griffonia_activity.1.t:0 "Leagues United"
  griffonia_activity.1.d:0 "To the most esteemed [ROOT.GetLeader] of [ROOT.GetNameDef].\n\nI greet you as a fellow member of our glorious league, the likes of which has seen our griffons achieve unparalleled levels of freedom and united us all against the insanity that has plagued our continent. These last decades have seen the vile, scum-sucking, vermin-infested, manure-eating, inbred, halfwit, Maar-possessed COMMUNISTS attempt to break us. But we have held together, united by our shared hatred of those good-for-nothing wastes of air. Unmarked graves would be too polite for them! After all they did to MY country! They deserve—\n\nBut I get ahead of myself. While I could wax on further about the godless nature of communism and the mockery that they have made of our gods, I believe that needs no further explanation. Therefore, I desire to speak plainly with you. For too long, we have worked as one league, but our shared governments have led to differences in direction and priorities. We are a defensive league, but we must bring the fight to the damned reds or Griffonia—nay, the world—will never heal from the decimation that has been wrought in the name of that soulless ideology. We must act as one.\n\nI propose full integration of our governments, with the Crown of Brodfeld at the helm. For I have had more experience felling communists than any griffon still alive today, and I feel none the weaker for it. When you unseal this letter, do consider your response carefully. We have been allies, even friends, for decades. I would not propose this lightly.\n\nAnd if you reject, then you will face the same fate as every last, wife-stealing, craven, mud-slinging, piss-swilling, egg-eating, Maar-damned communist on this continent!\n\nI trust that this letter finds you well.\n\nKing Kloseu de Kissau, Scourge of Communists"
  griffonia_activity.1.a:0 "We are stronger as one."
  griffonia_activity.1.b:0 "How about a counter offer?"
  griffonia_activity.1.c:0 "He's no better than the Empire!"
  griffonia_activity.2.t:0 "Consolidating Land"
  griffonia_activity.2.d_a:0 "This morning we received a communique from [FROM.GetLeader], directly addressed to [ROOT.GetLeader], marked as urgent and for his eyes only. With the king resting when it arrived, it was deemed a necessary risk to wake him, as despite his age, his wrath is feared throughout the palace, and more than once his displeasure ended with a servant in front of a firing squad, accusations of being a communist sympathizer being enough to serve as a reason for the execution.\n\nWhen he was roused, he quickly tore it open and revealed that [FROM.GetLeader] has agreed to the entirety of the single nation plan as outlined with [ROOT.GetLeader]'s letter. Local institutions have been directed to only work with our own, and [FROM.GetLeader] will remain on in a governing role for the new territory of our nation. Although the wording of the response was terse, [FROM.GetLeader] acknowledged the risks, and with bigger fishes to fry, saw no reason to protest.\n\nAs we now move forward, we shall be all the stronger to take the fight to the extremists, and the communists, across Griffonia, and the world. One day, all of communism will be eradicated, with us at the helm of its destruction!"
  griffonia_activity.2.d_b:0 "Since the arrival of a letter from [FROM.GetLeader] in answer to [ROOT.GetLeader], the palace has been abuzz with rumors and musings about what the communication could have contained. When it was dropped off by a courier from [FROM.GetNameDef] late last night, it was decided to allow our dear king to slumber until he was recuperated; while it did risk garnering the ire of him, since the letter was marked as urgent, it ultimately was the wiser choice. No servants were sent to the firing squad this day, as much as there was the risk for that.\n\nSo far, only a few of our king's most trusted advisors have been appraised of the situation. While [FROM.GetLeader] agreed with [ROOT.GetLeader]'s assessment of needing tighter integration with our governments and institutions to fight against the extremists on the continent, it was not at the expense of complete sovereignty, as desired. However, it was not a rejection, either. Instead, [FROM.GetLeader] proposed that [FROM.GetNameDef] be made an autonomous region within our league, with oversight by our king or his advisors. Grand actions would have to be okayed by [ROOT.GetLeader], but the lesser details of day-to-day operations wouldn't concern us.\n\nDespite it not being ideal, it is better than fighting alone. [ROOT.GetLeader] has had an expensive, long-distance telephone call with [FROM.GetLeader], and the terms have been ratified. Although not as one, we shall still cleanse communism from the world! Only then will we have true peace."
  griffonia_activity.2.d_c:0 "Terror and fear has settled in upon the palace, as news from [FROM.GetNameDef] arrived earlier today for [ROOT.GetLeader]. Since then, he has remained in his quarters, brooding and occasionally tossing something out a window, which has already claimed the life of a servant after she was hit by a bust of our king's late son which was hastily defenestrated. Everything has ground to a halt, but our generals are already preparing a response to the communique that came in.\n\nThere were only two lines on the letter that came: "We do not accept." and "May Maar claim your soul, Imperialist bastard."\n\nIt is abundantly clear what the overall mood of [FROM.GetLeader] was when penning the response, and [FROM.GetNameDef] has formally withdrawn from our league shortly after the messenger for the letter departed. We cannot allow, though, for our position, surrounded by extremists, to be compromised. While more war is the last thing the Evi Valley needs, if [FROM.GetLeader] will not willingly integrate, then we will have to make [FROM.GetLeader.GetHerHim] agree instead.\n\nOr we will die trying."
  griffonia_activity.2.a:0 "Excellent!"
  griffonia_activity.2.b:0 "An acceptable compromise."
  griffonia_activity.2.c:0 "They WILL fight against communism, willingly or not!"
  ###Southeast News Events###
  southeastnews.1.t:0 "COBSOC in Disarray!"
  southeastnews.1.d:0 "[THIS.GetNewspaperHeader]Rumors circulated for weeks on the sudden disappearance of Cobalt Hoof, the First Citizen of [BAL.GetNameDef], but the loudest have been confirmed with recent [CHN.GetAdjective] reconnaissance photos over the region. Large portions of [BAL.GetNameDef]'s standing military have disbanded and riots are running rampant in the largest cities within the South-East. Still no official broadcast from COBSOC has been intercepted, but the lack of a harsh crackdown has indicated to nations and citizens alike that one thing must be true: Cobalt is dead and COBSOC is scrambling to maintain order. If COBSOC prepares a statement for international recognition, it remains to be seen how these riots will be framed."
  southeastnews.1.a:0 "Who will lead us now?!"
  southeastnews.1.b:0 "They are eating themselves from within."
  southeastnews.1.c:0 "A perfect financial opportunity!"
  southeastnews.1.e:0 "They failed before they even began."
  southeastnews.2.t:0 "The Shattered Peninsula"
  southeastnews.2.d:0 "[THIS.GetNewspaperHeader]Since the death of Cobalt Hoof, COBSOC has been left reeling as confirmed by aerial footage. No official word was ever released by [BAL.GetNameDef], but rumors circulate that Cobalt has been succeeded by [BAL.GetLeader], who attempted to maintain order in the wake of Cobalt's passing. That appears to not have been enough, as a rival government has appeared in Stableside and changeling reports of guerilla warfare in the jungle between thestrals and the Neighua tribe have been circulated. Outward territories of the Governorate look to be acting autonomously. All inquiries have been ignored, but COBSOC is still treating the wayward states as their own. Footage indicates that multiple rump nations have formed and are building for future military conflict.\n\nThe future of the peninsula remains clouded."
  southeastnews.2.a:0 "[ROOT.GetLeader] will restore us!"
  southeastnews.2.b:0 "All the easier to conquer."
  southeastnews.2.c:0 "Can anybug say "war profiteering?""
  southeastnews.2.e:0 "Scavengers fighting over dung."
