  ###Characters###
  GRF_bismarck_highhill:0 "Bismarck Highhill"

  ###Leader Descriptions###
  POLITICS_BISMARK_FH_DESC:0 ""The shadow of my uncle is a cold place to stand, but the crown still fits me, however loosely."\n\nBismark Highhill never asked for the crown, nor the chaos that came with it. He inherited the ashes of his uncle's, Erwin Highhill, short-lived empire and was left holding the keys to the heavily-fortified capital, Weterheim, and little else.\n\nBismark is far from incompetent; he is merely average in a time that demands genius. He clings desperately to the remnants of the Imperial identity, maintaining the pomp and circumstance of the Griffonian Empire, drilling his elite guards, and drafting meticulous reclamation plans that gather dust. He knows he is a pale imitation of his much more tactics-driven and charismatic uncle, and every foreign envoy who comes to Weterheim can sense the hollowness beneath the gold-laced uniforms. He is a griffon clinging to a fortress, praying the walls don't crumble before he can find the courage to step outside them."
