l_english:
  ###Ideas###
  CTL_princely_estates:0 "Autonomous Regions"
  CTL_princely_estates_desc:0 "For centuries, the deer of North Zebrica have lived in splintered kingdoms and bickering states, a past that has only recently been rectified within the last couple of decades. Hundreds of years of traditions do not vanish easily, and for the sake of stability, some level of autonomy was granted to the former princely estates in exchange for support. These regions muster their own forces for their own ends, and only provide a token levy in the case of war and national defense. Although this is suitable for now, if we ever are to become a true superpower, the traditions of the deer must one day be put to rest."
