  ###Descriptions###
  POLITICS_FH_BEAKOLINI_DESC:0 "§YBorn:§! 7th of July, 954 ALB in Grezzo\n\n§YBiography:§! Born to a humble, middle-class family, Giulio Beakolini has had a foot in the political pool for almost his entire life, since as soon as he was able to understand remotely complex concepts, his parents instructed him in political theory and the right of griffons to determine their own futures. Even as a chick, he was brought to rallies and protests by early republicans that gained momentum within Wingbardy itself, and he watched with a zealous eye to the Republican Revolution that nearly toppled the Grover dynasty near the turn of the millennium. When the Griffonian Republic failed, it further fed his belief in griffon autonomy, which soon buried him in leftist rhetoric and the international cause championed by the pony theorist, Caramel Marks.\n\nAs a griffon of words, he studied journalism and eventually earned a job as a journalist, where he covered politics within Karthin and Wingbardy, and directly went to the front of the Falcorian War, in which his peers garnered a distaste for his pro-war mentality. When he was fired for his views, he joined the military instead, and returned a griffon with a new purpose. Convinced that the only way forward was for class to be removed entirely to serve the state, he quickly gained support in the Wingbardian government as he exposed the corruption that had festered within it for decades. Ultimately his march on Karthin ended up with him becoming prime minister and de facto dictator of Wingbardy, and for a few short years, it appeared that his fascist ideology was truly the way forward. Until Marelandia reared its head.\n\nAlthough he and his generals anticipated that the communists there would attack, the ferocity in which they laid down their lives was not. Initial victories soon became strings of defeats, as Wingbardy and her allies were stretched thin. As a final insult to his belief of a single soldiery for the nation, half of his military revolted when they were forced to give up basic needs such as fresh clothing and water. Ultimately, under his rule, Wingbardy collapsed, and only through loyalists in the navy did he escape to Wingbardy's colonies, where he has kept hold of a small slice of its pride. Yet, now "Il Duce" is old, fading, and tired. The world has been promised, but Wingbardy is no more. Yet the fight is not over. Wingbardy will be restored or he will die trying.\n\n§YPortrait by:§! KelKessel"
