l_english:
  KIR_thousand_year_peace:0 "The Thousand Year Stillness"
  KIR_thousand_year_peace_desc:0 "The Great Silence and its aftermath was endured and [KIR.GetNameDef] came out the other side more united than ever and a bulwark of stability in a chaotic continent and world. For the last twenty years, we have prospered and become one of the leading economic powers of Zebrica. Smaller nations have flocked to us and peace has been our bedrock upon which we've built everything we see. Zebrica can burn around us, but [KIR.GetNameDef] will stand for a thousand years as the only oasis in a sea of insanity."
  KIR_thousand_year_peace2:0 "The Thousand Year Stillness"
  KIR_thousand_year_peace2_desc:0 "With trouble on the horizon, the peace that we fought so hard to establish is unable to be preserved without spilling more blood. Early efforts to reform our administrative systems for smoother function and clearer allocation of funds have born some fruit, but there is still a long way to go before we will be ready for the fires that sweep Zebrica."
  KIR_thousand_year_peace3:0 "The Thousand Year Stillness"
  KIR_thousand_year_peace3_desc:0 "Further reforms have taken root and there is a purpose behind the government machine that runs [KIR.GetNameDef], but there is still much to do. Funding earmarked for other projects have been directed to the military and subsidies for businesses to switch to wartime production have been distributed, but the Sleeping Giant of Zebrica has yet to fully rouse."
  KIR_thousand_year_peace4:0 "The Thousand Year Stillness"
  KIR_thousand_year_peace4_desc:0 "Much of [KIR.GetAdjectiveCap] has changed in only a short amount of time, much like what the generation before us endured as we broke the Great Silence. While peace may return to the continent with our intervention, our society will be forever altered as we take up a new role in the modern world."
