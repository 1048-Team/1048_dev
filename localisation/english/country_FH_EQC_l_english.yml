###Descriptions###
here_comes_1984_desc:0 "§YBiography:§! Like much of Marelandia's politics, happenings, and actions, Big Sister is an anomaly and enigma wrapped into a greater mystery. Initially she was just like and the face of MARESOC: nopony. During the war against the last remnants of New Mareland's government, MARESOC was nothing more than another group of communists fighting for the liberation of the workers, then she was suddenly the everymare: the soldier, the housewife, the worker, all striving together for ultimate freedom from the oppression of the ruling class. Plucky reporters risking their lives in the civil war could occasionally catch posters claiming that every act of defiance against Equestria was something that helped her free more of her sisters. Then, with the collapse of the New Mareland government and establishment of Marelandia, she was its face, its symbol of authority, its focus for love and adoration.\n\nWhether Big Sister is a real pony or merely a figment of the Party's collective authority is unclear. Although she appears frequently on public propaganda and edifices and supposedly speaks to Party members on a daily basis, nocreature has ever interacted with her or seen her. Certainly at some point, a pony like her must have existed, either as a member of MARESOC or as one of its prisoners, but the likelihood of this being proven is almost nonexistent. Likewise, her history is a convoluted mess of half-truths and arguments in semantics. While she is both the liberator of MARESOC and its ultimate arbiter, she is also the ever-watching presence that promises to keep the creatures of Marelandia safe while simultaneously being the one who sees their darkest secrets and damns them all for holding them.\n\nTo the world, she is the ultimate symbol of evil and the promise of the destruction of self. To her citizens, she is their life. To the Party, she is the power that keeps Marelandia running. To her allies, she is an unrelenting force of conquest that will sweep the globe. To her enemies, she is the nightmare of the failure to destroy the Party. She is both everything and nothing. She is real and a figment. She is dead and alive.\n\nShe is eternal. She is inevitable. She is Big Sister.\n\n§YPortrait by:§! Scroup"
