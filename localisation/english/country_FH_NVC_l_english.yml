  ###Leader Descriptions###
  POLITICS_JOSEPH_FH_DESC:0 ""The generals built the walls of this empire, but we, the workers, laid the stone, and we will tear it down."\n\nBorn in the industrial slums of Weterheim, Joseph Talon spent his youth breathing coal dust and dodging the whips of Imperial overseers. When the Western Griffonian Empire collapsed magnificently in the wake of Erwin Highhill's death in battle, he didn't run; he organized. Joseph is not a philosopher; he is an administrator and a man of action who believes that the only thing separating the labor force from true freedom is a loaded rifle.\n\nHe leads his Compound of Central Nova, a massive force formed from displaced workers and disgruntled miners, with a singular, obsessive goal: the seizure of Weterheim. He views the capital not just as a strategic objective, but as the stolen birthright of the northern labor movement and the heart from which the Empire will be restored, not as a jingoistic, colonialist enterprise, but an expansive utopia for all workers of the North to live in without care or worry. While he lacks formal military training, he commands a near-fanatical loyalty that no amount of gold can buy."
