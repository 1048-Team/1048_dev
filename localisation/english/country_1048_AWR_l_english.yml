  ###Descriptions###
  POLITICS_DUMB_LUCK_DESC:0 "§YBorn:§! 20th of June, 1000 ALB in Detrot\n\n§YBiography:§! From the very beginning of his life, coincidence has been a companion of Dumb Luck every step of the way. His mother's term was not due for another month, but the absolute shock of Nightmare Moon's return on the one thousandth Summer Sun Celebration since she was banished induced labor, and Dumb Luck was born a few hours later. Although it was later described as a happy accident by both his parents, it was not the last time that something strange occurred because of his involvement, usually without his intention whatsoever.\n\nWithin his first year, he almost died a total of sixteen times, either from accidental neglect by his parents, to freak accidents including his crib collapsing and his nursery room's walls being torn off in a wind storm, to complete unknowns when he was fed a small amount of peanut butter pie to celebrate his family's first Mother's Day and going into anaphylaxis. However, after his harrowed infancy, Fate seemed to grow bored with him for a while. His youth was rarely eventful, and with the Great War so far away, he never had to worry about bombers, tanks, or changeling infiltrators causing havoc. Detrot was small and distant enough it barely registered on anypony's radar. There would be little reason for anypony to worry about it.\n\nHowever, when Sinister's invasion of Equestria began, he was conscripted into the city militia by the sparse Equestrian garrison. Due to his larger frame, he was believed to be at least five years older than he was, and it was only through him stumbling on a broken piece of concrete that he avoided a bullet piercing his brain when the Stalliongradians swept through the city. While he was kept in a prison camp, he began to read some of the literature there of Caramel Marks, and his eyes were opened by her fiery belief in a worker liberation. When Stalliongrad retreated and recognized a free territory, the Free Democratic Albion Ponies Republic, he finished schooling and became an eager worker in one of Detrot's publicly-owned factories.\n\nAs a last twist of Fate, when the working council visited their cities, a disagreement broke out after the previous union head, Silk Lace, choked on a hayburger and left them leaderless. He merely walked by on his way home as the council was arguing over the corpse and got in the way as multiple ponies voted by pointing at their intended successor. Although not planned, he ended up being indicated. Since then, he has led the Republic by the skin of his teeth. Perhaps his luck will run out, or maybe Fate will throw him another curve ball. Whatever his lot, though, he will take it with a smile. After all, he's free, just like everypony else, including freedom from consequences themselves.\n\n§YPortrait by:§! sirbreadstick"

