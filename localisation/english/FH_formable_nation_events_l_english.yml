l_english:
  ###Flavor###
  formable_flavor_event.1.t:0 "Freedom!"
  formable_flavor_event.1.d:0 "On the outside, many would think being leader of Albion was easy, after all, it's the only power left in the world, the leader should have the entire world in their hooves, as every enemy lays dead. This is false. Albion has never struggled against its external enemies, as evidenced by their repeated victories. No, the enemies to Albion are now stronger than ever, as they sit in front of the leader, their shrill voices arguing with one another.\n\nThe storm creature argues against the Great Laker over a border territory, a cacophony of Herzlandish and Aquileian clash over resources to rebuild ancient monuments, and the macaw struggles to breathe as a deer almost smothers him in cuddles. Every single day, every single move of Albion has been restrained by these debates, these fights, these meaningless, horrible agreements that create names larger than the country itself. Many think that Albion is a dictatorship, but that's wrong, it is, and always has been, a committee making the worst possible decisions and somehow succeeding. One can only take so much arguing before they... break.\n\nWith a flick of a hoof and the click of a button, radios scream to life across the country, greeted by the loud debates of their overlords, silenced by the loud shout of the leader. "Listen up!" The cry causes the entire world to go silent for a moment, as creatures both young and old, rich and poor, listen. "Effective immediately, every occupation government is to be annexed into one single state; every governor and every leader other than me is out of a job!" Gasps ring out across three continents. "Effective immediately my position as leader is abolished! All councils and government positions are abolished! All monetary institutions are abolished!" A grin crosses the leader's face. "We shall be stateless, we shall be moneyless, we shall be classless. Is that not what we have fought in service of for so long, comrades? Let's make Marks proud. Today, I declare Albion to a complete, and total, state of Freedom!""
  formable_flavor_event.1.a:0 "Freedom! Freedom! Freedom!"
  formable_flavor_event.2.t:0 "If Any Hope Remains..."
  formable_flavor_event.2.d:0 "I can hear them coming. The others are holding the line, I can only hope for long enough. Once, I interviewed a member of the Upper Party of MARESOC, and I told everyone what they said. I told everyone, all the leaders and nobles, that they were coming. They'd never be satisfied with just Griffonia. But none of you listened. I hope you're hearing this, Chrysalis, Daybreaker, Zarca, all the Kirin priests and all the Chitali Vikingar. I told you to prepare, but you didn't. You tore yourselves apart. So caught up in your own battles, you ignored what was coming. None of your citizens deserve this fate, but you, I'd wish the worst of deaths on all of you. They're coming now, to the last pocket of resistance that still stands. I can only hope others are listening to this message. I hope the world has enough mercy that someone will listen to this last gasp of the free world.\n\nThey've won. The Party has won. Our leaders did nothing about it. I want everyone to remember that when The Party begins to make your life nothing but misery. I've seen what MARESOC does to ponies. I know my name won't be remembered. I know I won't be in any history books. After today, I won't exist anymore. I just have one last thing to say. I've seen the party members and how they act, and above all, I've seen the Proles. Unrestrained, dirty, vicious, but real, more real than anything. I think one day, The Party shall be nothing but a memory, but it won't come from the party members themselves, or the hopeless rebels who cling to the past. If any hope remains..."
  formable_flavor_event.2.a:0 "It's with the Proles."
  formable_flavor_event.3.t:0 "A Fireside Chat"
  formable_flavor_event.3.d:0 ""Good evening, ponies, diamond dogs, and every other creature of the Riverlands. I hope you're all settled in, warm and cozy in your homes. I am, at least, here by my fire, with nothing but a small cup of tea, and this radio. I know many of you have had worries about my soldiers, many of you have lost loved ones in this war, many of you likely don't even remember who I am. My name is River Swirl. Near twenty years ago, I lost an election to Limelight, and, with respect to the will of the ponies, I stepped aside. However, over the next few years, I watched, with horror, as the same democracy that picked Limelight was destroyed by her very hoof. Our principles of freedom, liberty, democracy, dismantled piece by piece. I tried to resist, and for that, I, and those who love freedom, were exiled north.\n\nThis is why the war had to happen, my citizens. The light of liberty is lit by the blood of those willing to fight for freedom, and though I mourn every lost soul in the war for liberty, I will not mourn the victory we've achieved. Many of you will call me a dictator and I don't blame you, but I'd like to make one thing clear. The Riverlands have always been the home of freedom, and enemies surround us, jealous of that freedom. The Empire, our old foe, and Marelandia, a threat like none we've seen before, will come for us. But the light of liberty has no border, no species, no end. So, my citizens, pick up arms and march as one, and together, let us fight for our freedom.""
  formable_flavor_event.3.a:0 "Liberty, light the way."
  formable_flavor_event.4.t:0 "The Prophet of Profit"
  formable_flavor_event.4.d:0 "Heinrich Greytalon had never been to Zebrica before, there was little time, with the Empire demanding all it could to keep safe from the Marelandians and Riverlanders. It was inevitable though that he would come here, the new capital of the world, the Eye of the Storm. Krähe-Stahl would survive this change in leadership, just like it always had. He looked off the side of his ship as they approached the home of the Storm Creatures, surrounded by a constant storm, rain pattering down on a grey coat. For a second, he rested a claw on his chest, where within a pocket laid an idol of Grover, the late Emperor's presence calming him.\n\nElytra sat in a funicular headed to the old palace of the Storm King, a badge on her green coat declaring her a representative of Carapace Motors. Her head is filled with memories of the Siege of Vraks whenever she looks at a Storm Creature. Across from her, Checkmark remembered the Great War, and the fall of Celestia to Daybreaker, her yellow suit proudly proclaiming 'Friendship Express'. She tried not to look at Elytra. Her nose scrunched up from the cigarette smoke of her neighbor, an old stallion in a red suit, here to represent Manesibishi. A scar on his cheek reminding him of Wingfred, of the family he used to have.\n\nBehind the leader argue a zebra from Ochzor Rifle Designs and a Kirin from Dreamboat International, the ends of their mane sparking from anger. Here, in the capital of the world, all come together for another shareholder meeting. They will argue, they will hate each other, holding onto old grudges and old blood spilled. Yet they'll forget it all when profit is on the line. Electronics companies, tank companies, rifle companies, species, rivalries, none of them matter anymore. All are one in the chase of profit, all are one in the chase of prosperity. All are one, under the Storm."
  formable_flavor_event.4.a:0 "It's just good business."

  ###Decision events###
  formable_event.1.t:0 "[FROM.GetNameDefCap]'s Plea"
  formable_event.1.d:0 "This morning, a communique from [FROM.GetLeader] in [FROM.GetNameDef] arrived for [ROOT.GetLeader], marked urgent and of highest priority. Although the bureaucratic changelings that handled the various chains to pass it up to [ROOT.GetLeader] have all expressed curiosity, given that it was marked for [ROOT.GetLeader.GetHerHis] eyes only, and not wanting to risk earning [ROOT.GetLeader.GetHerHis] ire, they did not dare read its contents.\n\nOnly recently has the information been made known. Apparently, as it is both the largest and most "competently run" of the three Equestrian protectorates, [FROM.GetLeader] has requested, or more accurately, demanded that we order [CCA.GetNameDef] and [NCA.GetNameDef]'s administrations to shutter and to incorporate into theirs. Despite attempts to keep things quiet, leaks must have already reached both protectorates, as they have petitioned [ROOT.GetLeader] to ignore the request. Its unprecedented nature has left changelings babbling, though. There is a likelihood that [FROM.GetLeader] would secede from the Hegemony and try to take what has been claimed by force, which, with our forces still facing internal problems, could destabilize the Hegemony entirely.\n\nIt is up to [ROOT.GetLeader] what our response shall be."
  formable_event.1.a:0 "They do have some points..."
  formable_event.1.b:0 "Are they mad?!"
  formable_event.2.t:0 "Striking Gold"
  formable_event.2.d:0 "It didn't take long for [FROM.GetLeader] to get back to us, as no doubt with the rest of the Hegemony falling apart at the seams, any chance to lessen the organizational nightmare that is keeping the other Equestrian protectorates in line would be taken at first opportunity. As we asked, in the politest of terms, [NCA.GetLeader] and [CCA.GetLeader] have been recalled to Vesalipolis as well as many of their closest supporters. What remains has been dictated to maintain stability until we can formally annex the two other protectorates and appoint officials of our own.\n\nIt will not be long before we have a protectorate spanning from Luna Bay to the Fire Sea!"
  formable_event.2.a:0 "We can't stop winning!"
  formable_event.3.t:0 "Coming Up Dry"
  formable_event.3.d:0 "A quick response has already arrived from [FROM.GetLeader], but it did not contain the answer we were looking for. Either [FROM.GetLeader] is blind or willfully ignorant that the Hegemony is crumbling and could be blown away by a breezie sneezing a mile away. In [FROM.GetLeader.GetHerHis] tersely worded telegram, [FROM.GetLeader] reprimanded us for growing greedy and wishing to take that which is not ours to have. Since the message, [ROOT.GetLeader] has requested that the ambassadors from us to the Hegemony be withdrawn, and has ordered our own troops to secure the border and prevent free passage of changelings or ponies from other protectorates to our lands. While there has not been a reaction yet, it will probably not be long. However, this was a possible scenario, and we believed it to be expected. We'll strike first instead."
  formable_event.3.a:0 "Aw, dang it!"
  formable_event.4.t:0 "A Tempting Offer from [FROM.GetNameDef]"
  formable_event.4.d:0 "Unexpectedly, a couple of finely dressed ponies as well as a changeling arrived in Vesalipoilis to speak with [ROOT.GetLeader], which they said was to discuss a "lucrative" opportunity for both [ROOT.GetNameDef] and [FROM.GetNameDef]. While it is highly unorthodox to bypass so many layers of bureaucracy and red tape, as they effectively walked right through the front doors of the Queen's Tower and simply acted like they knew what they were doing there, [ROOT.GetLeader] humored them and heard their request.\n\nAlthough they were loquacious and meandering in their pitch, with many words devoted to "unrivaled growth" and "perfect business opportunities," their proposal was eventually delivered. In short, [FROM.GetLeader] approved that the various casinos and other tourist centers pool their resources and offer to buy out the other two Equestrian protectorates, with a humble share of any future profit provided to the government as taxes. Along with money, they have offered some of their love supplies as a gesture of good will. All of it merely on the pretense of simplifying the administration for [ROOT.GetLeader].\n\nWhile it could benefit the Hegemony, it would give [FROM.GetNameDef] outsized power. Ultimately we defer to [ROOT.GetLeader] to decide."
  formable_event.4.a:0 "We could really use the love..."
  formable_event.4.b:0 "The protectorates are not for sale."
  formable_event.5.t:0 "Money Talks"
  formable_event.5.d:0 "Our delegation to Vesalipolis has returned in short order with the news we wished for. [FROM.GetLeader] has agreed to the transfer of funds and love and will be recalling [NCA.GetLeader] and [NCA.GetLeader.GetHerHis] administration back to Vesalipolis, and approved the military action to depose [SCS.GetLeader] and hand the keys of [SCS.GetNameDef]'s government to us. While it certainly has hurt us in the short term, the profits we shall reap from new tourist destinations and mineral deposits will pay off in no time at all!"
  formable_event.5.a:0 "A twenty-four karat run of amazing luck!"
  formable_event.6.t:0 "Empty Pursetrings"
  formable_event.6.d:0 "Today the ponies and lone changeling that we sent to Vesalipolis have returned, although it appears by the skin of their teeth, as they are all dirty, disheveled, and distressed. According to the changeling, the lead negotiator, [FROM.GetLeader] attempted to have the three arrested for both breaking decorum on entering the Tower without going through proper channels and also for effectively trying to bribe [FROM.GetLeader.GetHerHim] into a move that would only hurt the Hegemony in the long run. Thankfully, though, the money that we had planned to spend was never transferred to a neutral third party, so we have every bit we intended to use, which would be perfect for hiring some mercenaries. We need access to the other protectorates' resources, and with [FROM.GetLeader] suspicious of us, a war is inevitable. However, that is just the cost of doing business, and it could be something we profit from, too."
  formable_event.6.a:0 "A twenty-four karat run of bad luck!"
  formable_event.7.t:0 "[FROM.GetLeader]'s Warmongering Heart"
  formable_event.7.d:0 "We have received a request from [FROM.GetNameDef] to be sanctioned to ignite some of the flames of the Great War again. To wit, [FROM.GetLeader] has asked to be given carte blanche ability to wage war to whatever level [FROM.GetLeader.GetSheHe] deems necessary against the pony splinter nations and [SLE.GetNameDef] directly in the Equestrian Heartlands. There is no expectation that we would fight alongside them, merely that [ROOT.GetLeader] approve this military intervention.\n\nWhile the Heer's control of Vanhoover has been a necessity since the 1044 uprisings, [FROM.GetLeader] has clearly [FROM.GetLeader.GetHerHis] own plans and ambitions. If those remain loyal to the Hegemony, then it could benefit us; but if it backfires, it could unite the Equestrian Heartlands against us and it could lead to a much bloodier second Great War.\n\nThis is only something [ROOT.GetLeader] can choose to approve."
  formable_event.7.a:0 "It couldn't hurt to finish what we started."
  formable_event.7.b:0 "[FROM.GetLeader] is overstepping [FROM.GetLeader.GetHerHis] bounds!"
  formable_event.8.t:0 "The Queen's Orders"
  formable_event.8.d_a:0 "This morning a letter arrived from [FROM.GetLeader], sealed by [FROM.GetLeader.GetHerHis] own hoof stamped for [ROOT.GetLeader]'s eyes only. However secretive, though, the contents were soon shared with the rest of the General Staff. We have been approved to perform military interventions and special operations against the Equestrian Heartlands, both for resources, love, and for bringing much-needed stability for them all. We are already beginning to mobilize, as the Great War shall soon be resolved. History shall remember us as the true victors above all the others"
  formable_event.8.d_b:0 "A tersely worded telegram—even by telegram standards—was transmitted to the General Staff today in the morning briefings. Supposedly directly written by [FROM.GetLeader], it subsequently warned [ROOT.GetLeader] to stay in [ROOT.GetLeader.GetHerHis] lane. In no uncertain terms, we are not to engage in military operations without approval and request by Vesalipolis. Anything else will be seen as treason and disobeying orders."
  formable_event.8.a:0 "We'll be in and out in no time at all!"
  formable_event.8.b:0 "Well, that's that, then."
  formable_event.9.t:0 "A Guiding Hoof"
  formable_event.9.d:0 "In a Hegemony wide military staff meeting this week, [FROM.GetLeader] made a bold proposition which goes against much of the nature and intention of the different Equestrian protectorates. As [FROM.GetNameDef] is the most orderly and prepared for military action in case of a resurgent [SLE.GetName], it supposedly is sensible that the other administrations of the protectorates be rolled in under the command of [FROM.GetLeader.GetHerHim], so that the Heer could have a larger presence across the occupied territories. Additionally, it would provide new jobs and roles for changeling settlers in the other protectorates, and even be a way for pony collaborators to prove their loyalty.\n\nUnsurprisingly, this has caused a stir in Vesalipolis, as it would disrupt the balance of the protectorates and give the Heer more power than it already wields within the Hegemony. At the same time, there is a point to be had regarding maintaining stability and preventing any rebellions like that in 1044. It would require intervention in [SCS.GetNameDef], however, but plans have been in place for removing [SCS.GetLeader] if need be for over a decade.\n\nWhile this is an unorthodox request, it has its merits. We await the Queen's decision."
  formable_event.9.a:0 "Whatever keeps the peace."
  formable_event.9.b:0 "[FROM.GetLeader] should remember [FROM.GetLeader.GetSheHe] can be replaced."
  formable_event.10.t:0 "Marching Permitted"
  formable_event.10.d:0 "It appears that the words and theoreticals that were provided by [ROOT.GetLeader] to the rest of the Hegemony in the latest military meetings have borne fruit. Between the chaos and crumbling base of the Hegemony itself, the fact that we have kept [ROOT.GetNameDef] orderly and working after such a horrible uprising as in 1044 is testament enough that we are the only who are able to keep the Equestrian protectorates in line. To that end, integration is the only logical conclusion. To noling's shock, it has been agreed that the Heer can oversee the remaining territory in Equus.\n\nWe have already moved south to [SCS.GetNameDef] to arrest [SCS.GetLeader] for anti-Hegemony activities. Everything will soon be under the protection of the Heer."
  formable_event.10.a:0 "We have brought stability, order, and justice to our new territory!"
  formable_event.11.t:0 "No Go"
  formable_event.11.d:0 "Despite all the arguing and persistence by [FROM.GetLeader] to the Hegemony's General Staff and to [FROM.GetLeader], it appears that the simple solution to the issue of the Equestrian protectorates is either not seen, or chosen to be ignored. Although we could have easily begun integrating the other administrations, it is US that have been ordered to return to Vesalipolis for "fresh training" and most likely will see our protectorate dissolved into [CCA.GetNameDef] or annexed entirely.\n\nHowever, we are an army with a state. We do not have to comply. Perhaps it's time we merely take what we deserve by force, regardless of if it is against a fellow changeling or not."
  formable_event.11.a:0 "[FROM.GetLeader.GetSheHeCap] had [FROM.GetLeader.GetHerHis] chance."
  formable_event.12.t:0 "Laced Words"
  formable_event.12.d:0 "To the lovely, long-lived, and long-suffering [ROOT.GetNameDef]\n\nI, [FROM.GetLeader], write this personally to inform you that it has caused as of late my deer great dismay to learn that at one time, [FROM.GetNameDef] was once far grander, larger, and a nation worthy of respect. We have been steadfast supporters of your regime since its earliest days, but we feel we are not being treated as equals, despite the decades of loyal service. We understand that the [FROM.GetAdjective] have every right to cohabitate with our citizens in our cities. Likewise, we know that while we did fight back when you came to liberate us from the cruel and corrupt Johan, we have aided you however we could. Our materiel was paramount to achieving victory in the Great War!\n\nDutifully, we are aware that the Equestria was not fully conquered, but we have done our part. Could you find it in your heart to return our motherland to us? Vaverfront is unrecognizable, for the better, of course! It speaks of [FROM.GetAdjective] ingenuity and why we deserved to be conquered. However, it is becoming a pain point among debates and some bucks have begun to butt horns over it in the streets. We promise that any and all [FROM.GetAdjective] citizens will not be evicted from their homes. It would be an absolute shame if all that work went to improving our old cities was destroyed in retaliation.\n\nPlease also take this buck, a fine example of [FROM.GetAdjective] winterization, and listen to his plea. He has never seen his birthplace, for his family was jettisoned from Vaverfront shortly after the Great War. Hug him. Feel every ounce of his despair through his impeccably fluffy coat. Do be gentle with your words, though. The old lands are a trigger point for him.\n\nWith greatest sincerity,\n[FROM.GetLeader], Governor-Protector of [FROM.GetNameDef]"
  formable_event.12.a:0 "Such soft fur! They can have it."
  formable_event.12.b:0 "They overstep their bounds, even if they are soft to the touch."
  formable_event.13.t:0 "Royal Proclamations"
  formable_event.13.d_a:0 "[ROOT.GetLeader],\n\nYou flatter me, and you know that it works. I suppose that with the right... donation of additional love taxes, we could discuss returning your old land to your deer. But please, refrain from making such foolish and obvious threats of secession or dominance. It is the oldest trick in the book for you stags. You think more with your horns than with your brains, and it shows. Did you believe that you could scare me into giving up your territory? If I wasn't prepared, you could have killed me from laughter at the idea.\n\nNo, I agree to this transfer solely because I grow tired of occupying it. But I stipulate it must come with a year's supply of love within the next month, or all deals are off. I trust that I have made myself clear, old "friend?"\n\nP.S. I'm keeping the buck you sent. He makes a mean Kalakukko.\n\nHer Royal Majesty, Terror of Equus, Arch Lady of the Hives,\n[FROM.GetLeader]"
  formable_event.13.d_b:0 "[ROOT.GetLeader],\n\nBravo. BRAVO! You really had me quaking in my chitin at the veiled threats so obvious, even Celestia would have had no issue understanding them. Did you truly believe that a pity story about poor, wretched deer missing their homes would move me to do what you wished?! Ha! You're as stupid as you are winterized! Those sob tales were a good laugh, though. My servants believed that I was being attacked by how much they echoed through my tower.\n\nIn case it still isn't clear what my answer is: No. Oh, also, you can expect an increased love tax, and an everything tax, for even THINKING about believing that we are equals. You can also take your stupid, would-be assassin back. He may be a little worse for wear, though. I know all that fluffy fur can catch fire so easily, and, well, it was rather dry in my throne room when he arrived.\n\nEnjoy the present, and if you ever think about this again, I'll gut you myself.\n\nHer Royal Majesty, Terror of Equus, Arch Lady of the Hives,\n\n[FROM.GetLeader]"
  formable_event.13.a:0 "The fluff always works!"
  formable_event.13.b:0 "They thought "no" was an option, huh?"
  formable_event.14.t:0 "Asterion Protectorate's Acceptance"
  formable_event.14.d:0 "Big Sister is doubleplushappy by writeack from [ROOT.GetLeader] for acks of Party leadership. Unleave antevisit by Party members doublepluswise going to visit carewise chosen province Harbor 1. Unaccepting is thoughtcrime. Sharing crimethink of Asterion being unprovince is thoughtcrime. Goodrecall celebrate oldprovince become newprovince. Asterion has always been Marelandia. Praise Big Sister."
  formable_event.14.a:0 "We love Big Sister!"
  formable_event.14.b:0 "We can't stay here!"
  formable_event.15.t:0 "Harbor 1's Reply"
  formable_event.15.d_a:0 "[FROM.GetLeader] doubleplushappy to greet Party. Happywise unelect ministers. Excitewise wait for oldprovince become newprovince day. All Harbor 1 goodful dance. Praise Big Sister."
  formable_event.15.d_b:0 "This alliance was purely for survival. Clearly it has become a threat to that now, too. Our answer is "no.""
  formable_event.15.a:0 "Asterion was always a part of Marelandia."
  formable_event.16.t:0 "Turning Over Leaves"
  formable_event.16.d:0 "Rather unexpectedly, we have received today a missive from [FROM.GetNameDef], requesting that we consider joining [FROM.GetFactionName] to strengthen both of our positions. In it, it was laid out that, while we may disagree on many matters, much of Griffonia has collapsed into sheer insanity. If any of us are to survive, we must band together and strive together, in unity, against the power-hungry communists, the mad religious zealots, and the expansionist democrats.\n\nAlthough we are in many ways on the back hoof, or claw, compared to the three superpowers on Griffonia, we would have the advantage of allies and of capitalizing on multiple fronts, which could weaken them all. It is a slim chance, but, as argued in the communique, a better one than simply going alone. However, what would happen later is up in the air. There is no guarantee that we would be attacked otherwise, but we would be expected to defend our allies—allies who are likely to be the start of a three-way war as one of the only independent groups on the continent—if we join them, and who can say what [FROM.GetLeader] will wish to do if we, somehow, emerge victorious in Griffonia.\n\nWe are damned if we do, damned if we don't."
  formable_event.16.a:0 "It is always wise to have more allies."
  formable_event.16.b:0 "They will drag us into a war we would have no part in."
  formable_event.17.t:0 "Word from [FROM.GetNameDef]"
  formable_event.17.d_a:0 "We have heard back from [FROM.GetNameDef] regarding our offer of joining our pact and dedication to independence from all forms of authoritarianism. While they still appear to be hesitant, [FROM.GetLeader] has agreed to join our league and will stand with us if we are ever attacked. [FROM.GetLeader.GetSheHe] shall soon send ambassadors to ensure there are proper communication channels. They will be welcomed with open wings."
  formable_event.17.d_b:0 "A response has arrived from [FROM.GetNameDef], and it unfortunately is the bearer of poor news. Despite our clear and logical outlining of what will no doubt happen if they remain isolated and alone, [FROM.GetLeader] has outright rejected our olive branch of peace and cooperation, and has indicated that there should be no further contact between our two countries. If there is, [FROM.GetLeader.GetSheHe] has promised that we will face far worse reactions than simply some strong words. For whatever reason, [FROM.GetNameDef] believes that if it simply remains neutral it will be ignored by the three superpowers. They have yet to realize they may have doomed us all."
  formable_event.17.a:0 "Welcome to [ROOT.GetFactionName]!"
  formable_event.17.b:0 "Do they think they can hide?!"
  formable_event.18.t:0 "To the Esteemed [ROOT.GetLeader]"
  formable_event.18.d:0 "Bom dia!\n\nI trust that this letter finds you well, most venerable and distinguished [ROOT.GetLeader] of [ROOT.GetNameDef]. In case we have not had the pleasure of meeting before, I am [FROM.GetLeader]. I'm sure that it may seem odd that I write these words to you myself, instead of relying upon standard, diplomatic language, but I feel that we are peers. We are equals. And as an equal, I wish to address you without any of the flowery language or the veiled requests or the hidden threats of a diplomat. That's simply not good for business, and makes things so much harder to understand.\n\nI shall get straight to the point: Your port cities must be turned over to me, or they shall be bombarded until they are nothing but dust, pounded into fine sand. Vaporized. Pulverized. Disintegrated.\n\nI trust that the message has gotten across? Of course, you may be thinking, "[ROOT.GetLeader.GetSheHe]'s off [ROOT.GetLeader.GetHerHis] rocker! We'll never surrender our sovereign territory!" To that I thoroughly congratulate you on your gumption, but it's foolhardy.\n\nRemember how our islands were once held by one of MARESOC's cronies? What happened to them? Oh, that's right, they're not around anymore. Thanks to us. So, if we were able to defeat MARESOC, what do you think we could do to you if you don't give us what we're so politely asking for? It's not like we want all your land, anyway, but some nice treaty ports to start building our coffers back from that expensive war with MARESOC would be appreciated.\n\nI trust I've made myself clear?\n\n\I anticipate your reply.\n\nAdeus!"
  formable_event.18.a:0 "They do have a point..."
  formable_event.18.b:0 "Someone has to tell them "no" eventually!"
  formable_event.19.t:0 "The Trade Port Tango"
  formable_event.19.d_a:0 "It appears that [ROOT.GetLeader]'s overtures and insinuations about our military prowess have borne fruit, as today we have received word from [FROM.GetNameDef] that they will be transferring, as requested, all indicated ports they control to our claws instead. It is expected to be quicker than anticipated, and we have promised that we will uphold local laws, customs, and holidays, as we do, ultimately only need the ports for rebuilding our coffers. And, of course, continuing to fill them after our debt has been paid off. But they don't need to know that."
  formable_event.19.d_b:0 "Seemingly the saying that must have started with dealing with stubborn earth ponies has reared its head again. One can lead a pony to water, but one can't make them drink. Despite [ROOT.GetLeader]'s polite, if forceful, demands for ceding their major ports to us, [FROM.GetNameDef] has decried our bold maneuvers and appears to be mobilizing in response. If they wish to fight for their blasted land, then that is fine with us. We've dealt with worse, after all. Besides, now we can take ALL their land, and use it ALL to pay off our debts. It's a win-win!"
  formable_event.19.a:0 "Maravilhoso!"
  formable_event.19.b:0 "Maldições!"
  formable_event.20.t:0 "Whispers from the North"
  formable_event.20.d:0 "From [FROM.GetLeader.GetSheHe] Who Makes the Sands Swirl:\n\nGreetings, fellow wanderers of the dunes, I seek to parlay with you and lay my heart bare so that it may be seared by its heat. For many suns, you have been separated from each other and have squabbled like siblings with their petty arguments. The Desert has swallowed countless of your warriors' bones and feasted upon your flesh, but for what purpose? I shall tell you: foolishness! Only fools pick at the carcass of a dead land and fight for scraps of scraps from the table when there is communion under the eternal glare of the fiery orb in the sky! What have you accomplished in your years of fighting? Only pain and suffering.\n\nYou misguided travelers. You lost vagabonds. You water the sands with your blood, when you could marvel at its beauty and embrace its harshness to teach you resilience and community. I speak for that community, and implore you that you accept my extended hoof. We are all seekers of the sweeping dunes. There is no more reason for us to be separate.\n\nIf you refuse, then the Desert's judgement shall be swift, for it will carry the frigid winds of the north, and upon them, the chittering hordes of the night.\n\nDo not let Fate decide. Be masters of your own destiny by joining together with your brothers!\n\nMay the grains you find in your manes not be difficult to extract.\n\n[FROM.GetLeader.GetSheHe] Who Makes the Sands Swirl"
  formable_event.20.a:0 "We shall join our desert brethren!"
  formable_event.20.b:0 "We shall never give up our freedom!"
  formable_event.21.t:0 "The Desert Howl"
  formable_event.21.d_a:0 "After a series of meditations and communions with the Desert, [ROOT.GetLeader] received communication from [FROM.NameDef], as [ROOT.GetLeader.GetSheHe] anticipated and predicted. The messenger soon arrived with the letter, and after blessing it, it was opened to reveal a parting gift from [FROM.GetNameDef] and a promise that they would indeed allow us to claim their land and rule over it, so that we can all commune together. Our desert brethren will be infrequent sights, though, given they are so dispersed across the Zebraharan, but knowing that there will be no more quarrels between them is still worthy enough of celebration. Tonight, we shall feast in their honor!"
  formable_event.21.d_b:0 "Foreboding dust storms and sand clouds heralded the return of the messenger from [FROM.GetNameDef], the weather enough to agitate the joints and limbs of [ROOT.GetLeader] and leave [ROOT.GetLeader.GetHerHim] bedridden for the day. The messenger had to deliver the response of [FROM.GetLeader] to [ROOT.GetLeader.GetHerHis]'s bed for it to be read. Afterward, the weather only worsened, as if the Desert itself knew that its communion with our brethren was disrupted and broken.\n\nAs much as we considered it, but ultimately dismissed it, [FROM.GetNameDef] has denied us for claiming their territory as our own. Given that they were so dispersed, we would have had very little authority over them, but could have prevented further bloodshed. That doesn't appear to be an option now. The Desert will swallow their bones, and we shall be the ones who strip the flesh off them."
  formable_event.21.a:0 "May their ears remain unclogged by sand!"
  formable_event.21.b:0 "May they find sand in the most unmentionable of places!"
  formable_event.22.t:0 "[REDACTED] FOR [REDACTED]"
  formable_event.22.d:0 "TRANSMISSION FOR: [ROOT.GetLeader]\n\nTRANSMISSION BODY: NIGHT SHIELD YOU. I AM HER MAJESTY'S LOYAL SERVANT, [REDACTED], ONE OF [REDACTED]'S MOST TRUSTED [REDACTED]. THIS SEEKS TO OPEN COMMUNICATIONS BETWEEN YOU AND [REDACTED] OF THE CHIROPTERRAN COMMONWEALTH.\n\nWE SEEK ALLIES.\n\nWE OFFER YOU MUCH IF YOU WILL [REDACTED] THE DEER AND SIDE WITH US WHEN, NOT IF, THERE IS CONFLICT BETWEEN [REDACTED] AND HINDIA. WE UNILATERALLY OFFER THE RETURN OF YOUR LOST TERRITORY WHEN THE WAR IS OVER. ADDITIONAL TERMS WILL FOLLOW, BUT WE EXPECT [REDACTED] FROM [REDACTED] TO COVER [REDACTED] [REDACTED] FOR [REDACTED].\n\nARE THESE TERMS ACCEPTABLE?\n\nSTARS PROTECT,\n[REDACTED]\n\nEND TRANSMISSION"
  formable_event.22.a:0 "Better the bats than be under the hoof of the deer."
  formable_event.22.b:0 "I don't trust what I can't read..."
  formable_event.23.t:0 "The Llama in the Room"
  formable_event.23.d_a:0 "A thousand blessings upon you. I speak for [FROM.GetLeader] and have been told to be bearer of the glad tidings and good news. After much debate—hours, days, weeks, months!—we have come to a formal decision. Although the difficulty of your message to interpret caused us some concern, we agree that remaining forever stuck under the deer's hoof is not a way for us llamas to retain our dignity. For, you see, we were once a proud country, before we were humbled and betrayed, forced to cede land then swear fealty to our so-called allies. I shall refrain from speaking more on the issue, for I wish not to bore you with such minor details. I understand that you are a busy thestral.\n\nOr maybe you're a zebra?\n\nI must beg your forgiveness, but as so much of your communication was replaced with rather odd usage of a word, we do not know your name. In fact, we are only presuming that you wished to speak with [FROM.GetLeader]. If this is not the case, then please ignore this letter and do not inform [CTL.GetLeader].\n\nHowever, if you are sincere, then so are we. We shall be ready for our war of restoration. Come the first shot, the mountains shall quake with our vengeance!\n\nTruly, Llam Stang"
  formable_event.23.d_b:0 "A thousand curses upon you. I speak for [FROM.GetLeader] and together we spit on your collective grave! You may ask, "What grave?" Yours! The one that shall be dug for you when we llamas honor our masters by spitting on you! Repeatedly! How will you like that?! That's right, you'll be dead!\n\nOh, in case you couldn't tell, we reject your offer. Presuming you had one to begin with. You may need to doublecheck your vocabulary. You repeat the same word over and over again. It is very confusing.\n\nI spit on you!\n\nSincerely, Llam Stang"
  formable_event.23.a:0 "Hopefully they didn't break opsec by writing all this."
  formable_event.23.b:0 "It wasn't THAT hard to understand, was it?"
  formable_event.24.t:0 "Vermillion's Verisimilitude"
  formable_event.24.d:0 "The Most Honored Of Griffons:\n\nLong ago, your people came to our lands as adventurers, whilst the Silence reigned above us all. Yet as silent whispers fall upon ears closed, so too does the world change, slow and without notice. Like the scaled, the southern realm of griffons has remained unfettered by the passage of time, nor by the darkness all-embracing. Times have changed and past adventures forgotten, only to be discovered once more.\n\nThe harmonic realm of [FROM.GetNameDef] humbly embrace our feathered neighbors under our protection, if they would have it. The jungles hold many secrets to discover, and there would be none better than those adventurers far astray from home to find them. Though this land may be overseen by scales currently, we look forward to it being looked over by feathers instead, in return for protection and friendship. Look to the realms of deer, zebras, and all else under the Vermillion banners and you will see the destiny and prosperity of friends. We pray to see you in Vermillion as friends."
  formable_event.24.a:0 "Forget home, it's time for a new destiny."
  formable_event.24.b:0 "We will not serve!"
  formable_event.25.t:0 "Griffon Guardianship"
  formable_event.25.d_a:0 "To The Vermillion Court:\n\nWe in [FROM.GetNameDef] are honored by the offer from the hegemon of the East. Servitude is nothing we are unfamiliar with, nor anything we are ashamed of, as many griffons of our realm came from Duchies and other subject states. Our forefathers were adventurers, brave and bold, ready to explore the unfound places in our world. Though many of our hearts ache to return to home, we find that, perhaps, there is no better way to honor our ancestors than to continue their mission in Zebrica. Deep in the hearts of all our griffons burns the love of adventure and discovery, and we are honored that the Kirin realm would support this burning spirit.\n\nA ship will be sent posthaste to the nearest Kirin port, where our most friendly of griffons will discuss specific terms with the Vermillion court. When all is said and done, we hope our Kirin friends will welcome us, as we have welcomed you."
  formable_event.25.d_b:0 "To The Vermillion Court:\n\nWe in [FROM.GetNameDef] were honored to read your request, as we did not expect the hegemon of the East to give us much attention. It is true that many of our forefathers were explorers and adventurers, and many were subjected to a mighty leader such as yourself. Yet deeper than that, we are griffons, and we yearn for a return home. Our home has been taken by madness, greater than any in Zebrica, and we would be Maar-spawn if we refused to return home to help fix matters.\n\nThough we are honored by your proposal, we must reject it. Our Griffon hearts are too prideful to accept any liege whose name is not Grover, and we could never accept a leader not ordained by Boreas. [FROM.GetNameDefCap] remain independent, now and forevermore. But do not take this as a statement of hostility, Vermillion, we are still willing to trade and such."
  formable_event.25.a:0 "Harmony extends another step."
  formable_event.25.b:0 "Prideful birds..."
  formable_event.26.t:0 "Vermillion Vassalage"
  formable_event.26.d:0 "To The Most Honored [ROOT.GetLeader]:\n\nIn the east, scarlet has fallen to Vermillion, and in cracked marble and bloodied gold, peace finds a home once more. As they rose, they have fallen, and all memory of Roam shall fade in time. Yet Vermillion were not the only foes of Roam, no, as many prisoners tell tale of centaur bravery and chivalry.\n\nAmongst the lands now under the Vermillion banners are many centaurs and many gargoyles, nostalgic for the days of the Ancient Pact. Though roads have bent and years have passed, the memories of past alliance are never forgotten. The Vermillion court seeks a new member in the [ROOT.GetAdjectiveCap]s, and servitude will be rewarded handsomely. Join us and all the lands of old will be returned, and rebuilt by Kirin hooves. We hope to see the [ROOT.GetAdjectiveCap]s as friends in court."
  formable_event.26.a:0 "Prosperity over sovereignty."
  formable_event.26.b:0 "We will never bow!"
  formable_event.27.t:0 "Pact Protectorate"
  formable_event.27.d_a:0 "Hundreds gathered in the streets of Vermillion, curious Kirin eyes stared from the side of the roads, watching a contingent of a hundred centaurs marching as one down the road. Their armor glittered in the light, polished chainmail and sharpened swords catching the sun's light. The hundred soldiers kept their eyes ahead, only brought to a stop as armored cars pulled onto the street in front of them. Kirin soldiers climbed out from inside, rifles raised as mounted turrets turned to face the centaurs. An officer hopped down from a vehicle, Griffonian-made cigarette lightly hanging from his lips. He shouted to the centaurs, "Halt in the name of the Matriarch! We didn't get any news from outlying settlements about centaurs coming here, you better explain yourselves."\n\nThe centaurs came to a stop, until one stepped forward, armor glinting in the light. He lifted an arm up, and gave a small bow to the Kirin officer, "Sir Vitiges, Knight of the Ostrocentaurs. Your fellow officers said they would prefer our arrival to be a surprise. I disagreed, but they were stubborn." He reached into his armor, taking out a letter, offering it to the officer, "We are here to deliver this, and ourselves. The [ROOT.GetAdjectiveCap] have proven themselves friends of the [FROM.GetAdjectiveCap], and we shall happily serve them in turn. It is Centaur tradition to send a hundred guards to defend whatever leader they might serve. Do we have an issue?"\n\nThe [ROOT.GetAdjectiveCap] officer looked over the letter and smoke bellowed from their mouth as they breathed out. After long minutes, they gave the letter back, "Well, our guards use guns, not swords." The centaur smirked slightly under his helmet, "We know how to use guns, kirin. But guns are a lot less impressive looking." The officer took a second, and then spat his cigarette onto the ground, putting it out with a hoof, "Fair enough. Come on, the Matriarch will wish to meet you.""
  formable_event.27.d_b:0 "Court of Vermillion:\n\nJust because you have defeated Roam, do not believe we are deceived to believe you are anything different than they are. The shade of red has changed, and stripes have been replaced with scales, yet you both are obsessed with destroying the legacy of the Centaur species. Centaurs do not bow to foreign overlords, we have not before, and we will not begin now, no matter how nicely you may ask. If you wish to see our proud nation brought low, then we invite you to come and try it. Blood and steel shall follow, and you will discover firsthand the unbreakable Centaur spirit. Try it."
  formable_event.27.a:0 "A surprise to be sure, but a welcome one."
  formable_event.27.b:0 "We tried to be nice."
  formable_event.28.t:0 "A Protectorate's Proposal"
  formable_event.28.d:0 "Most Esteemed Friends of Vermillion and [NVA.GetNameDef]:\n\nLong have the days been since [KIR.GetAdjectiveCap] forces marched into our lands, freeing us from the strife brought by Roaman hooves. Long have the citizens of [FROM.GetNameDef] been loyal to the ones who freed us, and long have we acted as the foremost servants of the [KIR.GetAdjectiveCap] desires. Yet the days grow long, and darkness grows on the horizon, as enemies new and old awaken, deigned to break the hegemony of harmony that has long been [FROM.GetNameDef]'s home. Our forces lay split amongst different leaders, as zebras and kirin are split into [FROM.GetNameDef] and [NVA.GetNameDef], a choice good for peace, verily, but one flawed come the drums of war.\n\nIt is the idea of [FROM.GetNameDef] that our forces should be split no more. Zebras and kirin are strong on our own, this is true, but imagine the harmony our forces could have as one? Potions mixing with the natural magics of kirin, the harmony of species working between both forces. We wish to bring negotiations together to propose a new state be created, a mixture of both [FROM.GetNameDef] and [NVA.GetNameDef], to better protect the realm of Vermillion. We eagerly await your response."
  formable_event.28.a:0 "One state will be easier to manage."
  formable_event.28.b:0 "As long as we are treated as equals."
  formable_event.28.c:0 "There's no need to shake things up."
  formable_event.29.t:0 "The Integration Initiative"
  formable_event.29.d_a:0 "To the wise protector of [ROOT.GetNameDef]:\n\nFires rise without steady hooves to calm them. Scarlet legions clash with distant red banners held aloft, with barbarians and savages left caught between both sides. Our borders grow more tenuous by the day as the barbarians knock at the gates, sharp teeth and silver tongues asking entry, that they might destroy the peace long built. Kirin and zebras have much harmony between them, this is true, thus it is clear that there is little to gain from further separation. Negotiations will be held in Vermillion, we happily await your attendance."
  formable_event.29.d_b:0 "To the protector of [ROOT.GetNameDef]:\n\nWhat has worked, will work. We would not wish to upset the carefully crafted harmony between our nations, through the hurried combination of protectorates into one. [ROOT.GetNameDefCap] will need to be content with what they have for now. You are welcome to come to Vermillion to negotiate, however. But we will be hard to convince."
  formable_event.29.a:0 "A joyous day!"
  formable_event.29.b:0 "We can convince them!"
  formable_event.30.t:0 "The Negotiation Table"
  formable_event.30.d_a:0 "The sun shined brightly down on Vermillion, golden rays cascading warmth and light upon the many kirin and zebra beneath. It was to be a day for the history books. After some back and forth letters, the time had finally come for [ZLU.GetNameDef], [NVA.GetNameDef], and Vermillion to negotiate the clean transfer of [NVA.GetNameDef] under [ZLU.GetNameDef] control. The talks were sure to be long and tedious.\n\nThe talks lasted for hours, as the dignitaries from [ZLU.GetNameDef] and [NVA.GetNameDef] discussed and negotiated all manner of details. What would happen to the various factories? Who would command soldiers? How would we ensure there was equal treatment of zebra and kirin both? Yet with the wise and calm [KIR.GetLeader]'s aid, as well as much alcohol shared between all sides, the negotiations eventually came to an agreement. From this day forward, [ZLU.GetNameDef] and [NVA.GetNameDef] were to be one."
  formable_event.30.d_b:0 "The sun shined brightly down on Vermillion, golden rays cascading down warmth and light upon the many Kirin and Zebra beneath. It was to be a day for the history books. After some back and forth letters, the time had finally come for [ZLU.GetNameDef], [NVA.GetNameDef], and Vermillion to negotiate the clean transfer of [NVA.GetNameDef] under [ZLU.GetNameDef] control. The talks were sure to be long and tedious.\n\nYet nobody came. The [ZLU.GetNameDef] diplomat sat in an empty meeting room, hooves nervously tapping the table, as he looked around for any sign of life. Eventually, a servant entered the room. The kirin mare blinked as she saw the zebra there, "Oh, hello, I'm sorry, I didn't know anyone was going to be here." He looked back at her and smiled weakly, "You needn't apologize. I'm here for the negotiations? Do you maybe have any idea when the [NVA.GetNameDef] dignitary and the Matriarch will show up?"\n\nThe maid mare blankly gawked at him, "Negotiations? Oh." She coughed softly into her hoof, "Right, umm, the Matriarch isn't here. Or any [NVA.GetNameDef] dignitary. They were here, but I think they went to the northern beaches to enjoy a day off. Apparently there wasn't anything in the schedule for today?" She paused, "Do you, umm, want me to notify them you're here?" The dignitary looked back at her for a minute, before softly shaking his head, "N-no, that's okay. Thank you. I'm afraid that's answer enough from the Matriarch. I... I'll be heading home, I suppose." With a shaky breath, he shot to his hooves and wiped his eyes. Resolutely he turned and left the room."
  formable_event.30.a:0 "To agreement!"
  formable_event.30.b:0 "How embarrassing..."
  formable_event.31.t:0 "A Letter Across The Sea"
  formable_event.31.d:0 "To The Proud [ROOT.GetAdjectiveCap]:\n\nWe, the zebras of [FROM.GetNameDef], have become a regional power in the jungles of the south-east. Around are enemies of all shapes and sizes. Scarlet and Vermillion banners threaten our borders every day, as they threatened your borders long ago. The Ancient Pact long existed as a power in the south, and though it has fallen, its memory need not die with it. Though we might not be as venerable or ancient a power as the Gargoyles, the ancient friends of Centaurs, we offer ourselves with an outstretched hoof, new friends to the Centaur realm. Even should we be rejected, we shall forever honor and respect the ancient name of Centaur honor. Thank you."
  formable_event.31.a:0 "To a new pact!"
  formable_event.31.b:0 "We stand alone."
  formable_event.32.t:0 "[FROM.GetNameDefCap]'s Response"
  formable_event.32.d_a:0 "To Honored [ROOT.GetNameDef]:\n\nYour forces have proven their strength in the east, taking the jungles for yourself. Many centaurs still remember the times of the Ancient Pact, our friends, the Gargoyles, who fought to the end alongside us. We have always been a species quick to befriend others, to make use of our unique talents, together. We are honored and pleased to make a new pact with the zebras of [ROOT.GetNameDef], for now, and forevermore."
  formable_event.32.d_b:0 "To [ROOT.GetNameDef]:\n\nIt is pleasing that you would try to choose us Centaurs as allies, as we are quite capable friends to have. Yet we have seen the effects of reliance on outsiders. The Gargoyles fell while we survived, and through that we learned that the Centaur spirit is not one to be chained down by agreements with others. Your people may still trade with us and we may be friends, but the land of [FROM.GetNameDef] lands live or die by our own hands, not by the hooves of anyone else."
  formable_event.32.a:0 "What a joy!"
  formable_event.32.b:0 "What a shame."
  formable_event.33.t:0 "The Road Home"
  formable_event.33.d:0 "In [ROOT.GetNameDef], a feeling has claimed the hearts of tens of thousands: The feeling of homesickness. Being so far from Griffonia, it took a while for us to hear about the downfall of the Empire into insanity, and it took even longer for the realization of our new reality to hit. The homeland is lost to madness, and the only news that comes from it are a few letters, ferried across hostile lands, telling tales of scared cousins and distant relatives sent to die against insane communists and autocratic ponies. The time has come for sanity to return to Griffonia, the time has come for [ROOT.GetNameDef] to make our way home. But the way will be rough, and we can only prevail with aid.\n\nThere are four paths back home and we need to be careful about which we pick. The [BAT.GetAdjectiveCap]s are mad in their own right, but they have existed for centuries in a stable state. They could be an ally we could rely upon, even if they might make things complicated after our homecoming. [CTH.GetNameDefCap] has a rich maritime history, with their fleets fending off those of Aris during the North Zebrican War. If we choose them, their ships will clear a path back home. The deer of [CTL.GetNamedef] are a powerful growing industrial force, they will provide us with plenty of guns and plenty of soldiers. The issue with these three, however, is that they are on the precipice of conflict with each other, it is likely that choosing them will bring us into their scuffles.\n\nThe final option is a more unpopular choice: [ABY.GetName]. They are a sane kingdom compared to most of the other choices, and they own a decent industrial base, and have a decent sized navy. Yet they are deeply unstable and might be preyed upon by their surrounding powers. Should they stabilize, they will be a partner to the end, but should they collapse, we will likely fall in turn. We must pray that whoever we send this letter to, they will agree."
  formable_event.33.a:0 "The stable Thestrals."
  formable_event.33.b:0 "The maritime [CTH.GetAdjectiveCap]s."
  formable_event.33.c:0 "The industrious [CTL.GetName]."
  formable_event.33.e:0 "The desperate [ABY.GetAdjectiveCap]s."
  formable_event.34.t:0 "The Southern Strategem"
  formable_event.34.d_a:0 "Earlier today, a vessel arrived from the distant [FROM.GetNameDef], filled to the brim with griffon and zebra dignitaries. They came bearing a letter to our leadership, filled with quite the tale. The griffons of [FROM.GetNameDef] have grown homesick and plan to make their way back to Griffonia to bring sanity back to the Empire and to try and restore some of what the world used to be. Given their distance from Griffonia, and their lack of power relative to the Empire, they have asked to join our alliance, promising to aid us in any conflicts, as long as we aid them in theirs.\n\n[FROM.GetNameDefCap] are rich in resources, and have been kept safe from the madness of the world, with a stable industrial base and population. Despite their distance, they would make for a great ally, their navy and their industry perhaps helping tip the scales in North Zebrica. Yet their plan to go to war against the Empire is also dangerous, it's likely that they could drag us into an unwinnable war if we did help them. Yet if we did win the war, we would have an ally in one of the most industrial parts of the world, grateful and prosperous. It's a complicated question, to take them on as a risk, or play it safe and say no."
  formable_event.34.d_b:0 "Earlier today, a vessel arrived from the distant [FROM.GetName], filled to the brim with griffon and zebra dignitaries. They came bearing a letter to our leadership, filled with quite the tale. The griffons of [FROM.GetNameDef] have grown homesick and plan to make their way back to Griffonia to bring sanity back to the Empire and to try and restore some of what the world used to be. Given their distance from Griffonia, and their lack of power relative to the Empire, they have asked to create an alliance with [ROOT.GetNameDef], promising to aid us in any conflicts, as long as we aid them in theirs.\n\n[FROM.GetNameDefCap] are rich in resources, and have been kept safe from the madness of the world, with a stable industrial base and population. Despite their distance, they would make for a great ally, their navy and their industry perhaps helping keep [FROM.GetAdjectiveCap] dominance in the west. Yet their plan to go to war against the Empire is also dangerous, it's likely that they could drag us into an unwinnable war if we did help them. Yet if we did win the war, we would have an ally in one of the most industrial parts of the world, grateful and prosperous. It's a complicated question, to take them on as a risk, or play it safe and say no."
  formable_event.34.a:0 "They are welcomed."
  formable_event.34.b:0 "An alliance is born."
  formable_event.34.c:0 "Turn the birds away."
  formable_event.35.t:0 "The First Step Home"
  formable_event.35.d_a:0 "Early in the morning, a ship filled with our dignitaries returned from distant lands, coming to dock and delivering a letter to our leadership. It would seem that despite our dreams and our smaller size, [FROM.GetNameDef] will accept our alliance. They will aid us in our return home, and in return, we will aid them in any conflicts they find themselves engaged in.\n\nOur captains have already begun to load our troop transports, ready to ferry griffons around the continent, to prepare for the next step in our path home, and to prepare to defend our newfound allies. Home seems closer than ever."
  formable_event.35.d_b:0 "When our dignitaries returned from [FROM.GetName], many feared the worst, that our one chance to go home would have been denied. Yet despite the distance between our nations, the smell of freshly brewed [FROM.GetAdjectiveCap] coffee on the ship, and the sight of [FROM.GetAdjectiveCap] dignitaries, proved our worries wrong. The rising power of West Zebrica will be our ally to the end of days, it would seem.\n\nAlready, celebrations fill the streets of our cities, the [FROM.GetAdjectiveCap] cats treated as heroes by our griffons. It seems that avians and felines will work together, our destinies tied together forevermore."
  formable_event.35.d_c:0 "Early in the morning, a ship filled with our dignitaries returned from distant lands, coming to dock and delivering a letter to our leadership. It would seem that due to our wild dreams and our smaller size, [FROM.GetNameDef] has rejected the idea of any alliance with us. The mad Empire that has claimed our homeland is a power too strong to be messed with, while the northern powers fight amongst themselves.\n\nDespair stalks our lands, and the hearts of all griffons are heavy. Home is further away than it ever has been."
  formable_event.35.d_d:0 "When our dignitaries returned from [FROM.GetName], many feared the worst, that our one chance to go home would have been denied. Yet despite the desperation of the [FROM.GetAdjectiveCap] state to maintain their power, they have rejected us as allies. Apparently, our plan to return home is too dangerous, and threatens the stability of their state. They sent a gift basket of coffee back with our dignitaries, but it tastes of bitter rejection.\n\nIt would seem avians and felines were never meant to be friends. Our dreams of home are to remain dreams alone."
  formable_event.35.a:0 "To our new allies!"
  formable_event.35.b:0 "To [FROM.GetName]!"
  formable_event.35.c:0 "I want to go back home..."
  formable_event.36.t:0 "Southern Demands"
  formable_event.36.d:0 "To the inhabitants of the islands of Haukland:\n\nMadness and insanity has seized the heart of all Griffons on the mainland, and Maar cackles in glee as he watches. Yet sanity still remains in the world. We, [FROM.GetNamedef], still remember the ways of a sane Empire, orderly and organized into its Duchies and Provinces. The time has come for this madness to end. We have aligned ourselves to the great powers of Zebrica, who will aid us on our return home, and the only obstacle that remains is your island nation.\n\nWe would ask kindly that you lay down your arms and join us willingly. Together, we can free the heart of the Griffons from the darkness that consumes it. Together, we can create a stable, safe, sane realm. However, should you say no to our offer, know that we will come anyway. There will be no obstacle between us and our home that we will not overcome. Deny us if you dare."
  formable_event.36.a:0 "Haukland will help bring us sanity."
  formable_event.36.b:0 "What are they going to do? Cross an ocean?"
  formable_event.37.t:0 "The Last Step Home"
  formable_event.37.d_a:0 "We have eagerly awaited with rifles in claw for response from the leaders of Haukland, pressing for a grand invasion of the islands, to prepare the way home. We already wrote marches and poems about the beauty of combat we will face on the way back home, how no amount of blood spilled is too much to see Griffonia once more.\n\nBut uhh, they agreed. They agreed to our demand and have given over the islands. Which is good! It would have been annoying and taken a lot of lives if we needed to land on the islands. But I won't lie, it's a bit disappointing, we were so ready to go to war. Oh well, we'll just need to rewrite the poems and the marches. Home awaits just over the horizon."
  formable_event.37.d_b:0 "We have eagerly awaited with rifles in claw for response from the leaders of Haukland, pressing for a grand invasion of the islands, to prepare the way home. We already wrote marches and poems about the beauty of combat we will face on the way back home, how no amount of blood spilled is too much to see Griffonia once more.\n\nUnfortunately but also luckily, all of our preparation won't go to waste. The owners of Haukland have denied our request, and already our soldiers march onto transports, preparing for a great invasion. Songs will be written about this day and blood will spill into the calm waters around the islands. Home awaits, and nobody is going to stop us from getting there. "
  formable_event.37.a:0 "Huh, that actually worked?"
  formable_event.38.b:0 "A shame. Guess we're gonna kill them."
  formable_event.38.t:0 "The Ides of Roam"
  formable_event.38.d_a:0 "Ave, [ROOT.GetLeader], Matriarch of Vermillion:\n\nOn behalf of the Senate of Roam, as acting representative of the Plebeians and Patricians, and all other members of the Roaman Republic, we make a simple request of the grand Matriarch of Vermillion, representative of the Kirin. In years past, when Roam was an oppressive Empire, our states clashed against one another. During the collapse of the eastern half of Roam, Kirin forces marched in and took control of the province known to the Kirin tongue as Zeblu. This rightful Roaman land has existed under Kirin control for years, and, I am sure, has been treated properly.\n\nOn behalf of Roam, I wish to extend our sincere forgiveness for the taking of this state. We do not blame the Kirin state for taking it from the oppressive grasp of the empire, however, the time has come to do what is right. The Roaman Republic is a better representative of the needs of the zebras in our former lands than the Kirin are, a claim which should be made obvious by your lack of stripes. One way or another, the banners of Legions shall rise over Zeblu again. For both of our sakes, take a peaceful route, and return it.\n\n-Vale, Consul Scorpio Zebricanus."
  formable_event.38.d_b:0 "Ave, Lost Governor of Zeblu.\n\nOn behalf of the Senate of Roam, as acting representative of the Plebeians and Patricians, and all other members of the Roaman Republic, we wish to make a simple request and a simple question. It would seem as if you, the Governor of Zeblu, believe that you are independent. This is a cute thought, belonging to the fantasy books of foals. It's time for this fantasy to end. The Republic awaits the return of its Lost Governor, but do not worry, you shall not be punished for your delusions of independence or importance in the world. The Senate might even decide to keep control of the province under your hooves, should you return to the Senate's control, of course.\n\nLegions are marching to your province currently to collect the taxes that have been forgotten to be paid over the years. If you should try to resist us, we would welcome it. Our Legions could always use training, and there's no better practice than killing buffoons. But, for your sake, it would be best to go with them willingly.\n\n-Vale, Consul Scorpio Zebricanus."
  formable_event.38.a:0 "Zeblu is not worth war."
  formable_event.38.b:0 "No blood will be spilt."
  formable_event.38.c:0 "How cute. Denied."
  formable_event.39.t:0 "On the Issue of Zeblu"
  formable_event.39.d_a:0 "To Consul Scorpio Zebricanus of Roam:\n\nThere is no need for conflict over the province of Zeblu. Your republic represents its citizens better than most would. We trust that you will do the same in Zeblu as you do elsewhere, and hope that the land will prosper under your Republic.\n\n-[FROM.GetLeader]."
  formable_event.39.d_b:0 "To Consul Scorpio Zebricanus of Roam:\n\nCome and take it. Your scarlet banners will blend well with the spilled blood of your Legionaries.\n\n-[FROM.GetLeader]"
  formable_event.39.a:0 "Ink written prevents blood spilled."
  formable_event.39.b:0 "Such arrogance. Crush them."
  formable_event.40.t:0 "Great Lakes Greetings"
  formable_event.40.d:0 "To Whomever It May Concern:\n\nGreetings, it has come to the attention of our glorious republic that you are a potential ally. Us in the Great Lakes are a force for stability in the world, just as your country is in your own region of the world. We live in a world that slowly grows more radical by the day, and we have witnessed the failures in Griffonia from failing alliances. In order for the voices of freedom and sanity to prevail, we must stand together. It is only as one force that we can halt the threats that encroach upon us, threats to freedom, and decency.\n\nThis is a humble invitation to our growing, great alliance of freedom and liberty. Stood side by side, we, together, can prevent the spread of madness, and protect the liberty of South and Central Zebrica. This is your one chance to be on the side of true liberty, as we know that all lovers of freedom would agree in a heartbeat to this offer. Should you, for some reason, not accept this glowing offer, then perhaps it would seem you are not a power for freedom and sanity in the South. We would both hate to see this come to be. Do the smart decision, join us."
  formable_event.40.a:0 "We stand together."
  formable_event.40.b:0 "We will not sell our army away."
  formable_event.41.t:0 "An Alliance Acquisition?"
  formable_event.41.d_a:0 "To Whom It May Concern:\n\nThe forces of darkness and insanity in Zebrica grow stronger by the day, we shall not sit idly by while these forces take us over. Though we may have disagreements on our systems of governance, these are respectful differences, not differences that would lead to us choosing death. When darkness comes for us, we will stand together, as one. We will be beacons of light and sanity, shining for all the world to admire.\n\nOur soldiers have much to learn from each other if we are to best fight alongside each other. We welcome any training instructors and any divisions sent towards us to be trained. When madness comes for us, we will stand together, and should we fall, then we will fall as one."
  formable_event.41.d_b:0 "To Whom It May Concern:\n\nDespite the flowery language contained within the letter sent to us, we fail to see any reason to join forces with your alliance. Zebrica might be growing darker by the day, but that will not be solved by this 'smiling imperialism'. We are under no pretenses that we will remain independent for long if we accepted this offer of alliance, it would just be the first step to annexation and integration. Zebrica has already seen the fate of empires overstepping their bounds, torn apart at the seams by the lovers of freedom all over. Do not overstep your bounds, zebras of the Great Lakes."
  formable_event.41.a:0 "Hooray! New friends!"
  formable_event.41.b:0 "Phooey."
  formable_event.42.t:0 "Smiling Imperialism"
  formable_event.42.d:0 "To Whomever It May Concern:\n\nGreetings, friends of the Great Lakes Zebras! We have served side by side in our wonderful alliance for a while, and we have learned much from each other, yet there have also been issues noticed. Our factories produce different guns, which our soldiers are confused by when they acquire them, creating mix-ups and confusion where stability and security should be instead. It would be best for our factories to be under one banner, to more efficiently produce for the benefit of us all! Additionally, we've noticed a few of your citizens going hungry due to the rather poor management of local leaders. Luckily, the Great Lakes is prime agricultural land, and we would gladly accept an offer to become local leaders and distribute what we can to the people! Another big issue has been conflicting orders, one country's leader saying to attack, another saying to defend, confusing soldiers. Due to this, we believe it best that our leaders become your leaders! It's best for our protection of the South, after all.\n\nWe do want to protect the South still, don't we? The forces of madness grow ever stronger, and in the end, is the happiness of our citizens not better than some idea of 'sovereignty'? We do so hope that you, our friends, will accept this offer with the same smiles we have when we write it. Together, we can form a power strong enough that nobody could ever oppose us! But, we feel compelled to be honest to you, our best friends. Should you reject this offer, there will be blood. So! Better that you accept it, huh?"
  formable_event.42.a:0 "Peace over sovereignty."
  formable_event.42.b:0 "Death before dishonor."
  formable_event.43.t:0 "Allied Acquisition?"
  formable_event.43.d_a:0 "To Whom It May Concern:\n\nThis annexation request is blatant imperialism, and a violation of everything our alliance stood for. Yet, dark clouds rise on the horizon, and the forces of darkness grow stronger by the day. You are an imperialist, but you are one at least dedicated to the betterment of the world. Our state will become part of yours, all we ask is that you better both of our populations. Do not let darkness consume you.\n\nDon't make us regret this."
  formable_event.43.d_b:0 "To The Commander of the Great Lakes Zebras:\n\nLet there be blood.\n\nSigned, [FROM.GetLeader]."
  formable_event.43.a:0 "Yippie!"
  formable_event.43.b:0 "There will be blood, shed."
  formable_event.44.t:0 "Maregyptian Mail"
  formable_event.44.d:0 "From The Venerable City of Somnambula, By The Hoof of Royal Scribe Hisandra:\n\nDark clouds gather on the horizons, and ill omens spread like plagues across the shifting sands and great cities of Maregypt. Tales from the north herald the encroaching conflict of Cultist and Autocrat, and whichsoever shall win, shall certainly set upon the rest of Zebrica like a Storm. To the west, the rising power of [ABY.GetNameDef] march upon the backs of slaves both zebra and pony, wishing to blot the west out under their control, to make the wise realms of the west their ball of yarn. Further, the words of a Prophet stir black fire in the hearts of Saddle Arabians, who make the earth bleed black gold to fuel their conquests. In the south, the almost forgotten fitful dream returns, riding on Storm Clouds, deigned to wreak vengeance upon those who survived their first conquest.\n\nThe days of Zebrica grow dark, and even in this city of Hope, we dare not be so ignorant to believe we can survive alone. Maregypt has always acted as a responsible force in Zebrica, bringing prosperity and Hope, Somnambula's last gift, in our wake. Our venerable realm survived for untold generations through isolation, yet the Storm King taught us to never forget the power of Friendship. It is with this lesson, and with a humble heart, that we ask the respectful leaders of the South; let us band together, and together, we shall weather the storm."
  formable_event.44.a:0 "We stand together."
  formable_event.44.b:0 "We don't need them."
  formable_event.45.t:0 "The Southern Response"
  formable_event.45.d_a:0 "To The Venerable Maregypt:\n\nThe Great Lakes and Maregypt have always had our fates tied together, after all, it is water running from the lakes that make the Neighile, which is the lifeblood of Maregypt. Many in our country would clamor to say no to your offer, due to being a monarchy and not a republican system. However, in our world, we need to not focus on what makes us different, but what makes us similar. We in the Great Lakes are a hopeful bunch, just like Maregypt is, and we have seen how Maregypt cares for its citizens. We would rather accept a monarchy like Maregypt as friends than a republic like far Stalliongrad.\n\nThreats knock at our door every day, the forces of darkness come to consume the last lights of sanity present in Zebrica. We are happy to accept our Maregyptian brethren in our stand against darkness. Welcome to the team!"
  formable_event.45.d_b:0 "To The Monarch of Maregypt:\n\nGreetings, northern ponies. We would like to make one thing clear within this message. You see, we are what's called a 'Republic'. You are what is called a 'Monarchy'. We have no desire to work alongside those who are so stupid that they still have a monarch leading them. Republics, democracy, and freedom are the way forward. You speak in your letter to us of the threat of autocrats, yet funnily enough, you're also an autocracy! You think you're different just because your monarch is nicer, but we enlightened republican folk shall have to politely disagree. We have no interest in any alliance with you. We will gladly accept refugees from your state whenever your realm is overrun by other autocrats, though!\n\nHope this helps!"
  formable_event.45.d_c:0 "To The Venerable Ruler of Maregypt:\n\nThe offer of alliance sent to us by courier contained many messages within which resonated with the ideals of [FROM.GetName]. After a small debate held amongst our highest ranking and wisest officials, we are pleased and honored to inform you that we will accept your offer of an alliance posthaste. In these troubled times, enemies are more plentiful than sand in the desert, and friends are worth their weight in gold. We hope both you and we will be pleased to know that, from this day on, we shall be friends, side by side. We either rise together, or we will both die together. "
  formable_event.45.d_d:0 "To The Venerable Ruler of Maregypt:\n\nThe states of Maregypt and [FROM.GetName] might be quite similar on the surface, but [FROM.GetName] wishes to not get tangled in any foreign affairs at this time. We look to the failed alliances of elsewhere, the dying freedom fighters of Griffonia, the [KIR.GetAdjectiveCap] protectorates who are fraying at the seams, and we hold no interest in seeing this slow and steady death come to us. We fight alone. We wish you all the best in your future endeavors."
  formable_event.45.a:0 "Hope burns on."
  formable_event.45.b:0 "Our hope dims."
  formable_event.45.c:0 "A spark of hope remains."
  formable_event.46.t:0 "Maretanian Mail"
  formable_event.46.d:0 "To The Venerable Ruler of Maregypt:\n\nGreetings from [FROM.GetName]. In this correspondence, we are pleased and honored to announce our decision to return Maregyptian land to the venerable state it belongs to. While many within our realm have decried this move, many more will cheer to know that they are back with the country they belong with. We hope you will find that we have taken good care of your citizens during their short stay under our rule, and we also wish to remind how rare such gestures of good faith would be these days. Many would simply keep whatever land they can get their greedy hooves and/or paws on, however, we wish to be friends with your state.\n\nWe have a request, separate to the return of this land. We wish to make clear that should you reject this request, it will not make us enemies, nor stop the transfer of the land. Reject or accept us, the land is rightfully yours, and we will still be friends on the world stage. However, the rising of the [EMR.GetNameDef] in the west poses a threat to us both. Faith fuels the madness of Saddle Arabia, and drives them to take all that they can from the rest of us. Should we stand idly by and allow this threat to rise, then we shall burn in the flames it creates, together or apart. Together, we have a chance to stop them before they destroy us all. We hope you accept our offer. For the good of all of us."
  formable_event.46.a:0 "[FROM.GetName] and [ROOT.GetName] stand together!"
  formable_event.46.b:0 "[ROOT.GetName] stands alone."
  formable_event.47.t:0 "[FROM.GetName]'s Response"
  formable_event.47.d_a:0 "From The Venerable City of Somnambula, By The Hoof of Royal Scribe Hisandra:\n\nLast night, in the city of Somnambula, we heard the children cry, weeping with joy at being reunited with their lost family. For once, Hope lived in their hearts, which has long been gone. The leaders of Maregypt read your letter, and thought about it overnight, where terrible visions haunted our dreams. We saw the fall of our country, bleached bones under a harsh sun, Maregypt, gone. War will come, we are sure of it, and should it come, we fear these visions, these dreams, shall not be false. Not many would be so kind as the Maretanian state has been, and for this, we are grateful.\n\nThe only way to survive is together, Maregypt and Maretania, stood side by side against the horrors that extend beyond our borders. We are the envy of the lesser realms, of the Caliphates and Storm Kingdoms, that is why they must resort to lies to their people to bring them to war. These lies, this envy, shall soon march upon us. Know that when they arrive, Maretanians, we will be there alongside you. Tonight, we believe the children shall sleep soundly, knowing we have friends in the world."
  formable_event.47.d_b:0 "From The Venerable City of Somnambula, By The Hoof of Royal Scribe Hisandra:\n\nLast night, in the city of Somnambula, we heard the children cry, weeping with joy at being reunited with their lost family. For once, Hope lived in their hearts, which has long been gone. The leaders of Maregypt read your letter, and thought about it over night, where terrible visions haunted our dreams. We saw the fall of our country, bleached bones under a harsh sun, Maregypt, gone. War will come, we are sure of it, and should it come, we fear these visions, these dreams, shall not be false. Not many would be so kind as the Maretanian state has been, and for this, we are grateful.\n\nYet standing together will not save us from the darkness coming, it will only paint a bigger target on our back. The Caliphate is nothing new in Zebrica, and Maregypt has lived through such times before, through our respectfulness, our veneration. War will come if we continue down the path of war, that is what our visions have meant, and we would advise the Maretanians to take heed. Together, we are a threat that will be crushed by well-meaning ponies, but apart, we will not threaten any. We apologize for not agreeing to this alliance after such kindness, but stability and safety must prevail. We believe the children will sleep soundly tonight, knowing only peace lays on the road ahead."
  formable_event.47.a:0 "It's good to have friends."
  formable_event.47.b:0 "Now I wish we hadn't given them that land."
  formable_event.48.t:0 "Home's Calling"
  formable_event.48.d:0 "Ciao, amici!\n\nIt has been many years since our brave Wingbardian Fascista forces helped create your state, though the North Zebrican War is such a joyous memory that it always seems to be close. The blood of many good fascists died to secure the security, the stability, that the state of Winggarden so enjoys. Looking at the rest of the Hippogriff lands, well, one must be quite happy about that! Now, we know that the citizens of Winggarden are strong and proud, true fascists at heart, and would never wish to bow to the scuffling Chiropterra or Colthage. Yet stay alone, friends, and Winggarden, no matter how strong, shall fall to Aris once more. Would you truly wish to fall under the perfidious Reds, or, worse, the simpering harmonists?\n\nThe time has come for Wingbardy to reclaim its place in the sun, friends. The perfidious, weak, simpering Reds that backstabbed us at the height of our strength are weak, and together, we can show them the strength of fascists! We will give you much autonomy, all we ask is that you allow our administration to take control of yours. Together, we shall soar like the greatest eagles, together, we shall be the true powers of the world! We eagerly await your response, we've made lots of spaghetti for the celebrations."
  formable_event.48.a:0 "Spaghetti? We have to say yes!"
  formable_event.48.b:0 "This reeks of desperation."
  formable_event.49.t:0 "Winggarden Speaks"
  formable_event.49.d_a:0 "Dear Giulio Beakolini:\n\nCiao to our friend across the sea. Winggarden still remembers the North Zebrican War, and over the years, it has been the voice of the Wingbardian on this council which have led us straight. For years, the Chiropterrans and Colthagians have argued between us joining one or the other, never able to get enough votes for either. Quite luckily, enough were able to join the Wingbardian representatives that we were able to approve the motion to join Wingbardy. I know, Il Duce Beakolini, that you are a wise, and strong, leader. You will lead us to greater heights, to safety and stability.\n\nHowever, of course, Winggarden is a city that respects its independence. Even if, in the fascist ideal, we serve the state, we will also expect rewards equal to what we can give. Once Karthin has returned to the proper claws, out of the hooves of the weak Reds, we will need to meet to discuss privileges for our free, fascist city. Oh, also, we will be sending many delegates across the ocean to visit you, we hope you made enough spaghetti. The Winggarden restaurants can never recreate the authentic taste."
  formable_event.49.d_b:0 "Dear Giulio Beakolini:\n\nDespite your demands for Winggarden to join your state, we have no interest in losers. It is true that your fascist blood was spilled for our independence, and indeed, if you try to invade us, even more will be spilled to preserve it. You would have a better chance praying to Eyr for salvation than of convincing us, seeing what you've been reduced to. A bunch of elderly griffons dreaming of youth in black shirts, marooned on an island with nothing but dreams of grandeur and shitty food. You held the entire south of Griffonia in your claws, and despite that, you managed to lose to a bunch of psychotic communists who can't even speak properly.\n\nTake your offered spaghetti and shove it up your ass, maybe it'll taste better that way, given it already tastes like shit. Everyone knows that Colthage couscous is the superior way to deliver flavor compared to pasta, this is a simple truth of the world. Ah, but I forget, fascists like you love to ignore the truth when it's inconvenient. I've attached a small parcel of money to this letter, courtesy of the Colthage delegates of Winggarden, with a simple message. Go buy some hair dye so you can look as young as you wish you were, geezer."
  formable_event.49.a:0 "Il Duce's plans never fail!"
  formable_event.49.b:0 "Il Duce's plans NEVER fail!"
  formable_event.50.t:0 "Giulio Grovels"
  formable_event.50.d:0 "Ciao, amici!\n\nI, Il Duce Giulio Beakolini, leader of the glorious and grand state of Wingbardy, come with a proposal to the fair state of Colthage. I still remember long ago when our ships worked together to sink the greatest Hippogriff ships, I remember our factories working in tandem together. The fascist spirit of strength, and the Colthage spirit of prosperity, truly, it was an arrangement that never should have ended. We wish for your help in reclaiming Karthin from the Red menace, and in return, we promise to help you in all foreign matters.\n\nOf course, the venerable Colthage state has been struggling against their enemies, the perfidious bat-pony. They are enemies of the fascist too, you see. They are obsessed with a cult of tradition, instead of the fascist revolutionary traditionalism. They also have one big thing over zebras, they can fly, and wouldn't you know, us griffons can also fly! We are a match made by the gods. Come, Colthage, we extend our claw, give us your hoof. Let Karthin and Colthage move into the future again, as one. We have prepared many pizzas for the celebrations approaching, we would hate to not be able to share them with new allies. They're three meat, very expensive!"
  formable_event.50.a:0 "Three meat pizzas? We have to accept!"
  formable_event.50.b:0 "Three meat pizzas? They know zebras can't eat meat, right?"
  formable_event.51.t:0 "Colthage Corresponds"
  formable_event.51.d_a:0 "Beakolini:\n\nColthage and Karthin have had many disagreements in the past, this much is certain. Many educated zebras are still angry about the sacking of Colthage in 490 by Karthinian forces. We lost much gold, and many historical artifacts, due to that sacking. However, despite the shared names and symbols, it is clear Wingbardy is not the Karthin of old. Many industrialists remember fondly the days where we worked alongside your griffons, your industrial experience guiding Colthage to become one of the greatest powers in Zebrica. Even still, many refugees from the Marelandian conquest live in our cities, being some of our most hardworking citizens.\n\nIt's time for peace to return to the seas between our fair nations. With Karthinian steel and Colthagian blood, we can drive back the insane bats of the west, and the insane communists of the north. We will help you rebuild the factories and feed the griffons left behind by the communists, though we will respect fair payment in return. Just know one thing, Colthage will not bow to Karthinia ever again. We will move forward into the future, together, as partners."
  formable_event.51.d_b:0 "Giulio:\n\nWe haven't forgotten 490. If you fascists are truly so strong, then go reclaim your land yourself. Until then, enjoy being the laughingstock of Colthage. Pray you die of old age, elder, before you see Colthage ships on your shores."
  formable_event.51.a:0 "Il Duce's plans never fail!"
  formable_event.51.b:0 "Il Duce's plans never FAIL!"
  formable_event.52.t:0 "Sen-t Request"
  formable_event.52.d:0 "To the most humble and harmonic Matriarch of Vermillion:\n\nTensions grow in the south, glorious Matriarch, and the borders of [NVA.GetNameDef] seem to grow more dangerous by the day. The barbarians beyond the border of our harmonious realm seem to be going to brutal wars with each other every day, and though thousands may die, their blood creates danger in its wake. Whispers of a reunification of Roam grace the ears of border guards, and raids from barbarians have spilled good kirin blood. Our factories work overtime to keep our harmony from the savage South's influence, yet despite the hard work of our most glorious workers, not a day passes where a soldier does not die due to a lack of equipment.\n\nI know this request might be beyond my station, my Matriarch, but I must request it anyway, for the good of the realm. Zaikiria has prospered under Vermillion for years, under your glorious and humble gaze, and it is a land rich in materials, industry, and loyal kirin. We must request for the good of all harmony in Zebrica that this land be given to us, that these factories and these kirin might protect all that we hold dear. We do not mean to sound greedy, yet by the day, we hear reports of soldiers turning to nirik out of desperation. As all kirin know, even a single spark could create a fire that will consume all. We wish not for this to be a spark that will consume our beloved Matriarch. With this request fulfilled, we hope to quench this spark, before it becomes a danger. I hope you may grace all by accepting this request.\n\nLong may fortune bless you."
  formable_event.52.a:0 "Give them the land."
  formable_event.52.b:0 "Their greed is unbecoming."
  formable_event.53.t:0 "Vermillion's Decree"
  formable_event.53.d_a:0 "To [NVA.GetNameDef]:\n\nLong has Zaikiria fought as warriors of harmony, it is only right that we grant a reward for long years of service. The winds may blow across Zebrica into cyclone and monsoon, yet we siblings shall survive the storm, together we have all the warmth we need. The lands of Zaikiria will be transferred into your control for the betterment of all. Long may our harmony survive.\n\nNever forget the danger of a spark, nor of fire. An errant spark burns the forest as well as the bonfire. The rejected colt shall burn his home just to feel its warmth. Hopefully, this is warmth enough. We shall never forget our southern siblings. "
  formable_event.53.d_b:0 "To [NVA.GetNameDef]:\n\nDo not forget your place. Your greed is unbecoming.\n\nGreen is not your color."
  formable_event.53.a:0 "The Matriarch is most generous!"
  formable_event.53.b:0 "The audacity!"
  formable_event.54.t:0 "The Fire Arises"
  formable_event.54.d_a:0 ""Gentlekirin, I would like to refer your attention to these graphs I paid someone else to put together." An industrialist slid a graph into the center of a table, the eyes of [NVA.GetNameDef]'s leadership looking it over. He grinned, "Those idiots in Vermillion have been mismanaging the industry here so much. We retooled this factory to making guns. Before, it was making toasters. Toasters! Ha!" An industrialist mare frowned, shifting in her seat, "Toasters are valuable to civilians, toast is a common food for the breakfast, and the breakfast is the most valuable meal of the day."\n\nHe snorted in response, "Oh yes, we, the Kirin, need toasters to make toast. Need I remind the Kirin in this room of our other side? If we wish to make toast, all we need to do is get a bit angry!" The mare frowned more and leaned forward, "And risk burning down an entire town in the process? We keep our other sides suppressed for a reason. I would rather factories produce toasters than coffins and urns." He smirked, looking at her, "And it is voices like yours which have brought us to such shame. The Roamans do not shy away from using their species traits. They make potions and due to that, made an empire better than us Kirin ever have, one of efficiency. How much waste will cause our death? How long until the deer march from the north? How long until Roam is knocking at our walls again? I'm sure they'll be happy we made toasters instead of anything worthwhile!" The mare bristled, the ends of her mane sparking.\n\nThe stallion continued on, unfettered, eyes locked with the leader, "How long until Reds infiltrate our factories? Then we will have both Nirik and useless factories to deal with. You shy away from our true power because you are afraid, like the useless feckless cowards in Vermillion. That's why they rely on us southern Kirin to spill our blood, because they're too useless to do it themselves! We shouldn't have to stand for this!" The mare sits up, "Vermillion have been our generous overlord, we must not betray them, no matter what this fool thinks." The leader glanced between them in silence. There was a decision to be made."
  formable_event.54.d_b:0 "Chaos reigned in [NVA.GetNameDef]. The barbarians did not knock on the gates, and yet the capital burned anyway. Soldiers and police rushed around, rifles fired intermittently across the city, as protestors threw themselves into buildings, bodies swathed in fire and rage. Shouts and anger filled the air, as did sirens, firekirin scrambling to keep what little peace remained.\n\nThe sight was almost beautiful from atop the capitol. The yellow and orange flickering flames mixed with the wind, a smoke show arose, and it made clouds more beautiful than any pegasus could hope. Clouds of smothering death flowed east, where soon the Vermillion kirin would choke on their mistakes. Their letter caused this. Three sentences. To think three sentences alone could cause this uproar. We were loyal for years, we were respectful, and humble in our request. Yet we were spurned. Three sentences. How many will die over three sentences?\n\nEyes closed, a fire of rage building inside."
  formable_event.54.a:0 "It was all part of the plan..."
  formable_event.54.b:0 "They must suffer for their insolence!"
  formable_event.54.c:0 "We must stand strong..."
  formable_event.55.t:0 "A Kind Request"
  formable_event.55.d:0 "Good Morning, Evening, or Night.\n\nYears ago, [FROM.GetNameDef] was subject to a great humiliation by the Changelings, of this, we both know. We, both Crystal and Red, have seen the horrors of war, what they've done to our friends in the north, and our friends in the south. War has brought nothing but madness and pain in its wake. It was during this time of madness and pain that we in [FROM.GetNameDef] so fondly recall red banners being raised in the eastern half of our country, an opportunity taken so elegantly by the workers aided by Stalliongrad at the time the Empire was weakest. We also fondly recall refugees, fleeing political persecution, telling tales of the new Red menace to our east. We here in [FROM.GetNameDef] are willing to key bygones be bygones, and bad memories left behind, water under the proverbial bridge.\n\nYet if we are expected to be so kind as to forgive the actions of our eastern citizens, we would kindly request kindness in return, namely, in the form of the return of our eastern lands. We understand the need for a global revolution in Mark's literature, and we will not harshly judge any who betrayed the Empire, like we said, water under the bridge. Return the land taken, and [FROM.GetNameDef] will gladly become friends with our eastern neighbors. However, if this request should be denied, do keep in mind the horrors that it will bring to us both. Many lives will be lost and blood will be shed, madness and pain will be the rule of the north once more, and the Red dream will be smothered in its cradle. We in [FROM.GetNameDef] hope that this event will not come to pass. However, we do feel the need to mention that Princess Luna, our humble guest, has been happily sharpening her blades for the necks of those who might cause war. It is all of our hopes that you are not the ones who cause said war. Return our lands, let friendship be the rule of the day. Elsewise, well, don't say we didn't warn you.\n\n-Sir Quilliam, Royal Scribe of [FROM.GetNameDef]."
  formable_event.55.a:0 "It's time for peace."
  formable_event.55.b:0 "The Revolution will not be curtailed."
  formable_event.56.t:0 "The Red Response"
  formable_event.56.d_a:0 "Good Day.\n\nLeaders of [ROOT.GetNameDef], it is with the hope and light of friendship in our hearts that we wish to announce the release of the eastern Crystal Workers, who shall return to join their comrades in the Empire. Your message of hope and forgetting past misdeeds is one that has resonated deeply in the hearts of many workers in our country, and in the minds of our leaders. War has brought too much destruction to our lands already, in war, only the proletariat dies, and the bourgeois profit, this, we can not see happen again.\n\nMarks wrote in 'The Civil War in the Griffonian Empire' about the inherent injustice that exists within the monarchical system. Indeed, the idea that there are ponies made special by their birth is a laughable idea to the modern worker. Yet Marks' work is a breathing and living work, not written in stone like ancient religious tablets. She did not know the horrors that we now know as fascism and supremacism, spread so willfully by the Changelings of the west. Monarchy might be laughable to the Communist, but we would rather laugh, than scream as we die under changeling tank treads. Though one day, we would wish to see your state fall to a worker's democracy, we must give conditional support, and friendship, to [ROOT.GetNameDef]. Along with this letter will be the finest bottle of vodka I could afford, I would hope to share it with you some day, where we may discuss the writings of Marks and how they could help the Empire in their fight against the Changeling menace. I bid you a good day, on behalf of all the workers of the world.\n\n-Secretary Typewriter, Secretary of Communications."
  formable_event.56.d_b:0 "Good Day.\n\nLeaders of [ROOT.GetNameDef], just yesterday your poorly disguised ultimatum was read in front of all of the worker's representatives. Upon finishing your overly eloquent diatribe hiding barely concealed threats, we would like to issue one back to you. Marks writes in 'The Civil War in the Griffonian Empire' about the laughable idea of monarchy, the idea that some pony is more special than another merely due to their birth. If you believe the revolution is so weak that we would bow to work with monarchists, then you will be sorely mistaken. The workers of [ROOT.GetNameDef] will be freed should you take a single step over our border.\n\nYou implied in your letter that you would attack should we reject your ultimatum, and I wish to say in no uncertain terms, we reject. We invite [ROOT.GetNameDef] to attack at their earliest convenience, to hit us with your best shot. You will find the Revolution is stronger than any force you monarchist scum could dream of. Attached to this letter is a bottle of cheap vodka. Tell your Princesses to save it for when our tanks roll through your city. It'll ease the pain of their death.\n\n-Secretary Typewriter, Secretary of Communications."
  formable_event.56.a:0 "Friendship wins the day!"
  formable_event.56.b:0 "Red scum..."
  formable_event.57.t:0 "REPORT: GOSSAMER HILLS"
  formable_event.57.d:0 "VOPS - TOP SECRET REPORT. READ AT PENALTY OF IMMEDIATE SUMMARY EXECUTION.\n\nFOR ROYAL EYES ONLY: The TREATY OF GOSSOMER HILLS, established with the CRYSTAL EMPIRE during the GREAT WAR, established a de-militarized and resource extraction zone in the CRYSTAL EMPIRE. Despite YOUR MAJESTY'S mercy in this treaty, the perfidious CRYSTAL EMPIRE has BROKEN the treaty. Soldiers of the CRYSTAL EMPIRE have marched into the de-militarized and resource extraction zone, a flagrant violation of the TREATY OF GOSSOMER HILLS. Such perfidy must not go unpunished.\n\nThe HEER stands at the ready to crush the perfidious CRYSTAL EMPIRE at your command, YOUR MAJESTY. However, many within the HEER are protesting due to feeling unready for a new conflict. TEN GENERALS and FIFTY COMMISSIONED OFFICERS have spearheaded their protest efforts, names included in REPORT AUXILIARY INFORMATION ONE, and they have garnered the attention of many within the HEER. These neighsayers know nothing next to YOUR MAJESTY. The VOPS humbly await your command, YOUR MAJESTY.\n\n-AGENT CHITTER, VOPS."
  formable_event.57.a:0 "They want war? They've got it!"
  formable_event.57.b:0 "The Heer is right, this time..."
