  ###Characters#### 
  BAL_cobalt_hoof_name:0 "Cobalt Hoof"
  #POLITICS_COBALT_DESC:0 "§YBorn§!: 26th of March, 983 in Baltimare\n\n§YBiography§!: The First-Citizen and Party-Governor of the South-Eastern Governorate, Cobalt Hoof has made a name for himself as the Guardian of the Revolution, and the spawn of all good in the region. Despite this, not much is truly known about his past. \n\nBecoming the Minister of Infrastructure upon the victory of the Governorate against the Solar Empire, he'd become a leading figure in the revolution against the Marksists in 1025. \nDeclaring himself the leader of the new revolutionary government, he began the purging of traitors, transforming the country into a Brutalist Utopia where all are truly equal, and foreign invaders dare not to trample the people. \n\nFor the Freedom to Love Cobalt is Absolute. \nThe Freedom to Laugh at the Enemy is Absolute. \nThe Freedom to Serve is Absolute. \n\n§YPortrait By§!: cotton-art"
  POLITICS_COBALT_DESC:0 "§YBorn:§! 26th of March, 983 ALB in Baltimare\n\n§YBiography:§! For a pony so notorious and one prone to delusions of grandeur, the life of Cobalt Hoof is both largely unknown and unlikely to ever be gleaned. Although professing to be only an everystallion, just like the citizens of his domain, he has clung to the power of his South-Eastern Governorate since his rise in 1025. To his ponies, he is the source of all that is good, all that is pure, and all that is innocent within the Governorate, as he is their source of life, liberty, and love. He is their guardian and protector. He is the hero of the Revolution.\n\nBefore coming onto the scene shortly after the combined communist forces of the South-East's victory against the Solar Empire, Cobalt's life has remained almost completely devoid of explanation. He held no positions in any of the cliques of socialist groups, nor did he have any connections with the council members of the time. Yet his skill with rebuilding Baltimare and heavily increasing its efficiency earned him his position as the Minister of Infrastructure within only a few short months. During this time, he frequently talked about his love of development, how he spent his younger years constructing model trains and intricately designing the cleanest routes in his imagination. Other times he'd wax nostalgic on his love of cars, or other times, shipping, all with the same anecdote of his appreciation of the rigid standards of urban planning.\n\nIn the background, though, deals and bribes were being exchanged thanks to his access to the funding MARESOC initially provided for rebuilding the South-East when Stalliongrad abandoned them. Although there was slow buildup, with a strategic death here or an arranged accident there, the rest of the council was summarily rounded up and executed in a single night. Afterward, Cobalt declared himself the sole leader of his Governorate. All his powerful supporters eventually were exposed as false adherents to COBSOC, his brand of MARESOC-like thought, leaving him as the only voice of command across the nation. In this manner, he has ruled for over twenty years, but his public appearances have been becoming scarcer, and his laws more frequently enforced by trusted third parties.\n\nHowever, that rule is still absolute. Utopia is achieved in its brutal development. Everypony is equal. Equal to serve absolutely.\n\n§YPortrait by:§! cotton-art"
