  ###Ideas###
  BAL_no_recognition:0 "International Isolation"
  BAL_no_recognition_desc:0 "Ever since 1041 when Marelandia withdrew their support, the Governorate has lacked recognition from any existing nation, resulting in its absence on most maps. \nNo diplomats arrive or depart, and traders are few and far between, forcing the country to try and rely on its own resources, much to no avail."
  BAL_red_glory:0 "Red Glory"
  BAL_red_glory_desc:0 "Upon the ashes of Tenochtitlan arose Red Glory.\nA pure example of the First Citizen's desire for Brutalism, its many complexes and skyscrapers portray a grand manifestation of concrete and glass, with much of the old demolished for the new. \nA sign of the glorious future, it has become the cultural staple of the Governorate, even if it has failed to pacify the tribes."
  BAL_imminent_war:0 "Imminent Collapse"
  BAL_imminent_war_desc:0 "The South-Eastern Governorate from its very inception has had little stability. \nFollowing the disastrous Anti-Insurgency Campaign, the country sees itself on the brink of collapse between various factions. \n\nTo the south lies the National Redemption Front, a militia of former Equestrian Military Remnants dedicated to opposing MARESOC and re-establishing Equestria under a Constitutional Monarchy. \nA thorn in the government's side for decades, its recent offensives have forced the government out of much of the jungle.\nPirates on the coast roam free, and camp revolts across the sea have become worryingly frequent. \nTo make matters worse the Neighua and Thestral populations have begun to fight each other once more, with the New Baltimare government powerless to stop them. \n\nCombined with a devastated economy, failing military, and increasing dissidence from within the party itself, if the situation is not stabilized immediately §Ra complete collapse is inevitable.§!"
  BAL_party_conflict:0 "Party Conflict"
  BAL_party_conflict_desc:0 "The Inner Party from an outside perspective may seem unified, but this couldn't be further from the case. \n\nCobalt's position as Party-Governor is threatened by the 'Contender', who sees Marelandia's polticies to be too moderate for survival, and that individuality must be abolished for true equality. \nAnti-Marelandian Opposition is itself beginning to become rampant, with the so-called 'New Reds' arguing that the purge of Marksists is what brought the country to near-collapse, and that a counter-purge is necessary for its continued existence. \n\nTo purge either side would result in the party's complete collapse, so Cobalt must play his cards carefully to ensure his eventual death does not cause the §Rcountry's disintergration.§!"
  BAL_collapsed_economy:0 "Devastated Economy"
  BAL_collapsed_economy_desc:0 "The economy is in a state of near constant collapse due to serious mismanagement by the government. If action is not taken to revitalize the industrial sector the country risks being far too weak to withstand the hordes of the [3.Owner.GetName]."
  BAL_collapsed_economy_1:0 "Devastated Economy"
  BAL_collapsed_economy_1_desc:0 "The economy is in a state of near constant collapse due to serious mismanagement by the government. If action is not taken to revitalize the industrial sector the country risks being far too weak to withstand the hordes of the [3.Owner.GetName]."
  BAL_buggy_trade:0 "STT Treaty Member"
  BAL_buggy_trade_desc:0 "As a consequence of accepting the treaty offered by a group of one of [BUG.GetNameDef]'s largest trade companies, we have agreed to lease out Yukka Island to the bugs. This port has been used to expand their trade influence into Zebrica, but in turn has helped stave off bankrupty.\n\nIt'd be nice to have that island back, though."

  ###EVENTS###
  southeast.1.t:0 "Everything is on Fire"
  southeast.1.d:0 "Nobody truly remembered the days of the Great Revolution. After all, it was something he had made sure of. \nYet Cobalt had held onto his memories, despite the haziness developing around them: a revolution against the tyranny of Celestia, corrupted by the vile Stallionists who knew nothing of strategy nor of governance. \nIt was they who had launched the failed assault on Baltimare, they who forced us into the jungles! Yet we, like angels from the sky, lifted the revolution from its lowest point, and brought it to victory!\n\nYet his dream had been ruined.\nLooking upon the large swaths of grey from the balcony of the towering Governmental Complex, Cobalt had been left wondering what exactly went wrong.\nNew Baltimare was the Brutalist Utopia of his dreams, yet its beautiful sights were not enough to calm his worries.\nHe was no idiot: ever since the treacherous Marelandians refused support, the country had been struggling.\nIf it had only impacted the proles, there’d be no cause for concern, yet whispers from even the Inner Party were becoming ever apparent. The constant insurgencies didn’t help alleviate a thing, and he had his hoof forced to sell Yukka to the pathetic changelings.\n\nBut what would wallowing in sorrow do for the party?\nMoving himself away from the balcony, the stallion marched steadfast towards his quarters with determination he had not experienced in a long time.\nNo matter what the traitors wished, no matter what the insurgents fought for, no matter the constant headaches, Cobalt swore to bring the South-East back to its former glory.\n\nTo bring COBSOC back to its rightful place."
  southeast.1.a:0 "''...I swear my life on it.''"
  southeast.2.t:0 "A Talk with the Rosy Mayor"
  southeast.2.d:0 "The telephone was an amazing invention, pioneered by the First Citizen himself.\nAn instrument upon which the sounds of those miles apart could be conveyed through a simple device, why, it was simply genius!\nOf course, it came with certain...consequences.\n\n''All I am saying, First Citizen, is that you simply cannot ask me kindly. If you expect respect, you must respect me!''\n''You are a valued part of the Inner Party, of course we respect you. We simply cannot divert more funds to your proj-''\n''Yet you can divert funds towards your own! We were once the bastion of stability, we once had the most prosperous economy in the South East, yet your regime fucked us all over! If you seriously think that I, Lucky Star, will simply shut my opinions up because you asked kindly, you’ve got another thing coming!''\nLetting off a deep, prolonged sigh, Cobalt slowly put the handset back in its holding position, collapsing onto his chair.\n\nLucky Star had always been difficult to walk with, yet never were they truly this bad. \nIf he had the power to, he’d make sure the so-called “Rosy Mayor” was ten hooves under, yet every attempt to take their life resulted in complete failure.\nEverything in this country did.\nNo matter how hard Cobalt had tried, everything failed. He’d succeed in the end, it was the only way things could go, yet at times he couldn’t help but wish he could strangle the traitors himself.\n\nThe telephone would do, though."
  southeast.2.a:0 ""Please clean up the broken glass, Second Citizen.""
  southeast.3.t:0 "INCOMING SITUATIONAL REPORT"
  southeast.3.d:0 "DATE FILED: [?global.date.GetDateStringNoHour]                                             FILED BY: F.G LAST RAY\n\nDESCRIPTION:\nInsert Report about operations going better than in the past. That's not saying much. "
  southeast.3.a:0 "We...should probably redact this."
  southeast.4.t:0 "Death of the First Citizen"
  southeast.4.d:0 "At the break of dawn today, [GetDateText], the entirety of [ROOT.GetNameDef] was required to attend state funerals from New Baltimare to Red Glory to Stableside, as news of the First Citizen's, Cobalt Hoof's, death was released to the masses. In New Baltimare, the largest of the commemorations of his brilliant life was held, lasting from sunrise to sunset, and well into the night, as testimonials from other party members and entirely random ponies were given on how he touched their lives. Such radical inventions as the hayburger and the cure for all forms of cancer are merely two of the many achievements of the First Citizen among his equals.\n\nUltimately, the memorial in New Baltimare had to be broken up by the Red Guard as further citizens attempted to storm the stage, where Cobalt Hoof's preserved body was held in an open casket, wishing to hug or kiss their beloved First Citizen one last time. Claims that many were forced first to go on stage to testify to his greatness and to genuflect a final time have been thoroughly debunked as Solarist propaganda.\n\nHowever, behind the scenes, what has not been shared is that Cobalt Hoof had outlined plan of succession, despite his growing health issues. As he was prone to excessive smoking and drinking in these last few years, it was surely an inevitability, but even still, his dead body was not found for three days, after a stench was reported in his manor and the cleaning staff finally dared to enter his quarters. Many of his closest advisors were called before attempting, in vain, to revive him, despite the clear rigor mortis that had set in.\n\nFor the moment, Steel Frame, Cobalt Hoof's protege and de facto successor, has taken control of the Party and has promised a smooth transition. Already, history books are adjusting to the new reality of his accomplishments in our war of freedom against the Solar Empire, but Cobalt will forever be a shadow over him.\n\nIt remains to be seen how the regions of the Governorate will react to the new Big Brother."
  southeast.4.a:0 "A true visionary has left us."
  southeast.5.t:0 "Withdrawing the Hoof"
  southeast.5.d:0 "Since the death of Cobalt Hoof, Steel Frame has done what he could to keep the Governorate stable. While Cobalt was able to keep the disparate cultures and groups within the peninsula kowtowed and pacified, through either force or negotiation, Steel Frame has yet to earn any of that trust or fear. Across the Governorate, regions have reported heightened activity of different political groups. The Neighua have grown unruly, and a few skirmishes between them and the thestrals in the interior have led to dozens of citizens' deaths and hundreds of arrests, who have been sent off to the prisons of the Dragon Isles.\n\nA group known as the National Redemption Pact, a thorn in Cobalt's side for decades, has destroyed a number of high value depots used by the Red Guard. Additionally, activity along the coast indicates that various pirate groups that prey on the shipping traffic from Zebrica to [NID.GetNameDef] has increased with the disarray of the Red Navy.\n\nWhile Steel Frame is doing all that he can to keep the Governorate together, it is beginning to collapse from the edges inward. Behind closed doors, some of Cobalt's circle, including himself, have floated the scenario of a complete collapse, and how to stave off the worst effects of it. This will never be admitted to the citizenry, but preparing for the imminent implosion seems like the only possible option for our new First Citizen."
  southeast.5.a:0 "He can fix it, can't he?"
  southeast.6.t:0 "Raising the Banners"
  southeast.6.d:0 ""...and in other news, production of horseshoes is up five hundred percent compared to last month. First Citizen Steel Frame has promised that despite the claims of unrest in the interior from Solarist sources frightening our citizens, they have pulled together to..."\n\nRusty Key folded his ears back as he tuned out the droning voice of the announcer, spouting off more numbers and promises from Steel Frame. Scratching at the back of his neck and wincing as the scabby skin on it peeled off from the friction. He huffed as he pulled his forehoof back and glanced at the blood and felt it trickle down to the crook of his back.\n\nHe glanced aside. Out, through the window of his guard station, he observed the mist and haze spewed forth by the pits that had at one time been used by dragons to bathe or simply "chill out," as he'd been told. Not that he'd ever seen a dragon, as when he received his station in Dragonclaw, they'd already been driven away by Cobalt Hoof. As the thought of the REAL First Citizen personally beating to a pulp an adult dragon shot through his mind, he exhaled tiredly and rose to his hooves.\n\nGripping his rifle, he peered down below at the scars in the earth, revealing how the remaining pits had been used as a makeshift moat. Despite being behind glass and easily a hundred feet down, searing heat radiated against his face and the rippling, snarling lava popped and belched pockets of steam that drifted above the concrete bridge leading to the prison's entrance.\n\nFor a moment, he merely watched the molten rock, then rolled his shoulders as he caught the radio announcer declare, "Today the First Citizen has decreed that piracy has been eradicated. The dread captain, Blue Flame, will soon be transferred to Dragonclaw Maximum Security Prison, where he will—"\n\nCRACK!\n\nJumping, Rusty held his rifle closer as a bullet clanged against the metal door of his post, and he let out a little shriek before shivering and ducking around the corner of the wall. As if a switch had been flipped, raucous shouts and screams echoed through the hallways and piercing klaxons blared, the lights of the prison suddenly cutting, with only the infrequent red pulses of the alarms illuminating the interior.\n\nHe gulped. Was this—\n\nAs if to answer his question, there was a thud against the door, and seconds later a pool of crimson liquid dribbled through the crack underneath. Seconds later, more impacts hit, and the door soon buckled under the weight of a dozen inmates, makeshift and stolen weapons in their grips.\n\nRusty smiled awkwardly."
  southeast.6.a:0 ""Hi?""
  southeast.6.b:0 "Steel Frame lies about our captain, Blue Flame!"
  southeast.6.c:0 "This prison party's over!"
  southeast.7.t:0 "Strokes of Luck"
  southeast.7.d:0 ""Yes, what is it?" grunted Steel Frame as he continued to mull over some of the reports on his desk. Rubbing his forehooves against his temples, he grimaced as he finally shoved them all away and pulled out a decanter of brandy, which he hastily poured into a glass and downed. With a sigh, he observed Lucky Star waltz in, the stallion's gait confident and self-assured and—Steel arched an eyebrow. Was that a cape?\n\nAs if to flaunt his duds, Lucky marched straight to the window of Steel's office and stated nonchalantly, "You appear comfortable, Steel." He flashed Steel an even smile. "Cobalt's office suits you. That's what you wanted to hear, right?"\n\nMomentarily darting his eyes to the brandy again, Steel steepled his hooves together and gazed at Lucky. He frowned. In the afternoon sunlight, Lucky practically appeared like some superhero, haloed in its golden rays. All he'd need would be the cape to billow in a gust of wind. Steel snorted and shook his head. "You didn't come to Cobalt's funeral. Why? Why come here now?"\n\nPuffing out his lips in a pained pout, Lucky clicked his tongue and swiveled back to Steel. "I was busy leading Stableside's ceremonies. You understand." When Steel continued to glare at him, though, he worked one of his fetlocks back and forth. "I was busy."\n\n"You were given a day's warning. You could have delegated and come here." Steel pushed himself up. Trotting toward Lucky, he snarled, "Yet"—he froze, catching a glint of sunlight in an orange, brass pin, shaped just like the celestial object. Just like Daybreaker's cutie mark.\n\n"Like it?" Lucky rubbed it and stepped away from Steel. "I got it made to match Snookums' cute flank." He tittered, a wistful, far-off grin spread across his muzzle. "And now she'll see how much she means to me." He perked up. "Oh, yes, that's why I came. I wanted to see your face when I said this"—he cleared his throat—"Smell you later, mud diggers!"\n\nWhirling and barging through the door, he cackled, "Stableside is free!"\n\nEyelid twitching, Steel finally bellowed, "Guards!""
  southeast.7.a:0 ""Prove him wrong!""
  southeast.7.b:0 ""But it's probably too late...""
  southeast.8.t:0 "Jungle Fever"
  southeast.8.d:0 "Hissing and chittering at the cacophony of cries, jeers, and shouts that echoed throughout the subterranean city of Ayacachtli, Stellar Note pressed both her forehooves down on her ears, squeezing her golden eyes shut for a moment as she breathed in, deeply, and out, slowly. At last, she opened them again, creeping her ears back up as well after the first of the protesters saw her actions. She scanned the hundreds, no, thousands of thestrals that lined the streets of the City of the Moon, each of them searching, begging her for some kind of answer. If it wasn't any other time, she'd probably have chuckled dryly, given how only a few days prior, if she had shown her face she may have been spit upon.\n\nShe cast a side glance to one of her fellow Moonspeakers, Waning Crescent, receiving a nod in return. She thrust up a wing. Permitting a hoofful of seconds to tick by, and when the uproar appeared no less willing to cease, she inhaled long and hard, feeling her lungs nearly burst, before she emitted an ear-piercing—for thestrals—screech that drove the closest to her, including herself, to flatten their ears against their skulls. Spears of pain jabbed into her forehead, as she finished, and she shook herself once the crowds went silent.\n\n"I know that you're worried!" she began, before the din of panic began to surge again.\n\n"Shut up!" another Moonspeaker, Nocturne Vision, boomed from Stellar's left side. Her silver robes flowed softly as she nodded to Stellar.\n\n"I know you're scared. But... we just have to trust that there will be some protection from—"\n\n"To Tartarus with Cobalt's 'protection!'" somepony shrieked from the crowd.\n\n"The Neighua are going to kill us!"\n\nOpening her mouth, Stellar frowned when more began to echo similar sentiments, turning into a tidal wave of noise that threatened to deafen her and the others standing in the Temple of the Moon's entryway. She cringed back, momentarily meeting both Nocturne and Crescent's glances before stammering, "W-We have to endure! We've survived! We've thrived against—" She ducked when multiple fruits and vegetables were tossed her way, and she frowned briefly at a stall that had been set up in the market outside, its vendor providing further ammunition.\n\nNocturne nudged her. In a low voice, the deep blue thestral hissed, "COBSOC is doing nothing. You want to survive this? Lead them." She snarled. "Or you'll lose the rest of the Council's confidence, too."\n\nAs a whimper escaped her throat, Stellar sighed and drew herself straight. "COBSOC can't keep us safe, but we can! The Moon will protect us!""
  southeast.8.a:0 "The thestrals won't stand for long."
  southeast.8.b:0 ""Endurance is all we know!""
  southeast.600.t:0 "Scorching Rays"
  southeast.600.d:0 ""Get the buck down!"\n\nBefore Tin Can could properly protest, a heavy hoof slammed onto his head, knocking on his dented helmet and making a solid clonking noise as he was thrust into the dirt. As mud and grit barged into his mouth, which he quickly spat out, the characteristic staccato burst of automatic weaponry resounded a short distance away, and whistling bullets chewed into the back wall of the rickety shack that he and two of his comrades had holed up in.\n\nElsewhere outside, single shots and slow, repetitive cracks of bolt-action rifles replied to the assailant, but their frequency was dwindling by the minute. Tin scrambled back to his hooves, his chest almost ready to explode from the constant pounding of his heart. Biting his lip, he started to raise his own gun, which was pockmarked and chipped, with the faintest hint of rust on the receiver, and fired out a new hole in the front wall of the shack.\n\nAfter it ricocheted off a tree, and only earned a pair of retaliatory shots back, Tin whimpered. "We're outnumbered!" He was shoved aside by his CO, Stonewall who took aim before an earth-shattering explosion rocked the shack. Patters of dirt and debris tapped on the roof. Within seconds, the drizzle morphed into a downpour of detritus, which ended with a wet slap of something impacting the boards.\n\nIchor dribbled through the cracks.\n\n"Artillery?!" Abruptly pulling his tail between his legs, Stonewall took a wild shot through the fresh holes. "When'd they get—" He cut off when there was a second, rocking detonation to the other side of the shack. In the distance, the faint rumbles of cannons finally reached Tin's ears.\n\nDucking his head, Tin gulped when Stonewall snapped, "You're the fastest! Find the radio back at camp! Let—"\n\nWith a crash, the front of the shack tore away, collapsing forward and revealing a pair of soldiers and a unicorn mare in a decorated robe. Tin cracked a shot at one, clipping the stallion in the neck. He collapsed, gagging as blood pooled underneath him, while the second soldier was gunned down by Tin's comrade. Stonewall fired at the mare, who merely smirked and deflected it with her magic.\n\nShe clicked her tongue. "Soldier stallions are all the same," she huffed. As her magic flared brighter, around Stonewall, she grinned. "So boring." She grinned, and with a sickening, fleshy crunch, Stonewall was not. Or, at least, nothing more than a steadily collapsing ball of gore.\n\nEyes widening, Tin shrieked and scrambled back, bursting through a rotten set of boards in the opposite wall before galloping into the jungle, his howls of fright carrying for miles."
  southeast.600.a:0 "Won't somepony do SOMETHING?!"
  southeast.600.b:0 "The South-East could use some more SUN!"

