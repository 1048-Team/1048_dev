  ###Descriptions###
  POLITICS_CEREBRUM_DESC:0 "§YBorn:§! 11th of March, 995 ALB in Ditrysium\n\n§YBiography:§! As the appointed CEO of the combined boards of directors of the Süd-Ost Gesellschaft, Cerebrum holds almost complete sway on the economic and political policy on Yukka Island, only mildly restrained by the other corporations as they seek to turn profits of their own. Although not particularly famed for either intelligence or scruples, he has remained in charge of the Nidhogg Arms Manufacturing Corporation for the better part of two decades, as he has set about policies of constant refinement, cost-cutting, and streamlining of operations.\n\nAs a young grub of the Ditrysium hive, Cerebrum was mostly ignored as he was neither the strongest nor weakest changeling, which left him usually near the back of the line for love and other emotion meals that were hoofed out to his peers. With little in the way of supervision, he turned more to subterfuge and trickery to go further in his cohort's hierarchy than through might. In time, he learned some of his other changelings' schedules as they trained to be warriors, scientists, engineers, and more, and he exploited them for his own gain in his latter years before being chosen as an infiltrator. More than once did peers, at times where the rationed love supply, learn of either a sudden summons by their instructors, an experiment gone awry, or some other catastrophe or unexpected turn that required them to duck out from being given emotional sustenance. Although he was not particularly subtle and he was noticed by those who reared him, it earned him a spot in one of the younger infiltrator waves to slip behind enemy lines in the Great War.\n\nFresh out of the hive when the war started, he was given a few months' instruction, then dispatched to Mareposa, where other infiltrators helped destroy one of the regional depots for munitions supplying the Equestrians. After the war, he returned a veteran, with new tricks up his sleeve to try in civilian life. But most employers wanted little to do with a middling changeling that barely had any military history to note beyond his crowning achievement. Eventually, he earned a job as a quality control drone for Nidhogg, and slunk his way into a managerial position, before using carefully planted evidence to accuse a territory manager of corporate espionage, and gaining the position instead. Within another few years, he had worked his way up to the board of directors, and after an unfortunate diagnosis of a terminal cancer of the previous CEO, head of the company.\n\nWhen the South-East was on the brink of economic collapse, he coordinated with other changeling corporations to bail them out, in exchange for the lucrative position of primary port of entry into Equus. Since then, Nidhogg's profits have soared, he has found a supplier in true love. Who says that money can't buy happiness after all?\n\n§YPortrait by:§! Dalkory"

