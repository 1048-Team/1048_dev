NID_inside_spies_idea:0 "Spies on the Inside"
NID_no_aviation_industry_idea:0 "Restricted Military Aviation"
NID_no_aviation_industry_idea_desc:0 "A necessary compromise in the signing of the STT Treaty that created our state in the first place, was the obligation to refrain from hosting any military aviation on New Yucca Island. Additionally, civilian flights would need to be registered with New Baltimare authorities, and no aeronautical research may take place on the island."
NID_breaking_east_idea:0 "§RBreak the East§!"
NID_thestral_homeland_idea:0 "§BMoonrise Accords§!"
NID_thestral_homeland_idea_desc:0 "Seeing their ambitions of an independant Thestral state crumble in their hooves, the Moonsingers of Ayacachtli settled for the next best thing. The §BMoonrise Accords§! grant [EEE.GetName] a special place within the Hansa, allowing them greater autonomy and promising them support in creating a homeland for all Thestrals all over the Globe."
NID_military_railroads_idea:0 "Military Railroads"
NID_naval_blockade_idea:0 "Blockaded by the U.C.C."
NID_march_to_victory_idea:0 "March to Victory"
NID_war_weariness_idea:0 "War Weariness"
NID_war_weariness_idea_desc:0 "§RWill be removed if we are in a §GDefensive War§! or if we §YRaise Stability above 80%§!§!"
NID_propping_up_hansa:0 "Propping up the Hansa"
NID_kerntruppen:0 "Kerntruppen"
 NID_kerntruppen_desc:0 "Wars require large, expensive and lumbering armies. Local victories however, can be won by a small elite cadre of motivated troops equipped with technologically superior weapons.\nOur subjects shall bear the brunt of the losses, while our specialists annihilate the enemy with equipment that might as well be science-fiction to them."
 NID_kerntruppen_tt:0 "Gain the §YKerntruppen§! modifier: §YSpecial Forces§! and §YMotorized§! units gain up to §G+15%§! attack and defence, scaling with how much of their technology line we have researched."
 NID_kerntruppen_mech_tt:0 "§YKerntruppen§!: §YMechanized§! units now also gain up to §G+15%§! attack and defence, scaling with researched mechanized technology."
 NID_kerntruppen_arm_tt:0 "§YKerntruppen§!: §YArmored§! units now also gain up to §G+15%§! attack and defence, scaling with researched tank technology."
 NID_kerntruppen_elite_tt:0 "§YKerntruppen§!: every unlocked unit line gains a flat §G+5%§! attack and defence."
 NID_kerntruppen_sf_org_tt:0 "§YKerntruppen§!: §YSpecial Forces§! gain §G+10%§! maximum organisation."
 NID_kerntruppen_supply_tt:0 "§YKerntruppen§!: §G-5%§! supply consumption."
