l_english:
  ###Ideas###
  GRI_hyper_trained_military:0 "Properly Trained Military"
  GRI_hyper_trained_military_desc:0 "We are not like the rabble that surrounds us which believes that one may merely give a griffon or pony a gun and expect them to shoot, kill, and die. The Imperial Army is professional. It has standards. Every griffon that enters service is expected to understand the ins and outs of military structure by heart. If they are ordered to jump, they'll fly; if they're ordered to fight, they'll brawl; if they're ordered to die, they'll take a thousand of the enemy with them!"
  GRI_excessive_church_taxes:0 "Nominal Church Tithes"
  GRI_excessive_church_taxes_desc:0 "To fund the services of Grover-Boreas's worship, we only require a small, mandatory donation from every griffon for every day of their lives. Grover-Boreas understands their plights and does not seek to be a burden, for what is asked is only what can be endured by mortals. When everything is for Grover-Boreas, such meagre matters of material wealth are trivial in light of His glorious future."
