  ###Descriptions###
  POLITICS_FH_RIVER_SWIRL_DESC:0 "§YBorn:§! 14th of July, 970 ALB in Rijekograd\n\n§YBiography:§! Even in the world as it stands today, River Swirl is seen as a sweetheart of Harmony and a beloved politician of the ponies, changelings, griffons, and dogs that she maintains authority over. Growing up in the city of Rijekograd, she and her family experienced the freedom of living in one of the only democracies in all of Griffonia and the world, and how ponies could freely determine their future without being dictated to by autocrats or pseudo-divine beings. Although never the wealthiest, she was comfortable enough and was able to study history and rhetoric between helping her Baba with her cousin, Pumpkin Swirl, or volunteering at one of the soup kitchens in Rijekograd. The latter activity earned her some respect in the populace after she organized a charity drive to expand the kitchen and brought Coalition-wide attention to the plights of the hungry in the city.\n\nEarning a degree in teaching at the young age of twenty, she saved as much as she could from her waves to travel to and apply for Celestia's School for Gifted Unicorns in Canterlot. Although she was not particularly talented in magic, she was a skilled orator, and in her entrance exam for the political science courses carried at the school, she achieved an almost perfect score, which earned her an all-expenses scholarship thanks to attracting the eye of Princess Celestia, who was visiting the school at the time. From her time in Equestria, she saw firsthoof the home of friendship and harmony, and returned to Rijekograd with even further ideas of how to improve the city and Republic as a whole. On these beliefs of economic reform and sane business regulation, she earned enough votes to become one of the representatives from Rijekograd, but she further refined her points, and in 1001, she was elected to her first term as Chancellor of the River Republic. Although successful enough in passing her desired laws, she faced a troubled second term, as socialists under Nova Whirl challenged her at every opportunity.\n\nIn the end, though, she was able to politically isolate Nova, and her third term was the highlight of her career, when she convinced the other Coalition members to unify into a supranational federation for the betterment of all. Yet with the clouds of war floating over the continent, the River Federation soon collapsed under their own fear. Defeated by Arclight's former deputy director, Limelight, she saw the freedoms she helped build crumble around her as Limelight preyed upon the terror that the citizens felt to centralize power around herself.\n\nAfter a failed overthrow of Limelight's government through a vote of no confidence, River began to find contacts of those who saw through Limelight's ploys, and after a last-ditch attempt at arresting Limelight when a scandal involving executions of prisoners failed, she fled to the friendly changeling island of Greneclyf. Since then, she has promised that the true Federation government would one day restore what it stood for, but those days are dying with her ageing compatriots. She, herself, is tired and overworked, but until Harmony is once again dominant in the Riverlands, she will carry the torch of resistance and be a symbol of hope to all who still love the light.\n\n§YPortrait by:§! Scroup"
