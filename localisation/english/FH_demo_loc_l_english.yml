  griffonia_limited_war_category:0 "The Griffonian Dance"
  griffonia_limited_war_category_desc:0 "Split between three great superpowers, Griffonia is little more than a plaything for the authoritarian regimes that keep their iron grip upon griffons, ponies, and the other inhabitants of the continent. While war is a constant danger and the boogeymare that is hung over ever prole or laygriff's head, it is no longer waged for resource acquisition, land, or even pride, but simply for further control and domination over what is already had. One day, the great powers may finally end their agreements, but until then, Griffonia shall be forever embroiled in shifting lines and bloody conflicts for nothing else than maintaining perfect fear over every soul."
