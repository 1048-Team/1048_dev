  ###Decisions###
  background_lore:0 "Background Lore of Fractured Harmony"
  background_lore_desc:0 "Every world has a reason for why it turns out the way it does. From the lowliest of towns to the mightiest of nations, this timeline has been broken by actions that have shattered the very hope of their inhabitants. Take a dive through the history of Fractured Harmony, and see where it all went wrong..."
  FH_demo_equus_heartland_skeleton_category:0 "The Equestrian Heartland"
  CER_crack_down_on_protests:0 "Crack Down on Regency Protests"
  CER_crack_down_on_protests_desc:0 "Although it is detestable that we have to limit our ponies' freedoms, the spats between the HCU and the HSL are destablizing the country more than any action from us. This will not be popular, but to stave off complete collapse, is necessary for the time being."
  CER_end_the_hunt:0 "End the Hunt for a Successor"
  CER_council_funds_for_industry:0 "Fund Rapid Industrialization"
  CER_recognize_daybreakers_threat:0 "Bury the Hatchet"
  CER_recognize_daybreakers_threat_desc:0 "For decades, the splinter states that fractured off the Solar Empire have refused to recognize each other or work together. Daybreaker will not wait forever, and if we hope to have any chance against her, we must put aside our differences and unite against her, just like how ponies treated it each other before."
  CER_expand_defense_faction_membership:0 "Expand [ROOT.GetFactionName]"
  CER_topple_the_mad_inquisitor:0 "Topple Opaline Arcana's Mad Theocracy"
  CER_a_complete_front:0 "A Strong Front Against Solarism"
  CER_beat_down_EQS:0 "Launch a Pre-Emptive Strike"
  CER_beat_down_EQS_desc:0 "The great beast of the Solar Empire appears to be stirring from its slumber. If we wish to have a chance at restoring Equestria, we must take the initiative before Daybreaker can launch her own assault upon us. We may catch her yet unaware."
  CER_united_at_last:0 "Harmony Restored"
  CER_reclaim_harmonys_birthright:0 "Reclaim Harmony's Homeland"
  CLD_CER_NER_state_border_wars:0 "Border Skirmish for [FROM.GetName]"
  BLS_appoint_nebula_excavation:0 "Appoint Nebula Flare as Excavation Head"
  BLS_recall_nebula_excavation:0 "Recall Nebula from her Post"
  BLS_delve_deeper_into_necropolis:0 "Delve into the Necropolis's Depths"
  BLS_finalize_dig:0 "Declare Excavation Completed"
  BLS_finalize_dig_desc:0 "Although there are still probably years' worth of artifacts and things that can be discovered within the Necropolis, the increasing expenses and inconveniences of our excavation are wearing on our citizens and leading to disgruntlement with the Directorate. We will do one last delve, far into the depths and seal up the Necropolis for the foreseeable future."
  BLS_foal_stimulus_cheques:0 "Provide Foal Stimulus Cheques"
  BLS_rectify_complaints:0 "Appear to Listen"
  BLS_secure_northern_perimeter:0 "Revenge of the March of 1044"
  BLS_secure_northern_perimeter_desc:0 "In 1044, General Solar Strike marched directly through our territory, in violation of the unspoken agreement between us and Daybreaker, and violated our neutrality. While the Empire has disavowed any responsibility for his actions, it is not something we can ignore forever. Without Daybreaker to save Whinnyapolis now, they're ripe for the picking and to serve as an example of the firepower our nation now wields."
  BLS_eastern_buffer:0 "An Eastern Buffer State"
  BLS_foreign_student_integration:0 "Integrate Foreign Students"
  BLS_buffer_around_changelings:0 "Form a Changeling Safety Net"
  BLS_expand_the_safety_net:0 "Expand the Safety Net"
  BLS_neutral_forts:0 "Neutral Barriers"
  BLS_secure_science:0 "Remove the Luddites"
  BLS_integrate_glory:0 "Integrate the Imperial Universities"
  WHY_the_final_push:0 "Final Expulsions"
  WHY_cleanse_the_heretics:0 "Cleanse Horizon Sunrise's Heresy"
  WHY_legalize_pluralistic_teachings:0 "Legalize Heterodoxy"
  WHY_formalize_control:0 "Negotiate Full Control"
  WHY_formal_representation:0 "Admit Civilian Representation"
  WHY_brainwash_the_conscripts:0 "Crack Down on Conscript Rebellion"
  WHY_finish_the_war:0 "Finish the Invasion of 1044"
  WHY_finish_the_war_desc:0 "In 1044, realizing that [NER.GetNameDef] was in a moment of weakness after a famine and disruptions by taking on changeling mercenaries, we marched north, spurning the vaunted neutrality of [BLS.GetNameDef] so we could achieve glory for the God-Empress. [NER.GetNameDefCap] were more prepared than we believed, and we only partly accomplished our goal. As they are still frail and we have resolved some of our internal conflicts, they are ripe for ending, permanently."
  WHY_violate_neutrality:0 "End [BLS.GetNameDef]'s Neutrality"
  WHY_crash_the_clouds:0 "Crater the Autonomy's Dreams"
  WHY_harmonic_mistakes:0 "Destroy Quaint Notions"
  WHY_the_new_generation:0 "Every Generation's Need"
  WHY_the_new_generation_desc:0 "Archmage Arcana is nothing if not benevolent. As she ascends ever higher to what she deserves, she will need aides to carry out trivial tasks. One will need to be her student, learning the ways of magic, of Order, and of the Holy Flame, much like the God-Empress once had as well. Every alicorn--whether actual or soon-to-be-realized--needs one, after all."
  WHY_ascend_to_alicornhood:0 "Ascend to the Imperial Diadem"
  WHY_ascend_to_alicornhood_desc:0 "We stand on the brink of greatness. Were it not for our Archmage, the heartlands would have remained disparate and shattered, and it was only through her will that we have a chance of a whole nation. Not even the God-Empress has accomplished feats half as worthy as the Archmage's. If the God-Empress will not ascend her by choice to her birth right, then it shall be taken. In fire."
