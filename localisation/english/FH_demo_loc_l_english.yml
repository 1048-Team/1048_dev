  EEE_eliminating_the_cults:0 "No More Blights"
  EEE_eliminating_the_cults_desc:0 "It has been whispered for centuries that deep within the jungles, two ancient cults have battled each other and vied for influence among politics within the South-East. Some speculate one or both had a say in thestral involvement in Nightmare Moon's rebellion against Celestia, but others claim it solely the work of the Nightmare and her legions. With modern technology, discrepencies have been found in jungle ruins that point to habitation. If habitation, then perhaps the cults themselves. We shall end this, and remove the stain so that those who'd say thestrals are nothing but insane, worshiping creatures may finally be silenced."
