  ###Events###
  fh_demo.1.t:0 "A Tiny Fiefdom"
  fh_demo.1.d:0 "Before and after the death of Cobalt Hoof, the central jungles of the South-East have remained a haven for guerrilla groups that have harrassed the Red Guard for years. As the the Solar Empire's formation dislodged many within its old borders that could have been threats to Daybreaker, it is inevitable that some of the groups that have survived in the South-East are from that cohort. While many insurgents and rebels have been taken care of by COBSOC, the one that has remained a thorn in the side of the western half of the peninsula is the National Redemption Pact, claimed to be led by Whiplash, a Wonderbolt and officer in the Equestrian Military before Daybreaker reformed it as the Solaris Militarum.\n\nThe NRP has remained elusive, rarely striking the same targets in the same way, and thereby making it challenging to pinpoint where they were based. Hundreds of depots, armories, and factories have been damaged or destroyed thanks to their efforts, although as of late, they had been quiet. At least until [ROOT.GetLeader] separated from [BAL.GetLeader]. Since then, Whiplash has seemingly upped his game, and larger and larger assaults have become commonplace. While [ROOT.GetLeader] has striven to respond, [ROOT.GetLeader.GetHerHis] own heavy-hoofed tactics have driven more ponies into open dissent, which the NRP has capitalized upon.\n\nSimultaneous attacks on garrisons in many towns and cities have completely overwhelmed our militia forces, and we have effectively been forced back to the coast around Stableside. Additionally, the changelings on Yukka Island have taken advantage of our disarray and seized the territory around their borrowed land.\n\nWe now stand on the precipice of collapse, but whatever happens, we know that [ROOT.GetLeader] will come out on top. He has never failed!"
  fh_demo.1.a:0 "Lucky today! Lucky forever!"
  fh_demo.1.b:0 "The NRP sounds like a capable organization..."
  fh_demo.2.t:0 "The Age Old Spat"
  fh_demo.2.d:0 "For centuries, we thestrals and the Neighua tribes around Tenochtitlan, now called Red Glory, have striven against each other, although it was not not encouraged by our side. Despite it seeming to be like the discrimination and hatred that thestrals faced after Nightmare Moon was defeated by Princess Celestia, the Neighua's claim that we are creatures of the night and darkness is more than just words, angry looks, or discrimination in work. As they worship the sun itself, before even meeting Celestia, they see us as a stain that must be wiped out to preserve the sanctity of the sun and day, and to purify themselves from any inner darkness by effectively committing genocide. How much this fanaticism has been felt varied depending on the tribal leaders, but at best, they were never our friends.\n\nDue to many thestral villages throwing in support to Cobalt Hoof's rebellion against Daybreaker, we had more protection and at least tolerance within the Governorate. The same could not be said of the Neighua, who fought with Daybreaker, but ultimately lost. For the last twenty or so years, COBSOC has attempted to stamp out their religion and culture, including leveling Tenochtitlan and rebuilding it as a fully secular city. However, Cobalt clearly failed, as reports have quickly come in of lynchings and other executions of thestrals who moved from the jungles around the mountains to Tenochtitlan for better work.\n\nThousands of refugees have fled to us, and the Neighua have taken the majority of the coast we held. [NEI.GetLeader] has assumed command and has promised that we will be destroyed for helping their oppressor.\n\nWe must be ready for anything, as it is only a matter of when, not if, they will come for our throats."
  fh_demo.2.a:0 "Moon protect us!"
  fh_demo.2.b:0 "Their moon can't protect them now."
  fh_demo.3.t:0 "Successful Border Attack Against [FROM.FROM.GetNameDef]"
  fh_demo.3.d:0 "Our soldiers chosen for the skirmish against [FROM.FROM.GetNameDefCap] have managed to overwhelm their border guards and have opened the door for us to take what is rightfully ours and taken from us in the years since Equestria's collapse. News of the victory has boosted morale and our public image, and our generals have proposed future prodding attacks to determine [FROM.FROM.GetLeader]'s military strength and to keep our troops sharp.\n\nOur new citizens will soon acclimate to our rule and become naturalized members of [ROOT.GetNameDef] soon enough."
  fh_demo.3.a:0 "Huzzah! The land has expanded!"
  fh_demo.4.t:0 "Unsuccessful Border Skirmish"
  fh_demo.4.d:0 "After long hours of fighting, our troops have been pushed back by [FROM.FROM.GetNameDef]'s forces and have been routed into retreating. Our objectives have been unfulfilled and word of the needless loss of life and expenditure of military equipment has already affected morale among the troops and populace. We will need to lick our wounds before we can think about retaliating."
  fh_demo.4.a:0 "Poo..."
  fh_demo.5.t:0 "Inconclusive Border Skirmish"
  fh_demo.5.d:0 "Despite days of conflict along the border with [FROM.FROM.GetNameDef], both sides have been forced to withdraw after ammunition and other supplies ran low. Little territory was lost or gained, and ultimately what was accomplished was an excessive amount of bullets and explosives spent for a status quo. At the very least, our generals have seen a minor improvement to some of our companies' combat readiness thanks to their experience gained from the conflict. If nothing else, we can also spin it into a victory to encourage our citizens, if only a Pyrrhic one."
  fh_demo.5.a:0 "All right, we'll call it a draw."
  fh_demo.6.t:0 "Strong Defense Against [FROM.FROM.GetNameDef]"
  fh_demo.6.d:0 "Through blood, sweat, and tears, our troops caught in the border conflict with [FROM.FROM.GetNameDef] have managed to hold and push the invaders back before they could carry out whatever plan they had, most likely to try and occupy territory they have claimed as their own. So far casualties inflicted upon us have been deemed minimal, and the word of the repelling of foreign troops, even if in small number, has reached the capital, where news is spreading of our troops' valiant efforts.\n\nThis may not be the last time we must defend our territory, but at least this time, we've managed to come out ahead."
  fh_demo.6.a:0 "Huzzah, the casualties have been doubled!"
  fh_demo.7.t:0 "The Summit of the Princesses"
  fh_demo.7.d:0 "Since the establishment of the Solar Empire, Princesses Luna and Twilight have been our guests and fellow advisors to Princess Cadance in leading the Crystal Empire. Much of their help in maintaining some level of stability as crisis after crisis has washed over us has been invaluable, and their commitment to keeping the hope of Harmony alive in these dark times cannot be understated. The Council of the Three Princesses was created for such a purpose, as each has their own area of expertise and focus, but as they are all Princesses, are equal with each other. Twilight Sparkle was the one to suggest the idea, and at first, the council functioned as she intended, as each stayed in their lane and helped with initial recovery after the first set of reparation payments to [CHN.GetNameDef]. Yet that has not persisted, as the topic of preparing the Crystal Empire for ending Daybreaker's reign of terror always leads to the council descending into insults, spiteful words, and the occasional fighting match, as each Princess has their own idea of what should be done.\n\nCadance would see the Crystal Empire restored, but wishes for peaceful co-existence, as she has seen nothing but hardship for decades, and the crown contiues to weigh heavily upon her as the ultimate ruler of the Empire. Princess Luna desires that the Crystal Empire be geared wholly for war to end her fallen sister's mockery of Equestria's legacy for good. Twilight Sparkle has put forward plan after plan, but never committed, and when pressed on what to do with Daybreaker, has broken down more than once into repeated, blubbering apologies for her actions. These and other disagreements have turned the council into little more than red tape upon red tape, as the current agreement is that agreements must be unanimous. From the sidelines, Princess Flurry Heart has attempted to reason with her two aunts and her mother, reminding them of the friendship they still have and to hope in the future. Thus far, this message has fallen on deaf ears.\n\nHowever, with seemingly growing activity in the Solar Empire, the Princesses have agreed to meet again, with determining who, once and for all, shall lead them until Equestria is restored. When she heard about it, Flurry Heart demanded that she be part of the discussions, as she is of age and wishes to see her Auntie Celestia restored, just like Luna was so long ago.\n\nThe summit will happen shortly and with it, the unquestioned commander of the Crystal Empire."
  fh_demo.7.a:0 "Princess Cadance shall continue to lead us."
  fh_demo.7.b:0 "Princess Twilight will restore Friendship and Harmony to the land!"
  fh_demo.7.c:0 "Princess Luna is the warrior that the Empire needs."
  fh_demo.7.e:0 "Princess Flurry Heart is the fresh perspective that is missing."
  fh_demo.8.t:0 "Passing of the Empire's Shield"
  fh_demo.8.d:0 "For many years, [ROOT.GetNameDef]'s military has been under the command of the Prince Consort, Shining Armor, who has been spouse of Princess Cadance for almost fifty years. His skill and tactics ensured that we endured while the Solar Empire crumbled, and it was only through his extensive fortifications that he approved that we were able to hold against Stalliongrad's invasion  as much as we were. In the decades since, he has done what he could with the funding the Crystal Military had to keep it in fighting shape, no matter how much of a losing battle it was. With Cadance, he welcomed the other Princesses and the Elements of Harmony with open arms, and he has remained a calming influence on Twilight Sparkle's life whenever she veers into guilt and shame over Daybreaker.\n\nHowever, time eventually wears everything out but the immortal alicorns, and Shining was no exception. The Prince Consort has battled numerous bouts of disease, each one leaving him weaker and more vulnerable to the cool temperatures of [ROOT.GetNameDef] than before.\n\nFor the last several years, a recurring cough, followed lately by a progressive pneumonia and the first signs of kidney failure had been what ailed Shining Armor, at least until last night. At the unexpected summons of him, the all four Princesses arrived at his quarters, where he was purportedly more awake and alert than he had been in weeks. Yet only a short while later, Princess Twilight, followed shortly by Luna, left his room, and doctors arrived soon thereafter and pronounced him dead. Already, a state funeral has been planned and [NER.GetLeader], [CLD.GetLeader], and [CER.GetLeader] have all promised to attend it along with other delegates and friends from their respective nations. While that is being prepared, though, the General Staff have already asked the question of his successor. Tempest Shadow was tapped first, as she has more combat experience than every other commissioned officer in the military, but she laughed it down, going as far to joke she'd be more dangerous to our soldiers than the enemies as she whips them into shape.\n\nTempest's rejection leaves us in a precarious situation, as somepony will need to fill his gap to ensure that Sellenite and Princess Luna are not overwhelmed. A few names have been brought forward, but it still requires a decision from the Princesses before they can be promoted to replace him."
  fh_demo.8.a:0 "Misty Night is the most experienced."
  fh_demo.8.b:0 "Flash Sentry thinks like Shining. It should be him."
  fh_demo.8.c:0 "Rainbow Dash is an Element of Harmony. Who else could it be?"
  fh_demo.9.t:0 "A Demented End"
  fh_demo.9.d:0 "It has been an open secret that General Secretary Sinister Serov has not been himself, and has not been himself for years, approaching a decade now. Everypony in [ROOT.GetNameDef] saw it, the Supreme Soviet saw it, and his inner circle saw it. What they did not have, though, was the gumption and the nerve to actually do anything about it. Although his doctors finally admitted only a few weeks prior that he suffered from advanced stages of dementia, there was no formal mechanism to remove him from power, and between his constant lapses in memory, flip-flopping on funding—barring his obsession with a space programm—and fear of assassination exacerbated by his delusions of being surrounded by loyalists to Vasiliy Wheatin, worries began to mount that he would finally lead our nation into complete ruin, or purge everypony but himself from government.\n\nThat, however, has not come to pass. His constant caregiver and loyal wife, Anya, has reported that he tried a bite of his favorite meal, a corn dish, before abruptly choking on it. While she tried to administer first aid, he struggled against her and by the time she was able to dislodge it, he had injured her and himself, althoug he bore the brunt of it. Autopsies confirmed as much, although there were trace levels of arsinic that couldn't be explained. Further questions from the doctors were put to rest by some of Sinister's inner circle, who put forward his successor, Feather Bangs, from Serovgrad.\n\nWhile our nation mourns the loss of our great leader, we also celebrate he no longer suffers. Feather Bangs, while he has remained elusive on policy, has remained popular with the citizenry ever since Our Town was annexed decades ago. Whatever he plans, it must first undo the damage that has been wrought by years of unstable leadership. Only then can the workers of Equus be freed from their oppressive masters!"
  fh_demo.9.a:0 "The Supreme Soviet has spoken!"
