  ###Decisions###
  background_lore:0 "Background Lore of Fractured Harmony"
  background_lore_desc:0 "Every world has a reason for why it turns out the way it does. From the lowliest of towns to the mightiest of nations, this timeline has been broken by actions that have shattered the very hope of their inhabitants. Take a dive through the history of Fractured Harmony, and see where it all went wrong..."
  FH_demo_equus_heartland_skeleton_category:0 "The Equestrian Heartland"
  CER_crack_down_on_protests:0 "Crack Down on Regency Protests"
  CER_crack_down_on_protests_desc:0 "Although it is detestable that we have to limit our ponies' freedoms, the spats between the HCU and the HSL are destablizing the country more than any action from us. This will not be popular, but to stave off complete collapse, is necessary for the time being."
  CER_end_the_hunt:0 "End the Hunt for a Successor"
  CER_council_funds_for_industry:0 "Fund Rapid Industrialization"
  CER_recognize_daybreakers_threat:0 "Bury the Hatchet"
  CER_recognize_daybreakers_threat_desc:0 "For decades, the splinter states that fractured off the Solar Empire have refused to recognize each other or work together. Daybreaker will not wait forever, and if we hope to have any chance against her, we must put aside our differences and unite against her, just like how ponies treated it each other before."
  CER_expand_defense_faction_membership:0 "Expand [ROOT.GetFactionName]"
  CER_topple_the_mad_inquisitor:0 "Topple Opaline Arcana's Mad Theocracy"
  CER_a_complete_front:0 "A Strong Front Against Solarism"
  CER_beat_down_EQS:0 "Launch a Pre-Emptive Strike"
  CER_beat_down_EQS_desc:0 "The great beast of the Solar Empire appears to be stirring from its slumber. If we wish to have a chance at restoring Equestria, we must take the initiative before Daybreaker can launch her own assault upon us. We may catch her yet unaware."
  CER_united_at_last:0 "Harmony Restored"
  CER_reclaim_harmonys_birthright:0 "Reclaim Harmony's Homeland"
  CLD_CER_NER_state_border_wars:0 "Border Skirmish for [FROM.GetName]"

  ###Custom Tooltips###
