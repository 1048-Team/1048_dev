 ###Equus Decisions###
 form_equestria_category:0 "Reclaim the Equestrian Throne"
 form_equestria_category_desc:0 "With [3.GetCapitalVictoryPointName] now under our control and the Solar Empire vanquished, we can assert our position as the true successor to Equestria and claim the mantel of its history for our own. All of Ponykind will be united under our banner!"
 EQS_form_equestria:0 "Equestria's Rebirth"
 EQS_rename_sanctum_solar:0 "Restore Canterlot's Name"
 EQS_heartlands_victory:0 "Victory for the Equestrian Heartland"
 EQS_reintigrating_the_southeast:0 "Reintigrate the South-East"
 EQS_reclaim_severyana:0 "Restore the Region of Severyana"
 EQS_southern_glory:0 "Retake the Mild West"
 EQS_reinvest_in_las_pegasus:0 "Welcome Back Las Pegasus"
 EQS_reclaim_the_west_coast:0 "Reclaim the West Coast"
 EQS_equestria_restored:0 "A Nation Healed"
 form_yakyakistan_category:0 "Rebuild Yakyakistan"
 form_yakyakistan_category_desc:0 "We've SMASHED other puny warlords around us and now we the only TRUE yaks left. It's time we bring back our old home and show all other nations how weak and smashable they are!"
 form_PLB_category:0 "Reestablish the Communities"
 form_PLB_category_desc:0 "Through sweat and blood, we have regained most of our ancestral territory and punted the yak squatters from our land. We can now rebuild our broken territory, and one day look to take what is left from the despicable [CHN.GetLeader]."
 form_nova_griffonia_cetegory:0 "Novan Rebirth"
 form_nova_griffonia_cetegory_desc:0 "With the other rump territories of the former Nova Griffonia under our control, we can establish ourselves as its successor state and claim ownership of most of the region."
 form_western_griffonian_empire_category:0 "Rebirth of the Western Empire"
 form_western_griffonian_empire_category_desc:0 "When Kaiser Highhill ascended over three decades ago, he had a dream of a united banner of the North that could rival the old Griffonian Empire on the adjacent continent. When he died in battle, his successor was unable to keep the regions in line and the Empire nearly crumbled. This day, with the majority of its territory reconquered, we can proclaim that the Empire has been reborn and the North will stand strong against all those who dare threaten us!"
 GRF_assert_imperial_de_jure_authority:0 "Re-Assert Imperial Authority"
 GRF_return_the_old_colonial_borders:0 "Retake the Lost Colonial Borders"
 GRF_rebirth_of_the_western_empire:0 "Rebirth of the Western Griffonian Empire"
 GRF_a_new_nova_griffonia:0 "Reshape the Nova Griffonian Image"
 JGR_reform_our_communities:0 "Reform Our Communities"
 YAH_SMH_claim_the_throne:0 "Claim the Yak Throne"
 YAH_SMH_integrate_old_territory:0 "Integrate the Old Territories"
 SCH_formables_category:0 "Revenge of the Small"
 SCH_formables_category_desc:0 "Before the penguins were subjected to the oppression of the Nova Griffonians and Erwin Highhill, there were plans for a northern empire which stretched from the further reaches of the icy wastelands across Equus. That was far too small an ambition for those who have been pressed down by so many other nations. With the former lands of the Western Griffonian Empire mostly under our control, we can declare our true ambitions: a frozen land of enchantment and might, that will ward any of the northern races for the aggression of our southern, imperialist neighbors."
 SCH_form_auroral_north:0 "Take the Auroral Crown"

