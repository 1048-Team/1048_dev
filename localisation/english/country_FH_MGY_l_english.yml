  ###Ideas###
  MGY_harmonist_vengeance:0 "Sands of Fate"
  MGY_harmonist_vengeance_desc:0 "Margeypt once hugged the entire length of the Neighile River from its delta to the furtherest fringes of the Great Lakes, yet that past is gone. Through successive defeats at the claws of the Abyssinians, we lost first much of our coast, and then the loyalty of the cities in the Upper Neighile. Despite our efforts at calming the crowds, the fires of revanchism rage beneath our sea of citizens. There will be only one way to stem this tide: through the reclamation of our land, watered by the blood of tyrants."
