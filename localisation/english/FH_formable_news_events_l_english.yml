l_english:
  formable_news.1.t:0 "End of the Third Unification War"
  formable_news.1.d:0 "[THIS.GetNewspaperHeader]After decades of outside rule and division, today marks the first day, since Paw Wellington's defeat, that the Polar Bears have been fully unified under one realm. The Jan Growlers, a warlord realm carved out of the collapsed Western Griffonian Empire, recently won a glorious victory, reclaiming the lands taken by the Changeling Hegemony when Queen Chrysalis invaded the Western Griffonian Empire. Celebration and jubilation filled the streets of the new Polar Bear realm, as veterans marched back from the front, breathing a collective sigh of pride at turning their swords into plow shears. Already, the Growlers have integrated their lost brethren, and in a speech given by [FROM.GetLeader], [FROM.GetLeader.GetSheHe] declared that; "Never again, shall the Polar Bears be humiliated and separated. All good things come in threes, so let this third Polar realm be the greatest of all, born out of the most glorious of victories.""
  formable_news.1.a:0 "Changelingia's grip weakens further."
  formable_news.1.b:0 "That territory was worthless, anyway!"
  formable_news.2.t:0 "The Red Banner Waves"
  formable_news.2.d:0 "[THIS.GetNewspaperHeader]The last of Stalliongrad's recent conquests have come to an end, as the last independent bastions on Equus were stamped out. Sinister Sevrov, leader of the Stalliongrad state, has declared the end of bourgeois dominance on the continent, replaced with a dictatorship of the proletariat. In light of this great victory, the various partner states created during his conquests have been fully integrated into the Stalliongrad state, which has been reformed into the United Socialist States of Revolutionary Equus. For the first time in history, a red banner flies across the continent, all the way from Hjortland to Trottingham, and parades, both civilian and military, have been organized in every major city.\n\nAlready, the new state has reached out to work out with local communist leaders, who will lead the different autonomous regions within the new state. Charismatic leaders have taken charge, such as Gold Muffin in what was once Changelingia. Equus, for the first time in a long time, is at peace, under a red banner."
  formable_news.2.a:0 "Nothing but a farce."
  formable_news.2.b:0 "Next, the world!"
  formable_news.2.c:0 "Bourgeoisie revisionary scum."
  formable_news.3.t:0 "Ruby Day"
  formable_news.3.d:0 "[THIS.GetNewspaperHeader]On the streets of Crystal City wave red banners today, as crystal ponies, painted red and glowing in the light of the Crystal Heart, march in a grand parade. The Union of Free Crystal Workers was once seen as nothing more than a satellite state of Stalliongrad, their revolution seen as a manner of red colored imperialism, but today, the Crystal Workers make their wishes well known. Old flags of snowflakes and royal purple are being replaced with new banners, and the Crystal Heart glows brighter than ever, as the love of revolution and hope for the future flow through it. While some do speak of worries about Stalliongrad's control over the state, most revolutionaries are happy, planning to use their crystal strength to aid the continental revolution."
  formable_news.3.a:0 "Go, comrades!"
  formable_news.3.b:0 "Another stain on the map."
  formable_news.3.c:0 "I hope the Princesses are okay."
  formable_news.4.t:0 "The Ruby Peace"
  formable_news.4.d:0 "[THIS.GetNewspaperHeader]The Union of Free Crystal Workers, a satellite state set up by Stalliongrad from occupied parts of the Crystal Empire, has come to an end today. Crystal hooves and treads marched through the home of the revolution, tearing down the red banners, replacing with them royal purple, emblazoned with a snowflake. Many in the Crystal Empire called for widespread punishments against the communists, revenge for betrayal during the Great War, but these calls were surprisingly ignored. Today, [FROM.GetLeader], working alongside moderate communist leaders and collaborators, has announced the Ruby Peace, a full pardon to any revolutionaries who fought against the Crystal Empire, and a promise to create representation for the communists, to allow for a peaceful, cooperative future. One anonymous source told the papers that [FROM.GetLeader]'s decision was: "One made of pragmatism. The Empire is not strong enough to reject any able body, and we'd rather have cooperation with the communists, than servitude under Chrysalis."
  formable_news.4.a:0 "Better the Princesses than Chrysalis."
  formable_news.4.b:0 "A little mercy goes miles!"
  formable_news.5.t:0 "The Hegemony Strikes Back"
  formable_news.5.d:0 "[THIS.GetNewspaperHeader]Recently, Equus finally came to a fully peaceful state, as Changeling treads crushed the last remnants of resistance. Queen Chrysalis, learning from her overextension during the Great War, has created occupation governments for every conquered region, working alongside local collaborators to ensure plenty of cooperation, and efficient love gathering. However, with the last threat on the continent destroyed, Queen Chrysalis has announced that Vesalipolis shall take direct control over all conquered territories, unafraid of overextension anymore. It's clear for many that the creatures of Equus don't plan to go quietly, as resistance cells spring up all over the continent.\n\nAs of today, Chrysalis, and her realm, have claimed full Hegemony, the undisputed masters of Equus, the greatest power in the world, according to some. Yet behind closed doors and in dark alleyways, whispers and plots spring to life, as ponies, deer, griffons, yaks, bears, buffalo, and penguins alike work together to overthrow their masters. For today, Chrysalis stands tall, but for how long shall the tallest tower stand, before it is felled?"
  formable_news.5.a:0 "The Sick Bug is healed."
  formable_news.5.b:0 "Villains never win. For long..."
  formable_news.6.t:0 "A Mighty Empire"
  formable_news.6.d:0 "[THIS.GetNewspaperHeader]In the ruins of the Western Griffonian Empire, a new realm has clawed their way to the top, after years of fighting and destruction in the realm's land. Once known as the Griffonian Frontier, then the realm known as Virgilia, the new realm has been founded by Virgil's Marauders, a group led by the son of the famous independence fighter, Virgil. Today, many expected a coronation in the restored city of Weter. Yet Virgil, surprisingly, has refused a crown or the title of Emperor. In a victory speech to the nation, Virgil spoke about the weakness of monarchs and monarchies, about the uselessness of opulence and the weakness of the former Western Griffonian Empire. He instead presented to the entire realm the crown of the Empire, melted down and fashioned into a sharp blade, proclaiming that they are no longer an empire. Rather, he says, they are a "Realm of the Strong, and the strong alone." Many ambassadors have begun to reopen their embassies in Weterheim."
  formable_news.6.a:0 "An imperialist by another name..."
  formable_news.6.b:0 "Still nothing more than a bandit."
  formable_news.6.c:0 "A force to be reckoned with."
  formable_news.7.t:0 "Northern Aurorae"
  formable_news.7.d:0 "[THIS.GetNewspaperHeader]The Penguins have long been a neglected species in Northern Equus, having been subjugated by Yak Khans, Bear Overtyrants, and most recently, a Griffon Emperor. In the collapse of the Western Griffonian Empire, the penguins claimed a realm for their own again, deemed The Screechers, and vowed to never be subjugated again. Now, Penguins rule over Khans, Overtyrants, and Emperors. In a speech held in the old capital city, Weter, the leader of the Penguins claimed the legacy of the Western Griffonian Empire, and in addition, many northern provinces held by the Changelings, claiming that the new state is to be the custodian of all lands in the north of Equus. Many watch with bated breath, as the Aurora marches west, to avenge their previous defeat against Chrysalis."
  formable_news.7.a:0 "Bold move, penguins."
  formable_news.8.t:0 "The Northern Commune Compact"
  formable_news.8.d:0 "[THIS.GetNewspaperHeader]When the Western Griffonian Empire splintered in the wake of Erwin Highhill's death in battle against Chrysalis, a group of communist revolutionaries rose up across the empire, though primarily concentrated in Nova Griffonia. While their attempted revolution was barely pushed back, today, in newly captured Weter, the communists claimed the end of the revolution. They invited representatives from every conquered rump state, signing an agreement as one, the Compact of Northern Communes. Giving autonomy to the various regions of the state, enforcing communistic democracy upon them, and binding all species and realms together in a common nation. Against the revisionists in Stalliongrad, and the supremacists in Vesalipolis, the National Northern Commune stands together, protecting their nation, and their revolution. In Stalliongrad, this ideology has been denounced, called "National Communism," a title which has been taken up by the commune. None know if the communists shall attempt to reclaim their land from the changelings, but one thing is certain, they will defend their nation to the death."
  formable_news.8.a:0 "Marks is spinning in her grave."
  formable_news.8.b:0 "Wait, are they nationalist, or communist?"
  formable_news.8.c:0 "How can communists care about their nation?"
  formable_news.9.t:0 "A Completed Revolution"
  formable_news.9.d:0 "[THIS.GetNewspaperHeader]When the Western Griffonian Empire fractured after Erwin Highhill fell in battle, Stalliongrad leapt at finally freeing the griffon workers to its north. Communist rebels in the south joined with Stalliongrad's forces, claiming a large rump state in the south of the Empire. Today, celebrations were held across the nation, celebrating the completion of their revolution, and the establishment of their worker's dictatorship over the lands. In honor of this occasion, Sinister Sevrov even took the chance to visit, hosting a military parade, along with the Chairgriff of the newly deemed International Socialist State of Northern Republics. Stalliongrad tanks and Northern Socialist troops marched side by side, holding the red banners of both their lands, their columns being welcomed by the weary and tired creatures all over the Empire. While many say they'd prefer independence or for another state to have reclaimed the Empire, they still welcome the influence of Stalliongrad. According to one talkative Yak, "Red banner, Yak banner, Yak not care any more. Yak just want food. Yak want job for Yak's family. Red ponies bring peace. Yak hates peace, Yak hates red ponies, but Yak will enjoy red ponies' fruit. Yak also hates journalists.""
  formable_news.9.a:0 "Three cheers to our comrades!"
  formable_news.9.b:0 "The rivers run red."
  formable_news.10.t:0 "History's Tables Turned"
  formable_news.10.d:0 "[THIS.GetNewspaperHeader]Decades ago, changeling tanks crossed the border with Olenia, storming over the underprepared deer divisions in revolutionary lightning warfare, and necessitating King Johan's surrender and abdication. Surprising every international observer, recently, the Olenian state nationalized all changeling assets, and arrested or executed every changeling in their country, except for those who stood against Chrysalis. This time, when changeling tanks rolled across the mountains and snowy plains, the deer were prepared. In short order, Chrysalis, and the entire Changeling Hegemony, surrendered to the resurgent Olenian state. Changeling industrialists were hunted down, entire hives were burnt down, and only the loyal have survived the vengeance of the Deer. Today, broadcasted on all channels, a group of seven Deer soldiers wrapped ropes around their bodies, and around each of ex-Queen Chrysalis' limbs, running in different directions, until the ex-Queen was quartered, seemingly an ancient Olenian tradition done to the most dishonored enemy leaders. With the death of Chrysalis, and occupation of every love factory, the Deer have pacified the changelings, doing what nobody else could do before, declaring themselves Greater Olenia."
  formable_news.10.a:0 "Ding dong, the wicked bug is dead!" #OLE only
  formable_news.10.b:0 "A gruesome fate, even for her." #Harmonist only
  formable_news.10.c:0 "A fate most deserved."
  formable_news.11.t:0 "Sabbath"
  formable_news.11.d:0 "[THIS.GetNewspaperHeader]A national day of rest, relaxation, and celebration has been announced today by the newest Emperor of Griffonia, William Steel Beak. In the chaos of Griffonia, as Marelandia, the Riverlands, and the Griffon Empire fought for dominance, they forgot one small kingdom in the north, the Serene Kingdom of Arcturia. A uniquely peaceful kingdom in Griffonia, Arctruia was able to exploit the fighting of the other three powers, going from a backwater in the forgotten north, to the only power remaining on Griffonia of any note. Peace, calm, and stability returns to every corner of Griffonia, as swords and rifles are laid down at last, and for the first time in decades, peace has returned to these damaged lands. The griffons, ponies, and other creatures in the new Empire still carry the scars of the last few years, but, as of today, it seems like a quiet hope has filled the heart of every citizen of the realm."
  formable_news.11.a:0 "Arcturia?!"
  formable_news.11.b:0 "Death has been defeated at last."
  formable_news.12.t:0 "A New Tricolor"
  formable_news.12.d:0 "[THIS.GetNewspaperHeader]Decades ago, the Griffonian Empire was overtaken by fervent revolutionaries, seeking to overthrow the Emperor and create a republic in the Herzland. However, the republicans lost, and fled north, taking over Cloudbury. When the Regent assumed control of Griffonheim, the republican forces were pushed even further, out of their northern redoubts, to barely hold on at the edges of the continent. All that changed recently, as the Republic sprung from the north, talons and tanks trundling into Cloudbury, and down to the ruins of Griffonheim, claiming the Herzland for themselves, and from there, all of Griffonia. For the first time in history, the tricolor lifts itself high across Griffonia. Reconstruction has begun, as all around the continent, griffons and ponies alike celebrate the culmination of the republican dream. While some foreign harmonist governments say the Republic has a long way to go, and many endemic issues to fix, they have also offered support for the state, seeing them as a much better alternative to any other option. Rumors already come from supremacist and communist countries across the world of Griffonian arms finding their way to local republican resistance."
  formable_news.12.a:0 "Praise Kemerskai!" #FAT only
  formable_news.12.b:0 "A new superpower rises..."
  formable_news.13.t:0 "A New Temple in Neu-Griffenheim"
  formable_news.13.d:0 "[THIS.GetNewspaperHeader]The three-way stalemate over Griffonia has finally come to an end, with none other than the Griffonian Empire coming out on top, avenging Grover-Boreas's earthly death. To celebrate their victory, a temple, more grand than any before, has been built in Neu-Griffenheim, unveiled and introduced in a victory speech today. The temple rises higher than Solarspike Mountain in Griffonstone, and seems to have been built using symbols of their defeated enemies. Columns taken directly from the River Parliament hold up a piece of art at least twenty feet tall: the Imperial flag, complete with the icon of the Idol of Grover-Boreas, comprised of torn tricolors and posters of Big Sister. In an opening speech, the Archon reaffirmed that Grover-Boreas, the only worthy deity of the Griffon pantheon, has blessed them for their struggles. To affirm the new commitment to Grover-Boreas and his laws, the Archon ordered a public display of justice. Out came Alexander Kemerskai Jr., Limelight, and a mare who resembled Big Sister, though sources remain skeptical about the true identity of the mare. All three were executed by hanging, their corpses a message to the rest of the world. The Empire is back, under the eternal, watchful eye of Grover-Boreas."
  formable_news.13.a:0 "We are nothing except Grover-Boreas!" #GRI only
  formable_news.13.b:0 "Order returns to Griffonia..."
  formable_news.14.t:0 "Triple Plus Good"
  formable_news.14.d:0 "[THIS.GetNewspaperHeader]One does not normally get the chance to visit Marelandia, as MARESOC is very particular about its information leaking to enemies. But today, a special offer graced my table. In light of the recent victories Marelandia has won, they invited me to the capital, to interview a member of the Upper Party, and write to let the rest of the world know what they had to say. The capital was oddly quiet, as my transportation delivered me to the one I was to speak to. The Party Members' gazes trailed me as I passed. Each smiled too widely, waved a bit too much. Ponies, griffons, Minotaur, some changelings, too, all in the same uniforms, wearing the same expressions. Everything. When I spoke to the Upper Party member, they sat me down with some tea and spicy chocolate, and they spoke. Marelandia doesn't exist anymore, now, it is simply The Party. Borders have never existed, so there's no need for a country name anymore. They described their victories using a Newspeak term. A new one: Triple Plus Good. The best thing possible. I was afraid, worried that I wouldn't be allowed to leave. They told me they didn't care what I wrote. They said that in the future, there would only be one phrase of my interview that survived. One phrase, they said, that every world leader should hear."
  formable_news.14.a:0 "The Party has always controlled the world."
  formable_news.15.t:0 "Leagues Ahead"
  formable_news.15.d:0 "[THIS.GetNewspaperHeader]The League of Free Nations, once nothing more than a collection of border states, have announced victory in the Griffonian continent today. Though the road has been long and arduous, Griffonia now stands together and free. Communists and theocrats are hunted down and arrested every day, as the now free countries of Griffonia coordinate their efforts to rebuild and restore what once was. Of particular note is the city of Sunset, where industrialists have recruited many unfortunate former Proles to reconstruct the city in a sensible manner, with investment from Skyfall and Brodfeldian bankers returning prosperity to the poverty ridden Marelandia. In the ruins of Griffonheim, similarly, the many realms have supported archeologist teams to delve into the city. Protected by Wittenlandic mages from nuclear fallout, these archeologists have begun to slowly recover much of the history left in the once great city. Foreign investments from neutral and harmonic powers have also allowed for a proposal of rebuilding Griffonheim, though such a project seems to be far away."
  formable_news.15.a:0 ""Free?" As monarchists? What a joke!"
  formable_news.15.b:0 "A perfect investment opportunity!"
  formable_news.16.t:0 "The Continental Constitution"
  formable_news.16.d:0 "[THIS.GetNewspaperHeader]Ever since the fall of the last organized resistance in Griffonia, River Swirl, leader of the River Federation, has called for representatives from every corner of Griffonia. Alexander Kemerskai Jr., son of the legendary Griffonian revolutionary, Thibault Devereux, an elderly popular writer from the Aquilian Revolution, Giacomo Gatteotti, a harmonic socialist from Wingbardy, and Hera Eichberg, a secretive Angriver republican, all appeared in a public announcement by River Swirl earlier today. For months, accordingly, a new constitution has been written, rewritten, and rewritten again, to define the democratic system of the new state, and ensure freedom and liberty for all."
  formable_news.16.a:0 "We support our TRUE chancellor!"
  formable_news.16.b:0 "Griffonia breathes a sigh of relief."
  formable_news.17.t:0 "First Elections in Griffonia"
  formable_news.17.d:0 "[THIS.GetNewspaperHeader]After the signing of the new constitution, River Swirl announced that elections will be held in one year, after a brief period of reconstruction and reconciliation across the continent. To the shock of many, she also announced that she would not be running in the next election, out of fear of becoming another Limelight. Already, all across the nation, new parties and new politicians are being formed. Most popular is the Unified Republican Front, a broad harmonic party representing republicans from all major powers. However, another popular party is the Proles' Progress Party, led by former Proles of Marelandia, and popular across the Herzland is the Social Democratic Alliance, led by Hera Eichberg. In the end, all look upon Griffonia not with fear, but, for once, with hope for a new dawn."
  formable_news.17.a:0 "The rivers run clear."
  formable_news.18.t:0 "Order and Justice"
  formable_news.18.d:0 "[THIS.GetNewspaperHeader][FROM.GetLeader], sole chancellor of [FROM.GetNameDef], promised when [FROM.GetLeader.GetSheHe] was elected that [FROM.GetLeader.GetSheHe] would have Griffonia secured, to protect the ponies of the Riverlands. Now, over twenty years since her election, [FROM.GetLeader.GetSheHe] has fulfilled the promises [FROM.GetLeader.GetSheHe] made on election day. With MARESOC and the Empire kept fully occupied by puppet governments, no threat will come to [FROM.GetNameDef] ever again. In a surprise move to all, and to disprove the ancient criticisms from River Swirl of ignoring democracy, [FROM.GetLeader] declared a snap election. After the largest turnout in Riverland history, votes were quickly tallied and, from all corners of the Riverlands, came a resounding democratic cry. Over ninety five percent of all votes were for [FROM.GetLeader] and [FROM.GetLeader.GetHerHis] party, with the remaining five percent split amongst parties too small to get seats, meaning that, for the first time in history, every seat in [FROM.GetNameDef]'s legislature is held by the same party. In [FROM.GetLeader.GetHerHis] victory speech, Limelight thanked the citizens of the Union: "The voice of the Riverpony has never been clearer! I love democracy. I love [FROM.GetNameDef]. This trust you have vested in me shall not go unpaid! Continue to trust in me, and together, we shall have freedom! We shall have security! We shall have peace!""
  formable_news.18.a:0 "For a safe and secure society!" #RCT only
  formable_news.18.b:0 "An empire in all but name."
  formable_news.19.t:0 "Ascension of [FBK.GetLeader]"
  formable_news.19.d:0 "[THIS.GetNewspaperHeader]Farbrook, unifier of the Hill Pony nations, was a backwater on the world stage until recently. Having pushed back and taken over the exiled River Federation, the Kingdom of Farbrook set their eyes south. Using the distraction caused by the three way war on Griffonia, Farbrook launched an attack on the River Union, pushing steadily into the Riverlands. In the aftermath of their conquest, Farbrook has been met by much resistance, by ponies and other creatures who worry that they'll be exploited. Today, to calm fears, the King of Farbrook held a new coronation, in Rejikograd. In a grand ceremony, a new crown was placed upon his head, and the Kingdom of Farbrook was declared a thing of the past. For now, a Kingdom of Ponies rules the east. Upon being questioned why he chose to still be a King instead of an Emperor, the King responded "Look west, for the fate of emperors in this land.""
  #formable_news.19.d:0 "[THIS.GetNewspaperHeader]Since it repelled the landing of its former allies turned would-be-invaders, [FBK.GetNameDef] has steadily taken advantage of any situation that it could find to unify the ponies and other creatures of the Riverlands under one banner. Although outnumbered by [RCT.GetNameDef] and the griffons, [FBK.GetLeader] has led [FBK.GetLeader.GetHerHis] forces to victory against [RCT.GetLeader] and restored peace to the Riverlands. As a sign of respect and to assuage fears that [FBK.GetLeader.GetSheHe] will be like [RCT.GetLeader], [FBK.GetLeader] was crowned as the River Ponies' new monarch. While some protested outside, [FBK.GetLeader] has promised prosperity and freedom for [FBK.GetLeader.GetHerHis] new subjects. When questioned about the choice to remain a kingdom, [FBK.GetLeader] was quoted as saying, "You need only look west to see the fate of all emperors.""
  formable_news.19.a:0 "The far brook becomes a near river."
  formable_news.20.t:0 "Vitória!"
  formable_news.20.d:0 "[THIS.GetNewspaperHeader]Celebrations today ring out in the islands of Macawia, all across the favélas and in the tallest ivory towers of power, all Macaws celebrate their recent victories. The reclamation of their eastern lands and their revenge against the Chitali deer have reminded the world of the power hidden in the brave island nation. The ports fill with spice, silk, and cotton from the Chitali treaty ports, being exported to every willing buyer across the land. In a public declaration, the Macaw government has declared today a national holiday, Dia Da Vitória, the end of the decades of Macawian humiliation at last."
  formable_news.20.a:0 "Viva Macawia!"
  formable_news.21.t:0 "The Zonician Dream"
  formable_news.21.d:0 "[THIS.GetNewspaperHeader]North Zebrica lays at rest from the ever present cold war between Colthage, Chiropterra, and Hindia, as finally, Colthage has emerged victorious. A ceremony is being held in the ancient city of Colthage, an ancient ceremony of cleansing. From all across the country, citizens come bearing old flags and banners of the name of Colthage, and they toss them into a grand bonfire in the middle of the capital, burning away all memories of the old. At the end of the ceremony, the Sufrit emerged from the Senate building, and in front of the whole country, unveiled the purple banner of Zonicia, declaring in a grand speech that the humiliation of 490 has been avenged. Zonicia rises once more."
  formable_news.21.a:0 "Zarca's dream achieved."
  formable_news.21.b:0 "They still care about 490?!" #WNG only
  formable_news.22.t:0 "The Chitali Century"
  formable_news.22.d:0 "[THIS.GetNewspaperHeader]In a paper written in 1004 by an Equestrian traveler, they predicted a "Hindian Superpower By 1020." Their claim earned total derision, yet then the world watched as a Hindian state emerged, then they watched as Hindia fought off the perfidious Macaws, then they watched as they held their own against the rising sun of Kiria. The ancient Colthage has been defeated, the divided Llamas are reunified under deer control, and the Way of Fire has been quenched and snuffed out. Chital has claimed its place as the superpower of north and east Zebrica, as the deer rule over one of the larger states in the world. Already, parades and religious festivals have been held in the core lands of the deer, to declare the beginning of "The Chitali Century.""
  formable_news.22.a:0 "The Lotus Blossoms."
  formable_news.22.b:0 "Hindian World Conquest by 1100!" #CTL
  formable_news.22.c:0 "Censor this. Now!" #CHN or NIM
  formable_news.23.t:0 "A Golden Realm"
  formable_news.23.d:0 "[THIS.GetNewspaperHeader]"There is no fury like a Quagga scorned" is an old saying in North Zebrica made to poke fun at the pride of the Quagga tribes. Yet today in Colthage, that saying comes to life. During the chaos of the North Zebrican War, the Colthaginian Republic took the opportunity to attack the Quaggatai, subjugating them and humiliating the proud tribes. While Colthage was too distracted by the bats and deer on their borders, the Quagga have rode into and assimilated the desert tribes, giving them enough to turn around and destroy the republic that subjugated them. The warriors of the Khan have smashed through the Senate of Colthage, and they have looted all the vaults of the patricians, gathering up a hoard like none seen before. Today, in front of a crowd of citizens and warriors, Senators, the Sufrit, and all manner of influential generals have been forced in front of a giant pool of molten gold. The Khan gave a small speech to the spectators, "It was for gold that the Quagga were attacked. It was for gold that these insects lived. The Khan is merciful, Colthaginians. For those who love gold so much? Gold shall be what they know for the rest of their lives." "
  formable_news.23.a:0 "KHAAAAN!" #CTH only, so it will never be seen. Enjoy the easter egg, you snoopy player, you!
  formable_news.23.b:0 "The Khan rides again."
  formable_news.24.t:0 "Decree of the Moonspeakers"
  formable_news.24.d:0 "[THIS.GetNewspaperHeader]Night falls upon North Zebrica, as from Tobuck to Sambar, collaborator states stand side by side under the Chiropterran banner. In New Ayacachtil, the Moonspeakers gather along with the Legionary Council, with debates lasting all through the night and well into the morning, between those wanting to return to Equestria, to those wishing to delay. As the noon sun rises, the conclave ends, and a proclamation is made to all across North Zebrica. The Nightmare shall rise again, and when she does, North Zebrica will be ready. But it will not be just bats answering her call this time, but zebras, llamas, deer, and macaws as well. Za'al, Mahimata, Zal and Zanit, all are merely misinterpretations of the Nightmare's divine presence. Chiropterra now promises to rectify this misunderstanding, undertaking a massive program of religious education in the true nature of the Nightmare, in the hopes that one day, when she returns once more, all of North Zebrica shall march to her."
  formable_news.24.a:0 "The Night to Daybreaker."
  formable_news.24.b:0 "Foals..."
  formable_news.25.t:0 "North Zebrican Marelandia"
  formable_news.25.d:0 "[THIS.GetNewspaperHeader]NEEZEESOC HAS ALWAYS RULED NORTH ZEBRICA.\n\nTHE PROLES APPLAUD.\n\nBIG SISTER SMILES."
  formable_news.25.a:0 "Insanity claims another hoofhold."
  formable_news.25.b:0 "DOUBLE-PLUS GOOD!"
  formable_news.26.t:0 "The Hindian Hegemony"
  formable_news.26.d:0 "[THIS.GetNewspaperHeader]When Chital unified Hindia, all hope was seemingly lost for the Hindian deer, all, except for the small province of Barasingha. When the Kirin marched north to liberate Hindia, the native Hindian deer rose up and joined them, only to be quelled by the meat grinder that was the front line. Undeterred, though, the Hindians and Kirins marched north once more, and in a grand war, reclaimed all of Hindia, to be ruled by a free Hindian power. When Kiria refused to give up control over the state, Barasingha was forced to fight for their freedom once more, beating back the Kirin once and for all, ensuring a truly Hindian superpower across all of east Zebrica. In a grand ceremony, Jambudipa, the native Hindian name for eastern Zebrica, was given as the name of the new state."
  formable_news.26.a:0 "A Raj unfettered."
  formable_news.27.t:0 "The Harmonic Hegemony"
  formable_news.27.d:0 "[THIS.GetNewspaperHeader]When Daybreaker consumed Celestia and Equestria fell to supremacy, many believed that Harmony had truly died in the world. As cults to dead emperors, dead states, dead Nightmares, and dead Proles spread across the land, this belief seemed to only grow stronger. Yet in Vermillion, the Way of Fire has persevered under the Matriarch's watchful eye. With a calm hoof, the Kirin have tamed the south-east, with a watchful eye, they freed the Hindians from Chitali rule, and with nary a spark, Kiria has become a bright beacon of harmony all across the world. In a grand ceremony held in Vermillion, leaders from all across the Kirin sphere of influence came and offered sacrifices to Concord in a magnificent ceremony. In the end, all of the sacrifices were gathered together, as Centaur steel, Hindian dye, Zeblu gold, and Griffon gems forged a grand crown, presented to the Matriarch of Kiria. With the crown placed upon her head, she was granted a new title by all those thankful for the harmony brought to them: Hegemon of Eastern Zebrica."
  formable_news.27.a:0 "A bit of light to the world."
  formable_news.27.b:0 "Imperialists hiding behind curtains."
  formable_news.27.c:0 "Disgusting."
  formable_news.28.t:0 "Kiria Burns"
  formable_news.28.d:0 "[THIS.GetNewspaperHeader]The dynasty has fallen. Millions have burned. Fire rules the land.\n\nNothing remains."
  formable_news.28.a:0 "Tragedy in Zebrica."
  formable_news.28.b:0 "Ashes to ashes. Dust to dust." #KXN only
  formable_news.29.t:0 "The Third Roaman Declaration"
  formable_news.29.d:0 "[THIS.GetNewspaperHeader]The city of Roam rests in ruins, its grand marble buildings and streets of gold pockmarked by artillery fire and bullet holes, memories of the recent Chrysanthemum Empire conquest. The legions march down the streets in a grand triumph, carrying a pavilion between them, upon which stands their great Emperor, come to claim what is his. In front of the ruined Senate, the Emperor steps onto a stage, cameras flashing as other members of the press try to record the moment forever. It is no grand ceremony, yet still, purple banners flap in the wind, and the streets remain absolutely silent as the Emperor is approached. A Centurion approaches, bowing, and presenting what he carries, the restored Laurels of Roam. On the other side approaches another Centurion, bowing and presenting the Diadem of Chrysanthemum. The Emperor places the laurels right above his ears, and then takes the diadem, placing it on his head, and looking into the crowd. He gave us no speech, just one sentence."
  formable_news.29.a:0 ""The Kaiser returns. Roam lives.""
  formable_news.30.t:0 "The Eastern Zebrican Synthesis"
  formable_news.30.d:0 "[THIS.GetNewspaperHeader]Many were surprised to see the small state of Talarayi emerge from the jungles of south-east Zebrica, and many more were surprised to watch the small state somehow defeat the mighty power of Kiria. Many foreign observers have claimed that the new power will collapse before long, with its religious-flavored socialism falling apart from the multiple faiths they owned. Those theories were proven wrong today, as in the city of Vermillion, the leaders of Talarayi met with Rising Sun, a famous Kirin communist who aided the Grand Gallop Onward. As their meeting concluded, the state of Talarayi has announced a change, no longer shall they be Talarayi, but Talarayi shall now be a co-equal state in a new East Zebrican Union. No longer shall the religious leaders have power, as instead, elections will be held across the country, a grand experiment in a form of democratic socialism not ever seen on such a large scale. As the tribal state modernizes and finds synthesis with the modern world, international observers wonder what's to come next for them."
  formable_news.30.a:0 "Freedom in the East."
  formable_news.30.b:0 "Kiria lost to a bunch of savages?"
  formable_news.30.c:0 "They can't be free without Big Sister."
  formable_news.31.t:0 "The Red Republican Revolutionary March"
  formable_news.31.d:0 "[THIS.GetNewspaperHeader]The East Zebrican Union has conquered more of the east, establishing equal, democratic socialist republics within them, becoming the dominant power in Zebrica. A nation-wide referendum was held over the past month, with voters coming from Roam to Fragrance to vote on the future of the Union. In a resounding vote, the people have called for liberation of all of Zebrica, with a vote of seventy-five percent affirming their desires. In a grand speech, the East Zebrican Union and its federative system was demolished, and a new system declared a unitary democratic state, the Republic of Red Sands. Promising political and economic freedom, with democracy in both the workplace and in the voting booth, the newly minted Republic has begun to march across the continent. Already, creatures in major cities across the continent work with local communist and democratic insurgents, vowing cooperation with the Republic, for a free, red, Zebrica."
  formable_news.31.a:0 ""Give them freedom, or we give you death.""
  formable_news.32.t:0 "Griffons from the Ashes"
  formable_news.32.d:0 "[THIS.GetNewspaperHeader]The South Zebrides were colonized a long time ago by Griffon adventurers, seeking gold and glory in south-east Zebrica. These lucky griffons were forced to do nothing but watch as their homelands turned to chaos and madness, as the Empire turned to a cult, as the south and west was subjugated by mad communists, unable to do anything but watch. Yet a Griffon's heart always beats for home, and slowly, the exiles have made their way back home. The Griffon adventurers, the Wingbardian Exiles, what remained of Aquileia, all marched as one to reclaim their home. Today, in a meeting in Rottendedam, the exiles divided their homelands once more, marking the return of Herzland, Wingbardy, and Aquileia. All immediately signed non-aggression pacts, defensive pacts, and promises of peace and sanity, wanting for Griffonia to never go to war again. No grand celebrations were held as the exiles returned home. Much remains to be rebuilt."
  formable_news.32.a:0 "The prodigals return."
  formable_news.33.t:0 "The Centaurs Roam"
  formable_news.33.d:0 "[THIS.GetNewspaperHeader]When the Ostrocentauric Kingdom rode through Roam, many Roaman citizens feared for the worst, and awaited bloody revenge from the scorned centaurs. Yet, to the surprise of all, the King of the Centaurs did not seek revenge on the empire that conquered half his homeland. Instead, in a mighty speech held in front of the repaired Senate, the King spoke of the power and might the Roaman spirit had proven to have, when it destroyed the Ancient Pact, routed the Gargoyles, and destroyed the old Centaurian Kingdom. Yet said spirit proved weakened by the corruption of the Republic, without a strong autocratic figure to guide the wisdom of the Senate. To the shock, and joy, of all in Roam, the Centaur King declared not the destruction of Roam, but a new Roam realm. The wisdom of the Senate shall be preserved, given direction by the incorruptible and powerful Rex."
  formable_news.33.a:0 "Synthesis."
  formable_news.34.t:0 "The Roaman Dictat"
  formable_news.34.d:0 "[THIS.GetNewspaperHeader]In the marble halls of Roam, Senators, elected from its newly conquered lands, have come together to proclaim the return of a reunified Roam. Many still remember the collapse of Roam, with the west evolving into a republic as they fought off the remnants of the east, and the encroaching Kirin. After many popular campaigns, putting down the Centaur monarchists, the tribals and hordes that appeared in the south-east, and rogue legions fighting for monarchy once more, and after reclaiming the lost land of Zeblu, Roam has clawed back all its lost lands. In a grand proclamation, all Senators agreed to the rebirth of Roam, now the Roaman Republic, and they declared a grand golden age's beginning. Already, the legions mobilize, and many rumors spread in the streets of greater ambitions for the reforged state."
  formable_news.34.a:0 "Roam Invictus."
  formable_news.35.t:0 "Pax Roamana"
  formable_news.35.d:0 "[THIS.GetNewspaperHeader]In the wake of [FROM.GetNameDef]'s vicious conquest of [KIR.GetNameDef], [FROM.GetLeader] held a special session of the Roaman Senate, where they voted on the future of [FROM.GetNameDef]. What follows is [FROM.GetLeader.GetHerHis] proclamation after the session concluded:"The Kirin lay defeated, already their liberated puppets flock to the Legions, as scarlet banners fill the streets of Vermillion, and are proudly beared across all of the east. In a vote of 96 to 4, from the glorious Senate, I have been chosen to proclaim to all listening the intentions of the glorious Roam. For too long, Zebrica has been divided by war, picked apart by monarchs, tyrants, or mad states of cultists and communists. In the east, we have peace under the scarlet banner, under the watchful eye of our Legions, under the popular rule of the Senate. Soon, creatures of Zebrica, this peace shall come to you as well. Zebrica will have peace, and the scarlet banner shall fly across every city on the continent. Do not resist, lest peace be built upon a pile of bones. To all, I declare today the start of our peace, the start of a Pax Roamana.""
  formable_news.35.a:0 "Bold words."
  formable_news.35.b:0 "Ready our defenses!"
  formable_news.35.c:0 "Gloria!"
  formable_news.36.t:0 "The Stewards of Maregypt"
  formable_news.36.d:0 "[THIS.GetNewspaperHeader]Many still remember when the venerable realm of Maregypt, home to one of the oldest civilizations in the world, was partitioned by its neighbors. With its western half taken by the Abyssinians, its south by Neighile, and the center by a nationalist revolt against their rule, many experts predicted that Maregypt's long reign had finally ended. However, over the past years, Maregypt has retaken its land piece by piece, even defeating and humiliating the rising power in Abyssinia. With their lands reclaimed and north-western Zebrica under their watchful eye, Maregypt is a realm reborn. Already goods flow from the Great Lakes through the Neighile, and trucks laden down with Abyssinian gems and gold come from south and west, as Maregypt becomes one of the largest ports in the region once again. Already, many have begun to call the city the "Entrepôt of stable Zebrican commerce.""
  formable_news.36.a:0 "Never lose hope."
  formable_news.37.t:0 "A Southern River Federation"
  formable_news.37.d:0 "[THIS.GetNewspaperHeader]The Neighile Republic, once a rump state stuck between Maregypt and the Great Lakes, has surprised many observers through campaigns of rapid conquest. The young republic has claimed all of the Great Lakes and Maregypt, instituting welcome republican reforms and acting as stewards to the rivers coming from their lakes. Now calling themselves the Rivers Federation, after a short stint as the Rivers Republic, many merchants and traders have reported annoyance with the country. Apparently, many items that were supposed to go to the River Federation have, instead, gone to the Rivers Federation, causing quite the mix-up due to their similar names. Neither Federation has commented on this issue."
  formable_news.37.a:0 "Could they have chosen something more original?"
  formable_news.37.b:0 "It's a work in progress!" #NDR only
  formable_news.38.t:0 "Prepare for New Management"
  formable_news.38.d:0 "[THIS.GetNewspaperHeader]Good morning/afternoon/evening, INSERT NAME HERE,\n\nWe are the Illuminate, you will find us in Central Zebrica, in a great state. We are happy to inform you that we will soon be conquering INSERT COUNTRY HERE. We have already infiltrated the highest levels of your government, you will not know who, you will not know when they will strike, this is on purpose. Your goal is to not resist, it would be foolish. We are coming, and we expect you, INSERT NAME HERE on the streets, applauding the new system you will operate under. Do not resist. Everything will be okay. It's time for a New World Order."
  formable_news.38.a:0 "Are you ready?"
  formable_news.39.t:0 "Coronation of the Zebrican Emperor"
  formable_news.39.d:0 "[THIS.GetNewspaperHeader]One of the scant few remnants of the Storm King's reign over Zebrica, Highstorm, a rump state in the deserts, has proven itself a worthy successor to the Storm King's legacy, and has rejected it entirely. Already a small ceremony has been held to crown a King, but the ceremony was not report worthy, on purpose, as the King immediately set his eyes on the unified Storm Kingdom. After a bloody war, the King and his forces have marched into the Eye of the Storm, claiming the old Storm King's crown. In a grand ceremony, the King held up the old crown, and in a single motion, crushed it in front of cheering crowds. He gave a rousing speech to the audience, with a few notable quotes, "The Storm King was weak, his successors, more so, concerning themselves with gold and crowns! But I am not weak, I am stronger than any who have come before, any petty King, any arrogant Emperor! One as strong as me needs no crown, needs no accessory to prove their strength! For today, I have become mighty, today, I am High Emperor of all Zebrica!" International reactions are mixed."
  formable_news.39.a:0 "What a waste of a good crown."
  formable_news.39.b:0 "I admire his strength!"
  formable_news.40.t:0 "The Arabian Peace"
  formable_news.40.d:0 "[THIS.GetNewspaperHeader]The realm of Karkadannistan was a realm left in partial ruins after its conquest of its three western neighbors, needing to spend years rebuilding and building compliance with local ponies. The horses of Karkadannistan watched in suspense as their rivals and brothers in Saddle Arabia were overtaken in religious fervor by the Caliph, yet relations remained mediocre. Until one day, the Caliph denounced the realm of Karkadannistan, declaring them heretics for not joining the Caliph and allowing temporal power to rule over religious. Ever since this denouncement, the realm of Karkadannistan has vowed to become the only Arabian state, and thus they rode to the east and to the north, along the coast, their forces unmatched, until eventually they knocked down the gates of the Caliph. In a grand ceremony confirming their primacy in Arabia, it has been declared that the country is now to be named the Thalassocracy of Arabia, the name a grand symbol of their prevalence over the Caliph."
  formable_news.40.a:0 "The Horse-Lords settle once more"
  formable_news.41.t:0 "First South Zebrican Elections Held"
  formable_news.41.d:0 "[THIS.GetNewspaperHeader]In the aftermath of the Storm King's defeat, a new power arose in the Great Lakes, [FROM.GetNameDef], unifying the Great Lakes under a single republic. Surrounded on all sides by threats, the republic quickly expanded, freeing creatures from the oppression of the Storm King, from the poverty of the desert, from the rough Legions of Roam. With all of the south under one banner, new elections have been announced, with many parties already emerging. The Great Party of Zebrica, supported by most in the Great Lakes and with most incumbents under it, seems to be the main forerunner. However, the Party Roamana, supporting a bloody continent-wide conquest with support from Roam, the Intervention Bloc, a harmonist party supporting foreign intervention for harmonist powers, and the Aorandan Supporters for Socialism, democratic socialists with support from the workers, have emerged as potential opposition parties."
  formable_news.41.a:0 "A new superpower in the world."
  formable_news.42.t:0 "Rise of a Holy State"
  formable_news.42.d:0 "[THIS.GetNewspaperHeader]The horses of Yemane had long been kept under the yoke of Abyssinia, yet in a mighty war, they reclaimed their freedom from the strong western Zebrican power. In order to protect their newly found freedom, the Emir waged war against their neighbors, destroying the powers in the Great Lakes and the Maretanians. In the face of their victory, a grassroots movement has sprung up, declaring the Emir not just a normal horse, but instead a demigod, a prophet sent to lead Yemane out from under the Abyssinian yoke. While at first just a small cult, each victory caused more converts, until eventually, the Emir himself invited leaders of the cult to a talk. In the aftermath of that talk, the Emir has emerged, declaring that they are no longer just an Emir, but a Sharif, blessed by the divine. Many question how this religious turn will affect the country."
  formable_news.42.a:0 "How will the Caliph respond?"
  formable_news.43.t:0 "Holy War Consumes Zebrica"
  formable_news.43.d:0 "[THIS.GetNewspaperHeader]Much of Zebrica in the past years has fallen under control of a Saddle Arabian "Caliph," originally only a secular title, but one that has gained religious veneers after growing theocratic sentiment has swept the Pranshadun Caliphate. Many secondary powers, from Abyssinia, Aronda, Roam, and the Storm Kingdom have fallen under the control of the Caliph, their creatures turned towards belief in the new faith of the Caliph as his religious attitudes spread like wildfire. In a small speech given to members of the international press, the Caliph announced that the country shall now reflect his goals, and simply be called Caliphate, with no adjectives, for the Caliph's holy control is without restriction or question. When a journalist asked the meaning of this change, the Caliph revealed his true intentions: the full conquest of Zebrica under his rule."
  formable_news.43.a:0 "Peace be upon him."
  formable_news.43.b:0 "The opiate of the masses."
  formable_news.43.c:0 "Another false religion." #Solarist/Solar Flare only
  formable_news.44.t:0 "The Second Karthinian March"
  formable_news.44.d:0 "[THIS.GetNewspaperHeader]When MARESOC conquered the Kingdom of Wingbardy, their government fled, taking over Les Meridiennes and forming a government in exile. Beakolini, taking over Hippogriffia and aligning with his old ally in Colthage, has returned from exile in grand fashion. All across former Marelandia, screens that once held the unflinching face of Big Sister are replaced by a live feed of Beakolini riding a tank through the central boulevard of Karthin. All across the country, griffons and ponies listened as he announced the rebirth of Karthinia, the full destruction of MARESOC, and the victory of fascism over degenerate communism. When the speech ended, the screens didn't show Big Sister anymore. Only the watchful eyes of Beakolini, backed by dozens of "Si!'s" of approval."
  formable_news.44.a:0 "Si! Si! Si!"
  formable_news.45.t:0 "Storm Market Appears Bullish"
  formable_news.45.d:0 "[THIS.GetNewspaperHeader]Investor's Weekly: Investment in Zebrica!\n\nThe Storm Kingdom, always a safe bet for investment into their many industries, has exploded their portfolio recently, performing hostile takeovers of many less friendly industries around them. Profits are soaring for those who bet on the Storm Kingdom's stock! In an announcement, the Storm King has announced resignation and the destruction of the unprofitable monarchy system, and announced that the Storm Industrial Conglomerate will be a country-sized company, open for investment! Profits are sure to continue soaring, 10/10 experts recommend immediate investment into the Storm portfolio before it's too late! If you've ever wanted to make more money than Daybreaker could spend in a year, or ever wanted to influence a country, make sure to buy stocks and attend Storm Stockholder Meetings!"
  formable_news.45.a:0 "Five million to the Storm!"
  formable_news.45.b:0 "What a joke!"
  formable_news.46.t:0 "Unified Zebrican Market Formed!"
  formable_news.46.d:0 "[THIS.GetNewspaperHeader]Investor's Weekly: The UZM, What Is It, How Do I Profit?\n\nWith sky-high profits from its shareholder's guidance, the Storm portfolio has grown to consume all other industries on Zebrica, through corporate mergers and hostile takeovers. The "UZM," Unified Zebrican Market, is the new term for the Storm portfolio, representing the free trade of goods all across Zebrica. This means that your investment opportunities go through minimal red tape, have minimal taxes, and due to a lack of tariffs and a state of complete free trade, maximal profit! Make sure to target your investments not just in businesses that will trade overseas, which might be subject to taxes, but try to target businesses and industries that only trade within Zebrica. Many experts recommend investing into military equipment industries! Storm Sturm, Thundercloud Aeronautics, and Typhoon Bay Industries all are reporting maximal profit from their military production, invest now, before you regret missing out!"
  formable_news.46.a:0 "We're rich!" #STM only
  formable_news.46.b:0 "I'm gonna be rich!"
  formable_news.46.c:0 "What about the workers?"
  formable_news.47.t:0 "Albion's Banners in [3.GetCapitalVictoryPointName]"
  formable_news.47.d:0 "[THIS.GetNewspaperHeader]In the chaos following Celestia's downfall into Daybreaker, many believed that Daybreaker would one day reunify the breakaway states. Many others hoped instead that Cloudsdale, Central Equestria, or even the South-East would unify them. Many others bet that the Changelings would sweep in before long to take what remains. No serious analyst could have predicted reality, as earlier this week, forces from Albion marched into the major cities of eastern Equestria, ending with a grand unveiling of the red revolutionary banner over Canterlot Palace. Analysts and foreign media have swarmed Canterlot in recent days, while the leaders of Albion have met in constant debate with the leaders of major unions across their conquered lands. To all of our luck, they have finally agreed upon a manner, emerging from within the palace to unveil a new name, more befitting their status. That name being-"
  formable_news.47.a:0 "A clown takes center-stage..."
  formable_news.47.b:0 "Long live our multi-faceted home!"
  formable_news.48.t:0 "Albion Crushes Changeling Oppression!"
  formable_news.48.d:0 "[THIS.GetNewspaperHeader]Words. . . Betray the mind, which is left boggled, bewildered, and unable to comprehend the series of events transporting on Equus this day. Language cannot properly capture and convey the feelings experienced as the red banner of Albion, or, whatever name they call themselves now, rises over the streets of Vesalipolis. Indeed, not many words are spoken, all around there are nothing but cheers and shouts, as the deer, bears, and all other oppressed species rejoice, while the changelings mourn the loss of their hegemony. Already, union leaders have been brought to a meeting together to discuss the status of the country, preparing to move this schizophrenic's nightmare into becoming a properly organized country. Many chant that freedom has come for them at last, one must wonder if they know that Albion has never had elections. The leaders have emerged from their secluded debate, holding with them a banner, to proclaim the nature and name of their new state. They say it is-"
  formable_news.48.a:0 "Surely Stalliongrad shall reign them in?"
  formable_news.48.b:0 "We need to reign them in. Now."
  formable_news.48.c:0 "What's red and black all over? A communist changeling!"
  formable_news.49.t:0 "The Promise of Freedom"
  formable_news.49.d:0 "[THIS.GetNewspaperHeader]The last bastion of sanity on Equus has fallen to the red banner of Albion, as the rump state has slowly progressed to the top power in the entire world. All across the continent, griffons, deer, buffalo, yak, penguins, bears, changelings, ponies, and dragons have come together, side by side, in Albion's armies. Their endless red banners march down the streets of every city, guns and artillery alongside the trundling of tanks moving to every coast, looking hungrily upon the rest of the world. It's no secret that they won't be content with Equus alone, Albion is coming for all nations, and none can stop them alone. If any wish to stop their call for "freedom", then they must band together as one, or they will fall like Chrysalis, Sinister, and Daybreaker have. There is little other hope for our world to remain sane. Their leaders have emerged once more to announce a new name, debated over for two weeks, declaring them the-"
  formable_news.49.a:0 "Absurd! They'll collapse within the year."
  formable_news.49.b:0 "Freedom forever! Freedom for all!"
  formable_news.50.t:0 "Albion Marches on Griffenheim"
  formable_news.50.d:0 "[THIS.GetNewspaperHeader]Griffonheim has fallen for a second time in living memory, first consumed in nuclear fire, now drowned in the red tide of Albion. The Empire has fallen, and the hardy homeland of the Griffons is in the midst of being harried by red forces. In a grand exhibition, trusted forces of Albion wearing anti-radiation suits forced the Archons and Prelates of the Empire into the ruins of Griffonheim, breaking their wings and then tossing them into the deep crater that remains of the Imperial Palace, leaving them to die to either the fall or the radiation lingering. The only surviving members of the slaughter are a few Prelates of Eyr, many of whom ran large charities or ran literacy programs for peasants across the Empire. In a large debate, they were deemed "socialist enough" to live, and, according to said debate, "Eyr is a socialist anyway." A new collaboration state has been founded in the remnants of the Herzland, being called-"
  formable_news.50.a:0 "A dying empire's last gasp."
  formable_news.50.b:0 "All socialists are the true Eyr!"
  formable_news.51.t:0 "Formation of the Truly Free League"
  formable_news.51.d:0 "[THIS.GetNewspaperHeader]The Evi Valley was the last home of those who resisted encroaching radicalism in Griffonia, but, to the dismay of many outside observers, radicalism has finally made its home in Evi. Many expected sights reminiscent of Redglad's Revolution in Prywhen long ago, of blood furrowing the fields and rivers running red. Yet to the shock and relief of many locals, the armies of Albion have given them something unique, a democracy. Due to the banning of fascists and oligarchs from running, which is to say, every previous leader of Evi, the choices for leaders were not many, but after a long vote, the disparate griffons of the Evi Valley came together and chose Albion's endorsed candidate, the brave-"
  formable_news.51.a:0 "Time to try more rice farming!"
  formable_news.51.b:0 "One insane leader for another."
  formable_news.52.t:0 "Révolution Returns To Rila"
  formable_news.52.d:0 "[THIS.GetNewspaperHeader]Celebrations fill the streets of Rila, as grateful ponies and griffons welcome the liberation from Albion from their Marelandian overlords. Marelandia had banned foreign journalists from entering their territory, and it's clear to see why. All across the city are sprawling slums with little to no infrastructure, beyond that which is used to surveil and keep the lower class orderly. The former Proles are thrown bread by soldiers riding on the tops of tanks, eating their fill as gunshots fill the air. Party members are dragged out from their dwellings and their apartments and are shot by ancient griffons, who still remember the revolution so long ago. Amidst the chaos, Victor Allard and Sugar Crepe, exiled revolutionaries who fled to Nouveau Aquileia when the revolution was crushed, give loud speeches to the listening Proles, promising peace, prosperity, and revolution once more. It seems obvious that one of these two will become the leader of the newly founded state of-"
  formable_news.52.a:0 "Better Albion than MARESOC."
  formable_news.52.b:0 "Révolution, madame, monsieur!"
  formable_news.53.t:0 "Revolutionary Decree of North Zebrica"
  formable_news.53.d:0 "[THIS.GetNewspaperHeader]Aris, a Kingdom in chaos, Chiropterra, the Nightmare's most loyal, and Colthage, ancient protectors of the north, have, in one move, fallen totally to Albion's forces. North Zebrica is already filled with remnants of Chiropterra and Colthage fighting against the occupying force, yet in Aris, it would seem the Albion state has found friends. Princess Skystar and Posada, a monarch and a theorist, have come together to help lead an occupation government for the north. The presence of a monarch has slightly calmed the remnants of Warzena and Chiropterran conservatives, more willing to serve a Hippogriff monarch than pony communists, whereas Posada has calmed the Seaponies, ensuring safe waters for Albion's ships. There are rumors of a third force, an old mare named Zarishat Zeirutid, sister to a famous Coltvan revolutionary of days gone. Accordingly, she has calmed Colthage down by promising to become governor of them, working alongside Posada and Skystar. After much debate in Mount Aris, the new state has emerged with the title of-"
  formable_news.53.a:0 "Three superpowers, gone in a blink..."
  formable_news.53.b:0 "Three superpowers, gone in a blink!"
  formable_news.54.t:0 "Proper Pettable Peoples Protectorate"
  formable_news.54.d:0 "[THIS.GetNewspaperHeader]The defenders of Chitalian Hindia fell to the forces of Albion, the sub-continent unable to survive the onslaught of a full continent of power. In the power vacuum occupation has left behind, a new type of government has been made, one which many outside observers question. Deemed a "cuteocracy", the leaders of Albion claim it is an experiment in socialist governance, where instead of the dictator of the proletarian being chosen by vote, they are instead picked by. . . How fluffy and cute they are. The only requirements to become leader is to be socialist, anti-fascist, and be cuddly and cute. Already there are rumors of cuddle-offs being organized across the continent, where creatures compete against each other in cuddling to the death, and whoever emerges alive, is the most cuddly. It seems like the most cute of them all, and thus the leader of the country, has been declared to be-"
  formable_news.54.a:0 "How objective is this system?"
  formable_news.54.b:0 "Cuddle-off tickets are five bits. No refunds."
  formable_news.55.t:0 "Pax Socialisma"
  formable_news.55.d:0 "[THIS.GetNewspaperHeader]"The Roaman forces lay defeated, already their liberated puppets flock to the free banners of Albion, as scarlet banners fill the streets of Roam, new scarlet banners, not the old ones, but ours, Albion's, since Roam also had scarlet banners. They are proudly beared across all of our land. In a vote of everyone agreeing, from the glorious Senate Union of Socialist Senators, I have been chosen to proclaim to all listening the intentions of the glorious Albion-occupied Roam government system that also includes other states. For too long, the world has been divided by war, picked apart by monarchs, tyrants, or mad states of cultists and not communists. In here, we have peace under the scarlet banner, under the watchful eye of our unions, under the popular rule of the me. Soon, creatures of everywhere, this peace shall come to you as well. Everywhere will have peace, and the scarlet banner shall fly across every city in the world. Do not resist, lest peace be built upon a pile of bones. To all, I declare today the start of our peace, the start of a Pax Socialisma. Also I did not steal my speech from the previous Senator and if you say as such then I will sho-""
  formable_news.55.a:0 "Plagiarizing a dead stallion's speech? Shameful."
  formable_news.55.b:0 "Intellectual property doesn't exist!"
  formable_news.56.t:0 "Statement of Support of Southern Socialists"
  formable_news.56.d:0 "[THIS.GetNewspaperHeader]With Albion's occupation of the former Storm Kingdom, many radicals have taken their chance to get into leadership. Radicals from all across the realm come to the Eye of the Storm and have called for the destruction of all memories of the Storm Kingdom, every piece of its history, its culture, and its obsessions, including with capitalism. To this end, local administrators have formed a state including all these radicals, and have taken to trying to fix the main fixation of the Storm Kingdom, which is to say, the near eternal storm that surrounds the capital. Day by day, soldiers and militia members raise their guns into the air and shoot at the storm clouds, with bullets and artillery shells failing to stop the storm's eternal existence. Rumor has it that the local leaders have requested a nuclear device be brought to finally kill the storm. In other news, lead precipitation and explosive ordnance falling from the sky have been reported in-"
  formable_news.56.a:0 "What a bunch of maniacs."
  formable_news.57.b:0 "We support our southern comrades!"
  formable_news.57.t:0 "Complete Caliphate Capitulation"
  formable_news.57.d:0 "[THIS.GetNewspaperHeader]West Zebrica was home to two mighty superpowers, the newly risen Abyssinia, and the newly emboldened Saddle Arabia, yet both were unable to stand up to the pressure of Albion. The Caliphate in Saddle Arabia put up an unmatched fight, with many of the Caliph's warriors dying in suicide charges rather than seeing their holy Caliph be defeated. In the aftermath, Albion has ensured the complete destruction of any reverence remaining for Gomez of Abyssinia and the Caliph of Saddle Arabia. They've imported in hundreds of changeling comedians who travel across the two occupied lands, disguised as Gomez and the Caliph, doing sketch and slapstick comedy with the forms of the two great leaders. Audience reactions are mixed. Critics were pleasantly surprised and said the shows-"
  formable_news.57.a:0 "Snuffed out, just like that..."
  formable_news.57.b:0 "Comedy punches up. Easy to do with cats and horses!"
