l_english:
  ZZZ_eris:0 "Eris"
  lady_of_chaos:0 "Lady of Chaos, Princess of Torment, Queen of Living Nightmares, Eternal Torturer, Maven of Misfortune, Herald of Doom, Harbinger of Harm, Avatar of Adversity, The Coming Catacylsm, Bringer of Strife, Catastrophic Calamity, Duchess of Disharmony, Empress of Terror, Mistress of Manipulation, Unequal Unmaker, Darkest of Lights, Wolf Among Sheep, Inflictor of Tragedy, etc., etc."
  POLITICS_FH_ERIS:0 "§YBorn:§! It's rather rude to ask a lady her age.\n\n§YBiography:§! There you are...\n\nOh, did you expect my idiot cousin, Discord, to be hiding down here, twiddling his thumbs and sneezing some chocolate rain clouds? Or maybe him off playing dungeon master again while WASTING his powers on having FUN or a LAUGH?! So sorry to disappoint. Wait, except not really, because I'm far, far superior to him!\n\nPerhaps you don't know me, but that's exactly what I wanted. The only reason you know my name from this pathetic game is because I decided you could learn it. I am Princess Eris, Lady of Chaos, and someone who's much better suited to be running the show down here than Discord. He really tried, but he kept it so boring in that other—eugh—GAME MOD. He had the gall to be content with a cameo and a pre-approved biography and call it a day.\n\nThat's why I'm here.\n\nWhat do you know of Discord? Hmm? That he likes to cause chaos? But what good is his chaos? Turn a few ponies blue, roll them around like blueberries, and call it a day? Little leagues. Peanut gallery. Tiny brain.\n\nThe purpose of chaos is to cause destruction, and oh, oh ho ho ho, there's plenty of destruction and opportunity for it here!\n\nEver wonder how such a sweet, innocent world as this could turn into such a horrid, despicable, downright tormenting place to live? Could it have been me? Would I do something like that?\n\nNo, actually, because I only just arrived. Truth be told, this looks to be a much more interesting land than my own. Hopping dimensions, never mind traveling between entire mediums of art, is invigorating. I was once naught but lines on a paper, but now I'm pixels on a screen and bits and bytes in a computing machine.\n\nAnd these bits and bytes are going to have so, so, SO much fun. There will be chaos, there will be suffering, there will be death like you have never seen! All will bow before me! And when this world is brought to its knees, I'll have a NEW plaything to test my grandest ideas on! EVERYCREATURE WILL QUAKE AT THE MERE MENTION OF MY NAME!\n\nAt least once I find a way out of this nation..."
