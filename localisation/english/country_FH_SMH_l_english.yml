  ###Leader Descriptions###
  POLITICS_HELINA_FH_DESC:0 ""They burned our town and we will burn their history. Only ash remains of the Western Griffonian Empire."\n\nHelina was only a calf when Highhill’s forces shelled Yakistown. She watched from the ruins as the golden eagles of his Western Griffonian Empire marched through the smoke. That memory did not break her; it sharpened her into a political weapon.\n\nNow the leader of the Smushton Clique, Helina represents the unyielding fury of a generation of yaks who refuse to ever be subjugated again. She is young, bright, and utterly ruthless, using her keen tactical mind to wage war on all things griffon. To her, the Kaiser in Weterheim is not somecreature to be negotiated with, but a disease to be excised. She preaches retribution and the restoration of Yakyakistan to its full, un-smashable glory."
