  ###Leader Descriptions###
  POLITICS_BARNARD_FH_DESC:0 ""We have smashed enough. It is time to speak, to build, and to find a better definition of 'perfect.'"\n\nA former exchange student at Twilight Sparkle’s School of Friendship, Barnard returned to the north with radical ideas: that diplomacy and reform could achieve what hooves and horns could not. When the Western Griffonian Empire collapsed, he pacified the region around former Jak territory not with purges, but with speeches and the promise of a brighter future. He dreams of a modern Yakyakistan, one that trades "smash, crush, break" for stability and thoughtful governance.\n\nHowever, Barnard’s benevolence blinds him. He sits upon a throne surrounded by a council of sycophants, the "Yes-Yaks", who filter the grim reality of his rule and manage his public perception. He believes his reforms are succeeding, unaware that his efforts clash so much with the average yak that it is leading the nation to the brink of war, his inner circle only hoping they can scrape together the pieces after the inevitable splintering."
