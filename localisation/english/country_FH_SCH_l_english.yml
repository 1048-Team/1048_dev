  ###Leader Descriptions###
  POLITICS_CAMILLA_AND_JOHAN_FH_DESC:0 ""A warlord state must be ruthless in war, but meticulous in accounting. We have both covered."\n\nThe Screechers are an unlikely coalition, held together by the pragmatic necessity of war. Johan, the yak, came from a civilian background as a banker. When the Western Griffonian Empire collapsed, he realized that bullets and bread were just as important as barricades. He controls the logistics, the revenue, and the careful exploitation of the region's resources.\n\nHis partner, Camilla, the penguin, is the military might. A conscript in Erwin Highhill's military, she trained from a young age and is a decent commander, understanding how to garner respect through precision and ruthlessness. They despise each other personally: Johan finds Camilla overly militaristic, and Camilla finds Johan too obsessed with spreadsheets, but they are smart enough to know they are doomed apart. Their state is a marriage of convenience where the ledger and the sword must always balance."
