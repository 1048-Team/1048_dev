  ###Character Biographies###
  POLITICS_FH_CHRYSALIS_DESC:0 "§YBorn:§! 1st of January, 930 ALB in Vesalipolis\n\n§YBiography:§! Much can be said about the dread Queen Chrysalis, the Terror of Equus and the Scourge of Harmony. Scholars in the remnant territories of Equestria have debated for years what exactly motivated her to so viciously hate ponykind and its leadership in particular, with theories ranging from general concepts of changeling supremacy to a divine inspiration to be a foil to all that is—or, more accurately, was—good in Equestria.\n\nAt her birth, Chrysalis was the only successful grub of the previous Queen of Vesalipolis, Pupate. Despite her mother's name, her other potential siblings had perished, their eggs unhealthy, shattered, or left outside of ideal gestation conditions. Thus, as the only heir to the throne, she was given attention that far outweighed most other changeling queens. Rather than having to exile or assassinate any potential rivals, she had the security of her eventual ascension as an excuse to practice her machinations elsewhere, beginning with a properly timed intervention in Equestria after Pupate decided to try and play NICE with ponies. In the end, the tensions she helped to build prevented a Vesalipolis-Equestria alliance, and the failure of Pupate lowered her standing among the other hives.\n\nAfter her mother perished under mysterious circumstances, Chrysalis ascended and soon found herself embroiled in war with the more warlike Vraks. Through cunning, she formed first an alliance with them after risking herself to use Vraks' queen as leverage. Such similar actions eventually left her with a united changeling lands in the late 980s, which she turned to Equestria. However, her defeat at the hooves of Cadance and Shining Armor in 1002 was unanticipated, and afterward left her reign tenuous, only solidifying as she promised revenge upon the ponies of Equestria.\n\nThe Great War was the result, which came to a pyrrhic standstill and left her with half of Equestria as her land, one which she soon exploited. Yet the endless love of ponies dried up, and corruption took hold of the rungs of her rule, with the companies that rationed the supply effectively acting as their own queen. After an almost complete revolt in 1044, the slipping grip that she had on Equestria revealed itself, and has left her Hegemony in a fractured state between various protectorates.\n\nMuch like the Hegemony, she has seen better days. Although still snappy, arrogant, and scheming, her enduring rule has left her drained. For days, she can brood in her tower, only emerging when she requires true love to sustain herself, or for new decrees for her ailing empire.\n\nLike Changelingia, she is one, sick bug.\n\n§YPortrait By:§! Ryanboi"
  
