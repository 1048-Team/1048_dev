  ### Ideas ###
  CHN_idea_politic_unified:0 "Divided Politics"
  CHN_idea_politic_unified_desc:0 "The targeted elimination of the other changeling queens has left the regions of Changelingia under control of different governors. They all have their own ideas. Said ideas can be dangerous, especially if they work against the good of the entire hive structure."
  CHN_idea_memory_44:0 "Legacy of the Rebellions"
  CHN_idea_memory_44_desc:0 "At one point, the mere mention of the Wehrmacht would lead any pony on Equus to soil themselves, but that image was shattered when the southern protectorates nearly broke away in a widespread uprising only countered by collaboraters in the government with their own forces. Our troops have forgotten how to wage war, and it will be a long and painful recovery before we can hope to be the terror of Equus again."
  CHN_idea_memory_44_better:0 "Mitigated Decline"
  CHN_idea_memory_44_better_desc:0 "Through extensive reforms and injections of cash, the Wehrmacht is beginning to come out of its spiral into irrelevancy, but there is still much more to do. Most of our soldiers are still too green to effectively fight, and tactics must be updated for the modern era before we can declare ourselves anything but a paper tiger."
  CHN_idea_CHN_economy:0 "The Changeling Economic "Miracle""
  CHN_idea_CHN_economy_desc:0 "Despite all the new land that we acquired in the Great War as well as resources and workforces, the economy has been in a downward trajectory for years, even before the uprisings in 1044 severely rewrote how the Hegemony works together. With love supplies rationed and the majority of the populace sufficing off artificial varieties, it has led to a growing sector to support it, and unhealthier workers that leave our factories working at barely half-capacity."
  CHN_idea_corp:0 "Love Supply Constrictions"
  CHN_idea_corp_desc:0 "We have not extracted new, actual love from our pony subjects in years, which has led to shortages in the love supply that was once commonplace for the poorest of changeling. What is left hoarded by a select number of corporations, who sell to the richest clientelle and control the artificial love factories that now supply our citizens instead. Their immense political power must be broken if we're to ever be a mighty nation again."
  CHN_idea_ref:0 "§GReformist Support: 40%§!"
  CHN_idea_ref_desc:0 "Reformist Support"
  CHN_idea_mod:0 "§LModerate Support: 20%§!"
  CHN_idea_mod_desc:0 "Moderate Support"
  CHN_idea_mil:0 "§RHardliner Support: 40%§!"
  CHN_idea_mil_desc:0 "Hardliner Support"
  CHN_gossamer_hills:0 "Treaty of Gossamer Hills"
  CHN_gossamer_hills_desc:0 "Since we have forced [CRY.GetNameDef] to acknowledge the economic and societal damages that they inflicted upon us from Cadance's and Shining Armor's unprovoked assault, we have received a steady supply of reparations, in resources and industry, to rebuild our nation. So long as the treaty stands, we'll always have them to lean on for support, whether they want to or not."
  CHN_political_infighting:0 "Political Infighting"
  CHN_political_infighting_desc:0 "Changelings thrive on conflict, as it is the only way to gather more emotions upon which we feast. In the aftermath of our Pyrrhic victory against the ponies, three cliques have emerged with the vacuum left by the other hive queens' assassinations: the Reformists, who wish for the [CHN.GetAdjective] to become a greater unifier; the Moderates, who bow to the whims of Queen Chrysalis; and the Hardliners, comprised primarily of Wehrmacht officers and other imperialists who wish to see the Great War concluded and Changelingia dominant upon Equus. Their competing ideas have led to political gridlock, and Chrysalis plays a precarious to keep them in check, lest the entire nation be torn apart in our golden age."
