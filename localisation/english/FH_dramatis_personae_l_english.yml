  ###Events###
  ###Generic###
  FH_dramatis_personae.t:0 "Dramatis Personae"
  FH_dramatis_personae.desc:0 "Throughout the course of development, art is commissioned from fandom artists or provided by the talented ones on the Fractured Harmony team. To clearly show their effort, this event is merely here for those curious to see the artwork of characters in [ROOT.GetNameDef] more clearly, and to see who drew them. Enjoy!"
  FH_dramatis_personae.next:0 "Next page."
