  FH_dramatis_personae_category_desc:0 "See the artwork that helps make a nation. Not all characters have very visible portraits, so this is a way to get a glimpse of all the effort that has gone into the visuals and to give credit to every wonderful artist who has contributed in some way."
  FH_disable_dramatis_personae:0 "Close Dramatis Personae Category"
  FH_get_dramatis_personae:0 "Dramatis Personae of [ROOT.GetNameDef]"

  ###Custom Tooltips###
  ###Put each nation as their own entry. Any portraits you want to show off can be put in here###
  ###Generic###
  FH_only_once_tt:0 "You can only select this option once. After you've seen as many as you like, this category will close upon the next in-game day. The last option moves through pages of portraits. Select any character option to exit out of the event and be done with viewing portraits."
  generic_lorem_ispum_tt:0 "§bLorem Ipsum§!"
  FH_river_song_moment_tt:0 "The following pages of portraits are spoilers for hidden paths. Proceed at your own risk."
  FH_dyx_final_word_tt:0 "§OHey! After this whole shindig, wanna go shank that wench who thought she could steal my lunch money last week?§!"
