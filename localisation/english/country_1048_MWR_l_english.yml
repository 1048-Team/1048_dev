  ###Leader Descriptions###
  POLITICS_IRON_FH_DESC:0 ""Safety is merely a matter of hiring enough loyal guns to stand between you and the inevitable tide."\n\nIron Grasp is a coward by nature and a survivor by trade. When the Western Griffonian Empire fractured and snapped like a stretched rubber band and the red gaze of Sinister Serov in Stalliongrad turned northward, he was the first to kneel, offering New Mirabelle to the communist sphere in exchange for his own life and continued authority.\n\nHis blatant collaboration has made him a pariah among his own people. He has been forced to drain the treasury by hiring costly, professional griffon private military companies to protect him from the very workers he claims to represent. Conniving, paranoid, and perpetually looking over his shoulder, Iron Grasp sits on a precarious throne, a perfect example of a puppet leader whose greatest enemy is his own populace."
