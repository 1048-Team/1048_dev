l_english:
  formable_flavor_event.1.t:0 "Freedom!"
  formable_flavor_event.1.d:0 "On the outside, many would think being leader of Albion was easy, after all, it's the only power left in the world, the leader should have the entire world in their hooves, as every enemy lays dead. This is false. Albion has never struggled against its external enemies, as evidenced by their repeated victories. No, the enemies to Albion are now stronger than ever, as they sit in front of the leader, their shrill voices arguing with one another.\n\nThe storm creature argues against the Great Laker over a border territory, a cacophony of Herzlandish and Aquileian clash over resources to rebuild ancient monuments, and the macaw struggles to breathe as a deer almost smothers him in cuddles. Every single day, every single move of Albion has been restrained by these debates, these fights, these meaningless, horrible agreements that create names larger than the country itself. Many think that Albion is a dictatorship, but that's wrong, it is, and always has been, a committee making the worst possible decisions and somehow succeeding. One can only take so much arguing before they... break.\n\nWith a flick of a hoof and the click of a button, radios scream to life across the country, greeted by the loud debates of their overlords, silenced by the loud shout of the leader. "Listen up!" The cry causes the entire world to go silent for a moment, as creatures both young and old, rich and poor, listen. "Effective immediately, every occupation government is to be annexed into one single state; every governor and every leader other than me is out of a job!" Gasps ring out across three continents. "Effective immediately my position as leader is abolished! All councils and government positions are abolished! All monetary institutions are abolished!" A grin crosses the leader's face. "We shall be stateless, we shall be moneyless, we shall be classless. Is that not what we have fought in service of for so long, comrades? Let's make Marks proud. Today, I declare Albion to a complete, and total, state of Freedom!""
  formable_flavor_event.1.a:0 "Freedom! Freedom! Freedom!"
  formable_flavor_event.2.t:0 "If Any Hope Remains..."
  formable_flavor_event.2.d:0 "I can hear them coming. The others are holding the line, I can only hope for long enough. Once, I interviewed a member of the Upper Party of MARESOC, and I told everyone what they said. I told everyone, all the leaders and nobles, that they were coming. They'd never be satisfied with just Griffonia. But none of you listened. I hope you're hearing this, Chrysalis, Daybreaker, Zarca, all the Kirin priests and all the Chitali Vikingar. I told you to prepare, but you didn't. You tore yourselves apart. So caught up in your own battles, you ignored what was coming. None of your citizens deserve this fate, but you, I'd wish the worst of deaths on all of you. They're coming now, to the last pocket of resistance that still stands. I can only hope others are listening to this message. I hope the world has enough mercy that someone will listen to this last gasp of the free world.\n\nThey've won. The Party has won. Our leaders did nothing about it. I want everyone to remember that when The Party begins to make your life nothing but misery. I've seen what MARESOC does to ponies. I know my name won't be remembered. I know I won't be in any history books. After today, I won't exist anymore. I just have one last thing to say. I've seen the party members and how they act, and above all, I've seen the Proles. Unrestrained, dirty, vicious, but real, more real than anything. I think one day, The Party shall be nothing but a memory, but it won't come from the party members themselves, or the hopeless rebels who cling to the past. If any hope remains..."
  formable_flavor_event.2.a:0 "It's with the Proles."
  formable_flavor_event.3.t:0 "A Fireside Chat"
  formable_flavor_event.3.d:0 ""Good evening, ponies, diamond dogs, and every other creature of the Riverlands. I hope you're all settled in, warm and cozy in your homes. I am, at least, here by my fire, with nothing but a small cup of tea, and this radio. I know many of you have had worries about my soldiers, many of you have lost loved ones in this war, many of you likely don't even remember who I am. My name is River Swirl. Near twenty years ago, I lost an election to Limelight, and, with respect to the will of the ponies, I stepped aside. However, over the next few years, I watched, with horror, as the same democracy that picked Limelight was destroyed by her very hoof. Our principles of freedom, liberty, democracy, dismantled piece by piece. I tried to resist, and for that, I, and those who love freedom, were exiled north.\n\nThis is why the war had to happen, my citizens. The light of liberty is lit by the blood of those willing to fight for freedom, and though I mourn every lost soul in the war for liberty, I will not mourn the victory we've achieved. Many of you will call me a dictator and I don't blame you, but I'd like to make one thing clear. The Riverlands have always been the home of freedom, and enemies surround us, jealous of that freedom. The Empire, our old foe, and Marelandia, a threat like none we've seen before, will come for us. But the light of liberty has no border, no species, no end. So, my citizens, pick up arms and march as one, and together, let us fight for our freedom.""
  formable_flavor_event.3.a:0 "Liberty, light the way."
  formable_flavor_event.4.t:0 "The Prophet of Profit"
  formable_flavor_event.4.d:0 "Heinrich Greytalon had never been to Zebrica before, there was little time, with the Empire demanding all it could to keep safe from the Marelandians and Riverlanders. It was inevitable though that he would come here, the new capital of the world, the Eye of the Storm. Krähe-Stahl would survive this change in leadership, just like it always had. He looked off the side of his ship as they approached the home of the Storm Creatures, surrounded by a constant storm, rain pattering down on a grey coat. For a second, he rested a claw on his chest, where within a pocket laid an idol of Grover, the late Emperor's presence calming him.\n\nElytra sat in a funicular headed to the old palace of the Storm King, a badge on her green coat declaring her a representative of Carapace Motors. Her head is filled with memories of the Siege of Vraks whenever she looks at a Storm Creature. Across from her, Checkmark remembered the Great War, and the fall of Celestia to Daybreaker, her yellow suit proudly proclaiming 'Friendship Express'. She tried not to look at Elytra. Her nose scrunched up from the cigarette smoke of her neighbor, an old stallion in a red suit, here to represent Manesibishi. A scar on his cheek reminding him of Wingfred, of the family he used to have.\n\nBehind the leader argue a zebra from Ochzor Rifle Designs and a Kirin from Dreamboat International, the ends of their mane sparking from anger. Here, in the capital of the world, all come together for another shareholder meeting. They will argue, they will hate each other, holding onto old grudges and old blood spilled. Yet they'll forget it all when profit is on the line. Electronics companies, tank companies, rifle companies, species, rivalries, none of them matter anymore. All are one in the chase of profit, all are one in the chase of prosperity. All are one, under the Storm."
  formable_flavor_event.4.a:0 "It's just good business."
