###Descriptions###
POLITICS_FH_SKYSTAR_DESC:0 "§YBorn:§! 20th of June, 986 ALB in Mount Aris\n\n§YBiography:§! Perpetually cheery and happy-go-lucky, Skystar's life has been marked by hardship after hardship that has marked a long reign as Queen of the Hippogriffs and Seaponies. Although she was still a young chick in her mother's eyes at the time of the Storm King's conquests, when he turned his eyes north to the lands of Maregypt and even the Kingdom of Hippogriffia, Skystar was among the few hippogriffs to desire to stand and fight against him, although her voice, as well as others, were ignored as fear gripped the populace and her mother ordered the retreat to Seaquestria for all. As a final attempt at motivating the populace to stand for what was right, Skystar and a small number of her supporters attempted to block the ways out of the city, given the populace was loaded down with their possessions, but she and the others were arrested and placed under watch for the remainder of the evacuation.\n\nAlthough the differences were initially settled, Skystar remained focused on the world above, and trusted one day that hippogriffs would once again roam the skies and walk on dry land, even if her mother was content with hiding within the safety of Seaquestria. When Twilight Sparkle and her friends came to Hippogriffia to solve a friendship problem between nobles in the royal court, it was the motivation that she needed to press again for taking a stand against the Storm King. While she won the first battle against Queen Novo, it ultimately led to losing the war. In the wake of the Storm King's defeat, Hippogriffia was left overextended occupying Zumidia while its young king grew into his role. However, even as Hippogriffia licked its wounds from losing the North Zebrican War, she never wavered in her belief that hippogriffs would survive and that friendship—as shown by Twilight—could endure, and that the lost territories could be negotiated back.\n\nThat was never put to the test, as Marelandia believed that with Hippogriffia weakened, a sister government could be established. In just a few short years, Skystar was thrust onto the throne after Novo perished at Mount Aris when MARESOC nuclear bombs were dropped upon the capital. Since then, Skystar's rule has been tenuous, yet she remains optimistic. Described as naive, willfully ignorant, and airheaded, she hides a cunning mind that has kept Hippogriffia from imploding. Ideally, that's a mistake that she intends for MARESOC to never recover from.\n\n§YPortrait by:§! Egil"
